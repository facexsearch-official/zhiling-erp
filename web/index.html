<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PISA 进销存</title>
<style>
/* 布局与主题见 /css/app-shell.css，此处仅保留页面组件样式 */
html{color-scheme:light}
select option{background:#fff;color:var(--gray-700)}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-title{font-size:19px;font-weight:600;color:var(--gray-800)}
.gd-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.gd-tb-left,.gd-tb-right{display:flex;align-items:center;gap:10px}
.search-box{position:relative;width:300px;flex:none}
.search-box input{width:100%;height:36px;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:0 12px 0 36px;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.search-box input:focus{border-color:var(--primary-400);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--gray-400);fill:none;stroke-width:2;pointer-events:none}
.th-tools{width:48px;padding:6px 8px}
.th-gear{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-md);color:var(--gray-500);transition:background .15s,color .15s}
.th-gear:hover{background:var(--gray-200);color:var(--primary-600)}
.th-gear svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.c-idx{width:48px;text-align:center;color:var(--gray-400);font-family:'Inter',monospace}
.th-actions{width:150px;position:sticky;right:0;z-index:2;background:#fff}
.th-tools::after{content:'';position:absolute;top:0;bottom:0;left:100%;width:4px;background:linear-gradient(to right,rgba(0,0,0,.08),rgba(0,0,0,0));pointer-events:none}
.th-actions::before{content:'';position:absolute;top:0;bottom:0;right:100%;width:4px;background:linear-gradient(to left,rgba(0,0,0,.08),rgba(0,0,0,0));pointer-events:none}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--gray-200);margin-bottom:16px}
.tab{padding:10px 16px;font-size:14px;color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--gray-700)}
.tab.active{color:var(--primary-600);border-bottom-color:var(--primary-500);font-weight:500}
.filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.search-wrapper{display:flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--gray-200);border-radius:var(--radius-md);background:#fff;width:260px}
.search-wrapper svg{color:var(--gray-400);width:16px;height:16px;flex-shrink:0}
.search-input{border:none;outline:none;font-size:14px;color:var(--gray-700);width:100%;background:none}
.filter-select{height:34px;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:0 10px;font-size:14px;color:var(--gray-600);background:#fff;outline:none}
.date-input{height:34px;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:0 10px;font-size:14px;color:var(--gray-600);background:#fff;outline:none}
.table-wrapper{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow:hidden}
.table-wrapper table{width:100%;border-collapse:collapse}
.table-wrapper th{background:var(--gray-50);font-size:13px;color:var(--gray-500);padding:10px 14px;text-align:left;font-weight:500;border-bottom:1px solid var(--gray-200)}
.table-wrapper td{padding:10px 14px;font-size:14px;border-bottom:1px solid var(--gray-100);color:var(--gray-700)}
.table-wrapper tr:last-child td{border-bottom:none}
.table-wrapper tr:hover td{background:var(--gray-50)}
.table-wrapper .num{text-align:right;font-variant-numeric:tabular-nums}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:13px;color:var(--gray-500)}
.pagination-btns{display:flex;gap:4px}
.page-btn{padding:4px 10px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);background:#fff;font-size:13px;cursor:pointer;color:var(--gray-600)}
.page-btn:hover{border-color:var(--gray-300)}
.page-btn.active{background:var(--primary-500);color:#fff;border-color:var(--primary-500)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-block;padding:2px 8px;border-radius:var(--radius-full);font-size:13px;font-weight:500;white-space:nowrap}
.badge-default{background:var(--gray-100);color:var(--gray-600)}
.badge-success{background:var(--success-50);color:var(--success-600)}
.badge-warning{background:var(--warning-50);color:var(--warning-600)}
.badge-danger{background:var(--danger-50);color:var(--danger-600)}
.badge-info{background:var(--info-50);color:var(--info-500)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-md);font-size:14px;font-weight:500;border:none;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--primary-500);color:#fff}.btn-primary:hover{background:var(--primary-600)}
.btn-secondary{background:#fff;color:var(--gray-700);border:1px solid var(--gray-200)}.btn-secondary:hover{background:var(--gray-50);border-color:var(--gray-300)}
.btn-teal{background:var(--success-500);color:#fff}.btn-teal:hover{background:var(--success-600)}
.btn-cyan{background:#00B8D4;color:#fff;border:1px solid #00B8D4}.btn-cyan:hover{background:#00A5C0;border-color:#00A5C0}
.btn-danger{background:#fff;color:var(--danger-500);border:1px solid var(--danger-500)}.btn-danger:hover{background:var(--danger-50)}
.btn-ghost{background:none;color:var(--gray-600);padding:6px 10px}.btn-ghost:hover{background:var(--gray-100)}
.btn-sm{padding:5px 10px;font-size:13px}
.op-btns{display:flex;gap:4px}
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;color:var(--gray-800);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.link{font-size:13px;color:var(--primary-500);cursor:pointer;font-weight:400}
.link:hover{text-decoration:underline}
.dash-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.dash-hello{font-size:23px;font-weight:700;color:var(--gray-800)}
.dash-sub{font-size:14px;color:var(--gray-400);margin-top:4px}
.dash-actions{display:flex;gap:8px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:18px 20px}
.stat-top{display:flex;justify-content:space-between;align-items:flex-start}
.stat-label{font-size:14px;color:var(--gray-500);margin-bottom:6px}
.stat-value{font-size:25px;font-weight:700;color:var(--gray-800);font-variant-numeric:tabular-nums}
.stat-change{font-size:13px;color:var(--success-500);margin-top:4px}
.stat-change.down{color:var(--danger-500)}
.stat-icon{width:42px;height:42px;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon svg{width:20px;height:20px}
.stat-icon.blue{background:var(--primary-50);color:var(--primary-500)}
.stat-icon.green{background:var(--success-50);color:var(--success-500)}
.stat-icon.orange{background:var(--warning-50);color:var(--warning-500)}
.stat-icon.red{background:var(--danger-50);color:var(--danger-500)}
.grid-2b{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--primary-300),var(--primary-500));transition:height .3s}
.bar-val{font-size:12px;color:var(--gray-500);margin-bottom:4px;font-variant-numeric:tabular-nums}
.bar-label{font-size:12px;color:var(--gray-400);margin-top:6px}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{width:140px;height:140px;border-radius:50%;position:relative;flex-shrink:0}
.donut-center{position:absolute;inset:28px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-center b{font-size:17px;font-weight:700;color:var(--gray-800)}
.donut-center span{font-size:12px;color:var(--gray-400)}
.legend{display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--gray-600)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-item b{margin-left:auto;font-variant-numeric:tabular-nums}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-100)}
.rank-row:last-child{border-bottom:none}
.rank-no{width:20px;height:20px;border-radius:var(--radius-sm);background:var(--gray-100);color:var(--gray-500);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.rank-no.top{background:var(--primary-500);color:#fff}
.rank-name{flex:1;font-size:14px;color:var(--gray-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-bar{width:100px;height:6px;background:var(--gray-100);border-radius:3px;overflow:hidden;flex-shrink:0}
.rank-bar i{display:block;height:100%;background:linear-gradient(90deg,#93c5fd,#3b82f6);border-radius:3px}
.rank-val{font-size:13px;color:var(--gray-500);width:66px;text-align:right;font-variant-numeric:tabular-nums}
.warn-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--gray-100);font-size:14px}
.warn-row:last-child{border-bottom:none}
.warn-name{flex:1;color:var(--gray-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warn-qty{font-size:13px;color:var(--gray-500);font-variant-numeric:tabular-nums}
.doc-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--gray-100);font-size:14px}
.doc-row:last-child{border-bottom:none}
.doc-no{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--primary-600);width:128px;flex-shrink:0}
.doc-party{flex:1;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-amt{width:88px;text-align:right;font-variant-numeric:tabular-nums;color:var(--gray-700)}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.quick-tile{border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:16px 6px;text-align:center;cursor:pointer;transition:all .15s}
.quick-tile:hover{border-color:var(--primary-500);color:var(--primary-600);box-shadow:0 2px 8px rgba(59,130,246,.12);transform:translateY(-1px)}
.quick-tile svg{width:22px;height:22px;margin-bottom:6px}
.quick-tile div{font-size:13px}
.overview-row{display:flex;align-items:center;gap:12px;padding:9px 0}
.overview-label{font-size:14px;color:var(--gray-600);width:78px;flex-shrink:0}
.overview-bar{flex:1;height:8px;background:var(--gray-100);border-radius:4px;overflow:hidden}
.overview-bar i{display:block;height:100%;border-radius:4px}
.overview-val{font-size:13px;color:var(--gray-500);width:64px;text-align:right;font-variant-numeric:tabular-nums}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.confirm-body{display:flex;gap:16px;align-items:flex-start}
.confirm-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.confirm-icon svg{width:24px;height:24px}
.confirm-icon.warn{background:#fef3cd;color:#f59e0b}
.confirm-icon.danger{background:#fee2e2;color:#ef4444}
.confirm-icon.info{background:#dbeafe;color:#3b82f6}
.confirm-text h3{font-size:16px;font-weight:600;margin:0 0 4px;color:var(--gray-800)}
.confirm-text p{font-size:14px;color:var(--gray-500);margin:0}
.confirm-text .detail{margin-top:8px;font-size:13px;color:var(--gray-400);background:var(--gray-50);padding:8px 12px;border-radius:6px}
.modal{background:#fff;border-radius:10px;width:640px;max-width:92vw;max-height:88vh;overflow:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--gray-200)}
.modal-title{font-size:17px;font-weight:600}
.modal-close{border:none;background:none;cursor:pointer;color:var(--gray-400);font-size:23px;line-height:1}
.modal-body{padding:20px}
.dep-modal{width:520px}
.dep-modal-head{justify-content:center;position:relative;padding:18px 20px}
.dep-modal-title{font-size:18px;font-weight:500;color:var(--gray-800)}
.dep-modal-head .modal-close{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:0}
.dep-modal-head .modal-close svg{width:18px;height:18px}
.dep-modal-head .modal-close:hover{background:var(--gray-100);color:var(--gray-600)}
.dep-modal-body{padding:28px 34px 8px}
.dep-row{display:flex;align-items:center;margin-bottom:24px}
.dep-label{width:92px;flex-shrink:0;font-size:15px;color:var(--gray-700)}
.dep-input{height:40px;border:1px solid #DCDFE6;border-radius:6px;padding:0 12px;font-size:15px;color:var(--gray-700);outline:none;background:#fff;transition:border-color .15s,box-shadow .15s}
.dep-input::placeholder{color:var(--gray-400)}
.dep-input:focus{border-color:#00B8D4;box-shadow:0 0 0 3px rgba(0,184,212,.12)}
.dep-input.dep-amount{width:400px}
select.dep-input{width:240px;color:var(--gray-700)}
select.dep-input:invalid,select.dep-input.empty{color:var(--gray-400)}
.dep-remark{width:400px}
#cuDepositModal .dep-modal-foot{display:flex;justify-content:flex-end;gap:12px;padding:6px 34px 28px;border-top:none}
.dep-btn-cancel{height:40px;padding:0 26px;border:1px solid #DCDFE6;background:#fff;color:var(--gray-700);border-radius:6px;font-size:15px;cursor:pointer}
.dep-btn-cancel:hover{background:var(--gray-50)}
.dep-btn-ok{height:40px;padding:0 26px;border:none;background:#00B8D4;color:#fff;border-radius:6px;font-size:15px;cursor:pointer}
.dep-btn-ok:hover{background:#00A5C0}
#cuDepositModal .fa-sel-opt.active{color:var(--accent-700)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.form-label{display:block;font-size:14px;color:var(--gray-600);margin-bottom:6px}
.form-input{width:100%;height:36px;border:1px solid var(--gray-300);border-radius:var(--radius-md);padding:0 10px;font-size:14px;outline:none;color:var(--gray-700)}
.form-input:focus{border-color:var(--primary-500)}
/* 自定义下拉（参考设计） */
.stsel{position:relative}
.stsel-input{display:flex;align-items:center;justify-content:space-between;gap:8px;height:36px;border:1px solid var(--gray-300);border-radius:var(--radius-md);padding:0 10px;font-size:14px;color:var(--gray-700);cursor:pointer;background:#fff;transition:border-color .15s,box-shadow .15s}
.stsel.open .stsel-input{border-color:var(--accent-400);box-shadow:0 0 0 3px rgba(16,185,129,.12)}
.stsel.disabled .stsel-input{background:var(--gray-50);color:var(--gray-400);cursor:not-allowed}
.stsel-caret{width:16px;height:16px;color:var(--gray-400);flex-shrink:0;transition:transform .15s}
.stsel.open .stsel-caret{transform:rotate(180deg)}
.stsel-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:210;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-md);box-shadow:0 10px 24px rgba(15,23,42,.12);padding:4px 0;max-height:240px;overflow-y:auto}
.stsel.open .stsel-panel{display:block}
.stsel-opt{position:relative;padding:9px 14px;font-size:14px;color:var(--gray-700);cursor:pointer;white-space:nowrap}
.stsel-label{white-space:nowrap}
.pc-field>.stsel{min-width:150px}
.stsel-opt:hover{background:var(--gray-50)}
.stsel-opt.active{color:var(--gray-900);font-weight:500;padding-left:32px}
.stsel-opt.active::before{content:'';position:absolute;left:13px;top:50%;width:6px;height:11px;border-right:2px solid var(--accent-600);border-bottom:2px solid var(--accent-600);transform:translateY(-60%) rotate(45deg)}
/* 采购列表（仿商品管理） */
.plist-wrap{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg)}
.plist-scroll{overflow-x:auto}
.plist-scroll::-webkit-scrollbar{height:6px}
.plist-scroll::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:5px}
.plist-scroll::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}
.plist-scroll::-webkit-scrollbar-track{background:var(--gray-100);border-radius:5px}
.plist-wrap table{width:100%;min-width:1100px;border-collapse:collapse}
.plist-wrap th{background:var(--gray-50);font-size:13px;color:var(--gray-500);padding:10px 14px;text-align:left;font-weight:500;border-bottom:1px solid var(--gray-200);white-space:nowrap;vertical-align:middle}
.plist-wrap th:not(.plist-tools):not(.plist-actions){min-width:170px}
.plist-wrap td{padding:10px 14px;font-size:14px;color:var(--gray-700);border-bottom:1px solid var(--gray-100);white-space:nowrap;vertical-align:middle}
.plist-wrap tr:last-child td{border-bottom:none}
.plist-wrap tr:hover td{background:var(--gray-50)}
.plist-wrap .num{text-align:right;font-variant-numeric:tabular-nums}
.plist-tools{width:44px;padding:6px 8px;text-align:center;position:sticky;left:0;z-index:3;background:var(--gray-50)}
.plist-idx{width:44px;text-align:center;color:var(--gray-400);position:sticky;left:0;z-index:2;background:#fff;font-variant-numeric:tabular-nums}
.plist-wrap tr:hover .plist-idx{background:var(--gray-50)}
.plist-tools::after,.plist-idx::after{content:'';position:absolute;top:0;bottom:0;left:100%;width:4px;background:linear-gradient(to right,rgba(0,0,0,.08),rgba(0,0,0,0));pointer-events:none}
.plist-actions{width:150px;position:sticky;right:0;z-index:2;background:#fff}
.plist-wrap tr:hover .plist-actions{background:var(--gray-50)}
.plist-actions::before{content:'';position:absolute;top:0;bottom:0;right:100%;width:4px;background:linear-gradient(to left,rgba(0,0,0,.08),rgba(0,0,0,0));pointer-events:none}
.plist-wrap tbody tr{cursor:pointer}
.plist-row-sel td,.plist-row-sel .plist-idx{background:var(--accent-50)!important}
.plist-sum td{background:var(--gray-50);font-weight:500;color:var(--gray-800);border-top:1px solid var(--gray-200)}
.plist-sum .plist-sum-idx{position:sticky;left:0;z-index:2;background:var(--gray-50);text-align:center;color:var(--gray-600)}
.plist-sum .plist-sum-idx::after{content:'';position:absolute;top:0;bottom:0;left:100%;width:4px;background:linear-gradient(to right,rgba(0,0,0,.08),rgba(0,0,0,0));pointer-events:none}
.pc-items-panel{display:flex;flex-direction:column;align-items:center;margin-top:14px}
.pc-items-toggle{display:inline-flex;align-items:center;gap:6px;padding:8px 22px;background:#fff;border:1px solid var(--gray-200);border-bottom:none;border-radius:12px 12px 0 0;font-size:15px;color:var(--gray-700);cursor:pointer}
.pc-items-toggle:hover{color:var(--accent-600)}
.pc-items-caret{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .15s}
.pc-items-toggle.collapsed .pc-items-caret{transform:rotate(180deg)}
.pc-items-body{width:100%;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow-x:auto}
.pc-items-body .pcv-tbl{width:100%;border-collapse:collapse;min-width:900px}
.pc-items-sum{text-align:right;padding:10px 14px;font-size:14px;color:var(--gray-600);border-top:1px solid var(--gray-100);background:var(--gray-50)}
.plist-gear-btn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-md);color:var(--gray-500);cursor:pointer;border:none;background:none;transition:background .15s,color .15s}
.plist-gear-btn:hover{background:var(--gray-200);color:var(--accent-600)}
.plist-gear-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
/* 套餐列表 */
.th-check,.c-check{width:44px;min-width:44px;max-width:44px;padding:10px 6px;text-align:center}
.th-check input,.c-check input{width:16px;height:16px;accent-color:var(--primary-500);cursor:pointer;vertical-align:middle}
.list-thumb{width:42px;height:42px;border-radius:var(--radius-md);object-fit:cover;background:var(--gray-100);display:block}
.list-thumb-ph{width:42px;height:42px;border-radius:var(--radius-md);background:var(--gray-100);display:flex;align-items:center;justify-content:center}

.pc-field{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--gray-600)}
.pc-tbl-wrap{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow-x:auto;margin-bottom:16px}

.pc-plus,.pc-minus{width:20px;height:20px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;line-height:1;cursor:pointer;border:none;padding:0}

.pcgm-pager{border-top:1px solid var(--gray-100);background:#fff}
.pcgm-main{flex:1;display:flex;flex-direction:column;min-width:0}

/* 商品名称搜索下拉 */

.pcnd-tbl th{background:var(--gray-50);font-size:13px;color:var(--gray-500);padding:8px 12px;text-align:left;font-weight:500;border-bottom:1px solid var(--gray-200);white-space:nowrap}
.pcnd-tbl td{padding:6px 12px;font-size:14px;color:var(--gray-700);border-bottom:1px solid var(--gray-100);vertical-align:middle;white-space:nowrap}

.pcnd-goods{display:flex;align-items:center;gap:10px}

.ti-row{display:flex;align-items:flex-start;gap:20px;padding:16px 0;border-bottom:1px solid var(--gray-100)}

.region-col.wide{width:auto;min-width:240px;max-height:300px}

.cu-tbl{width:100%;border-collapse:collapse}

<script>
/* ═══════════ State ═══════════ */
const State = {
  token: localStorage.getItem('pisa_token') || '',
  user: JSON.parse(localStorage.getItem('pisa_user') || '{}'),
  tenants: JSON.parse(localStorage.getItem('pisa_tenants') || '[]'),
  currentTenant: JSON.parse(localStorage.getItem('pisa_currentTenant') || 'null'),
  perms: JSON.parse(localStorage.getItem('pisa_perms') || 'null'),
  sens: JSON.parse(localStorage.getItem('pisa_sens') || 'null'),
};
function saveState(){
  localStorage.setItem('pisa_token', State.token);
  localStorage.setItem('pisa_user', JSON.stringify(State.user));
  localStorage.setItem('pisa_tenants', JSON.stringify(State.tenants));
  localStorage.setItem('pisa_currentTenant', JSON.stringify(State.currentTenant));
  localStorage.setItem('pisa_perms', JSON.stringify(State.perms));
  localStorage.setItem('pisa_sens', JSON.stringify(State.sens));
}

/* ═══════════ 权限 ═══════════ */
// 未加载权限时（null）默认放行，避免登录前闪烁
function permAllows(map, key){
  if(map===null||map===undefined) return true;
  if(map['*']||map[key]) return true;
  var p=key.split('.');
  for(var i=p.length-1;i>=1;i--){ if(map[p.slice(0,i).join('.')+'.*']) return true; }
  return false;
}
function can(key){ return permAllows(State.perms, key); }
function canSens(key){ return permAllows(State.sens, key); }
function pattr(key){ return ' data-perm="'+key+'"'; }
function sattr(key){ return ' data-perm-sens="'+key+'"'; }
function applyPermsTo(node){
  if(!node||node.nodeType!==1) return;
  var els=[];
  if(node.matches && node.matches('[data-perm],[data-perm-sens]')) els.push(node);
  if(node.querySelectorAll) node.querySelectorAll('[data-perm],[data-perm-sens]').forEach(function(e){ els.push(e); });
  els.forEach(function(el){
    var p=el.getAttribute('data-perm'), s=el.getAttribute('data-perm-sens');
    if(p && !can(p)) el.style.display='none';
    if(s && !canSens(s)) el.style.display='none';
  });
}
function applyPerms(root){ applyPermsTo(root||document.documentElement); }
function startPermObserver(){
  try{
    new MutationObserver(function(muts){
      muts.forEach(function(m){ m.addedNodes.forEach(applyPermsTo); });
    }).observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){}
  applyPerms(document.documentElement);
}
window.can=can; window.canSens=canSens; window.applyPerms=applyPerms;

/* ═══════════ API ═══════════ */
const API_BASE = '/api';
async function api(path, opts={}){
  const headers = {'Content-Type':'application/json'};
  if(State.token) headers['Authorization']='Bearer '+State.token;
  const res = await fetch(API_BASE+path, {...opts, headers});
  const data = await res.json();
  if(res.status===401){logout();return null;}
  return data;
}
async function apiGet(path){return api(path);}
async function apiPost(path,body){return api(path,{method:'POST',body:JSON.stringify(body)});}

/* ═══════════ Helpers ═══════════ */
const ICS='viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"';
const IC={
  purchase:'<svg '+ICS+'><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h2l2.6 12.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6L21.5 7H5.1"/></svg>',
  sales:'<svg '+ICS+'><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>',
  stock:'<svg '+ICS+'><path d="M22 8.35V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.35A2 2 0 0 1 3.26 6.5l8-3.2a2 2 0 0 1 1.48 0l8 3.2A2 2 0 0 1 22 8.35Z"/><path d="M6 18h12"/><path d="M6 14h12"/></svg>',
  finance:'<svg '+ICS+'><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>',

function findNavLabel(key){
  var nav=(window.PisaShell&&PisaShell.NAV)||[];
  for(var i=0;i<nav.length;i++){
    var m=nav[i];
    if(m.key===key)return {label:m.label,mod:m};
    if(m.cols){
      for(var j=0;j<m.cols.length;j++){
        var items=m.cols[j].items||[];
        for(var k=0;k<items.length;k++) if(items[k].key===key) return {label:items[k].label,mod:m};
      }
    }
  }
  return null;
}

  }
  var f=findNavLabel(key);
  let label=TAB_LABELS[key]||(f&&f.label)||EXTRA_LABELS[key]||key;

  var standalone={'goods':'/goods.html','customer':'/customer.html','supplier':'/supplier.html','warehouse':'/warehouse.html','account':'/account.html'};
  if(standalone[key]){location.href=standalone[key];return;}
  if(window.PisaTabs) PisaTabs.touch(key, label, PisaTabs.hrefFor(key));
  if(location.hash.slice(1)!==key){try{history.replaceState(null,'','#'+key);}catch(e){}}
  const c=document.getElementById('content');
  var formOpenKeys=['customer:create','customer:view','purchase:create','purchase-order:create','purchase-return:create','sale:create','sale-order:create','sale-return:create','quote:create','stock:take:create'];
  c.classList.toggle('form-open', formOpenKeys.indexOf(key)>=0);
  if(key==='home'){c.innerHTML=homeHTML();return;}
  var vk=PAGE_PERM[key];
  if(vk && !can(vk)){ c.innerHTML=noPermHTML(); return; }
  const pageKey=SPA_PAGES[key]||key;
  const dynamic=dynamicPageHTML(pageKey);
  if(dynamic!==null){c.innerHTML=dynamic;return;}
  c.innerHTML=pageHTML(key,label);
}

function handleHash(){
  let raw='home';
  if(location.hash&&location.hash.length>1){
    try{raw=decodeURIComponent(location.hash.slice(1));}catch(e){raw=location.hash.slice(1);}
  }
  if(!raw)raw='home';
  var idx=raw.indexOf('/');
  var key=idx>=0?raw.slice(0,idx):raw;
  var arg=idx>=0?raw.slice(idx+1):'';
  showPage(key, arg);
}

async function loadPurchaseData(key,page,keyword){
  var wrap=document.getElementById('purchaseTableWrap');
  if(!wrap) return;
  var path='/shop/'+{purchases:'purchase','purchase-order':'purchase-order','purchase-return':'purchase-return'}[key]+'/list?page='+page+'&page_size=10';
  if(keyword) path+='&keyword='+encodeURIComponent(keyword);
  var res=await apiGet(path);
  if(!res||res.code!==0){wrap.innerHTML='<div style="padding:40px;text-align:center;color:var(--gray-400)">加载失败</div>';return;}
  var list=res.data.list||[];
  var total=res.data.total||0;
  var cols=getPurchaseCols(key);
  var h='<table><thead><tr>';
  cols.forEach(function(c){h+='<th'+(c.a==='right'?' class="num"':'')+'>'+c.l+'</th>';});
  h+='<th style="width:140px">操作</th></tr></thead><tbody>';
  if(list.length===0){
    h+='<tr><td colspan="'+(cols.length+1)+'" style="text-align:center;padding:40px;color:var(--gray-400)">暂无数据</td></tr>';
  }else{
    list.forEach(function(row){
      h+='<tr>';
      cols.forEach(function(c){
        var v=row[c.key]||'-';
        if(c.format) v=c.format(v,row);
        if(c.badge) v=B(v);
        h+='<td'+(c.a==='right'?' class="num"':'')+'>'+v+'</td>';
      });
      h+='<td class="table-actions">';
      if(row.status===1) h+='<button class="btn btn-ghost btn-sm" onclick="showToast(\'编辑功能开发中\')">编辑</button><button class="btn btn-teal btn-sm" onclick="purchaseAudit(\''+key+'\','+row.id+')">审核</button><button class="btn btn-danger btn-sm" onclick="purchaseDelete(\''+key+'\','+row.id+')">删除</button>';
      else if(row.status===3) h+='<button class="btn btn-ghost btn-sm" onclick="showToast(\'查看功能开发中\')">查看</button><button class="btn btn-ghost btn-sm" onclick="purchaseUnaudit(\''+key+'\','+row.id+')">反审核</button>';
      else h+='<button class="btn btn-ghost btn-sm" onclick="showToast(\'查看功能开发中\')">查看</button>';
      h+='</td></tr>';
    });
  }
  h+='</tbody></table>';
  h+='<div class="pagination"><span>共 '+total+' 条</span><div class="pagination-btns">';
  var pages=Math.ceil(total/10)||1;
  h+='<button class="page-btn" '+(page<=1?'disabled':'')+" onclick=\"loadPurchaseData('"+key+"',"+(page-1)+",'')\">上一页</button>";
  for(var i=1;i<=Math.min(pages,5);i++){
    h+='<button class="page-btn'+(i===page?' active':'')+"\" onclick=\"loadPurchaseData('"+key+"',"+i+",'')\">"+i+'</button>';
  }
  h+='<button class="page-btn" '+(page>=pages?'disabled':'')+" onclick=\"loadPurchaseData('"+key+"',"+(page+1)+",'')\">下一页</button>";
  h+='</div></div>';
  wrap.innerHTML=h;
}

function getPurchaseCols(key){
  if(key==='purchases') return [
    {key:'order_no',l:'单据编号'},{key:'supplier_name',l:'供应商'},{key:'bill_date',l:'单据日期'},
    {key:'total_amount',l:'总金额',a:'right',format:function(v){return '¥'+Number(v).toLocaleString();}},
    {key:'paid_amount',l:'已付金额',a:'right',format:function(v){return '¥'+Number(v).toLocaleString();}},
    {key:'unpaid_amount',l:'未付金额',a:'right',format:function(v){return '¥'+Number(v).toLocaleString();}},
    {key:'status',l:'状态',badge:1,format:function(v){return {1:'草稿',2:'待审核',3:'已生效',4:'已作废'}[v]||'未知';}}
  ];
  if(key==='purchase-order') return [
    {key:'order_no',l:'订单编号'},{key:'supplier_name',l:'供应商'},{key:'order_date',l:'订单日期'},
    {key:'total_amount',l:'订单金额',a:'right',format:function(v){return '¥'+Number(v).toLocaleString();}},
    {key:'status',l:'状态',badge:1,format:function(v){return {1:'草稿',2:'待审核',3:'已生效',4:'已转换',5:'已取消'}[v]||'未知';}}
  ];
  return [
    {key:'order_no',l:'退货单号'},{key:'supplier_name',l:'供应商'},{key:'bill_date',l:'退货日期'},
    {key:'total_amount',l:'退货金额',a:'right',format:function(v){return '¥'+Number(v).toLocaleString();}},
    {key:'status',l:'状态',badge:1,format:function(v){return {1:'草稿',2:'待审核',3:'已生效',4:'已作废'}[v]||'未知';}}
  ];
}

function searchPurchase(key,keyword){
  clearTimeout(window._purchaseSearchTimer);

}
function filterPurchase(key,tab,el){
  el.parentElement.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  loadPurchaseData(key,1,'');
}

async function purchaseUnaudit(key,id){

async function purchaseDelete(key,id){
  if(!confirm('确定删除？')) return;
  var path='/shop/'+{purchases:'purchase','purchase-order':'purchase-order','purchase-return':'purchase-return'}[key]+'/'+id;
  var res=await apiGet(path); // just check exists
  // use DELETE method
  var token=localStorage.getItem('pisa_token');
  var r=await fetch(API_BASE+path,{method:'DELETE',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}});
  var d=await r.json();
  if(d.code===0){showToast('删除成功');loadPurchaseData(key,1,'');}
  else showToast(d.message||'删除失败','error');
}

    h+='<tr id="poEmptyRow"><td colspan="5" style="text-align:center;color:var(--gray-400);padding:20px">点击"添加商品"增加明细行</td></tr>';
    h+='</tbody></table></div>';
    h+='<div style="margin-top:12px;text-align:right;font-weight:500">合计：<span id="poTotal" style="color:var(--primary-500)">¥0.00</span></div>';

    document.getElementById('modalTitle').textContent=title;

    document.getElementById('modal').classList.add('show');

function addPurchaseItem(){
  var tbody=document.getElementById('poItemsBody');
  var empty=document.getElementById('poEmptyRow');
  if(empty) empty.remove();
  var idx=window._poItemCount++;
  var h='<tr data-idx="'+idx+'"><td><select class="form-input form-select" style="min-width:160px" id="poItemGoods'+idx+'" onchange="poItemPrice('+idx+')">';
  _goods.forEach(function(g){h+='<option value="'+g.id+'" data-price="'+g.purchase_price+'">'+g.name+'</option>';});
  h+='</select></td><td><input class="form-input" type="number" min="1" value="1" id="poItemQty'+idx+'" onchange="poCalc('+idx+')"></td>'+
    '<td><input class="form-input" type="number" step="0.01" value="0" id="poItemPrice'+idx+'" onchange="poCalc('+idx+')"></td>'+
    '<td id="poItemAmt'+idx+'" style="text-align:right">¥0.00</td>'+
    '<td><button class="btn btn-ghost btn-sm text-danger" onclick="removePoItem('+idx+')">删</button></td></tr>';
  tbody.insertAdjacentHTML('beforeend',h);
  poItemPrice(idx);
}
function poItemPrice(idx){
  var sel=document.getElementById('poItemGoods'+idx);
  if(!sel) return;
  var opt=sel.options[sel.selectedIndex];
  var price=opt?parseFloat(opt.getAttribute('data-price'))||0:0;
  document.getElementById('poItemPrice'+idx).value=price;
  poCalc(idx);
}
function poCalc(idx){
  var qty=parseFloat(document.getElementById('poItemQty'+idx).value)||0;
  var price=parseFloat(document.getElementById('poItemPrice'+idx).value)||0;
  var amt=qty*price;
  document.getElementById('poItemAmt'+idx).textContent='¥'+amt.toFixed(2);
  poTotalCalc();
}
function poTotalCalc(){
  var total=0;
  for(var i=0;i<window._poItemCount;i++){
    var el=document.getElementById('poItemAmt'+i);
    if(el) total+=parseFloat(el.textContent.replace('¥',''))||0;
  }
  var t=document.getElementById('poTotal');
  if(t) t.textContent='¥'+total.toFixed(2);
}
function removePoItem(idx){
  var tr=document.querySelector('#poItemsTable tr[data-idx="'+idx+'"]');
  if(tr) tr.remove();
  poTotalCalc();
  if(!document.querySelector('#poItemsTable tbody tr')){
    document.getElementById('poItemsBody').innerHTML='<tr id="poEmptyRow"><td colspan="5" style="text-align:center;color:var(--gray-400);padding:20px">点击"添加商品"增加明细行</td></tr>';
  }
}

async function submitPurchase(key){
  var supplier_id=parseInt(document.getElementById('poSupplier').value)||0;
  var bill_date=document.getElementById('poDate').value;
  var warehouse_id=parseInt(document.getElementById('poWarehouse').value)||0;
  var remark=document.getElementById('poRemark').value;
  if(!supplier_id){showToast('请选择供应商','error');return;}
  if(!bill_date){showToast('请选择日期','error');return;}
  var items=[];
  for(var i=0;i<window._poItemCount;i++){
    var goodsEl=document.getElementById('poItemGoods'+i);
    var qtyEl=document.getElementById('poItemQty'+i);
    var priceEl=document.getElementById('poItemPrice'+i);
    if(!goodsEl) continue;
    items.push({goods_id:parseInt(goodsEl.value),quantity:parseInt(qtyEl.value)||1,unit_price:parseFloat(priceEl.value)||0});
  }
  if(items.length===0){showToast('请添加明细','error');return;}
  var body={supplier_id:supplier_id,bill_date:bill_date,warehouse_id:warehouse_id,remark:remark,items:items};
  var path='/shop/'+{purchases:'purchase','purchase-order':'purchase-order','purchase-return':'purchase-return'}[key];
  var res=await apiPost(path,body);
  if(res&&res.code===0){showToast('创建成功');hideModal();loadPurchaseData(key,1,'');}
  else showToast(res?res.message:'创建失败','error');
}

  if(keyword) path+='&keyword='+encodeURIComponent(keyword);

  if(!res||res.code!==0){wrap.innerHTML='<div style="padding:40px;text-align:center;color:var(--gray-400)">加载失败</div>';return;}
  var list=res.data.list||[];
  var total=res.data.total||0;
  var cols=getSettingCols(apiKey);
  var h='<table><thead><tr>';
  cols.forEach(function(c){h+='<th'+(c.a==='right'?' class="num"':'')+'>'+c.l+'</th>';});
  h+='<th style="width:120px">操作</th></tr></thead><tbody>';
  if(list.length===0){
    h+='<tr><td colspan="'+(cols.length+1)+'" style="text-align:center;padding:40px;color:var(--gray-400)">暂无数据</td></tr>';
  }else{
    list.forEach(function(row){
      h+='<tr>';
      cols.forEach(function(c){
        var v=row[c.key]!==undefined?row[c.key]:'-';
        if(c.format) v=c.format(v,row);
        h+='<td'+(c.a==='right'?' class="num"':'')+'>'+v+'</td>';
      });
      h+='<td class="table-actions"><button class="btn btn-ghost btn-sm" onclick="showSettingEdit(\''+apiKey+'\','+row.id+')">编辑</button><button class="btn btn-danger btn-sm" onclick="settingDelete(\''+apiKey+'\','+row.id+')">删除</button></td></tr>';
    });
  }
  h+='</tbody></table>';
  h+='<div class="pagination"><span>共 '+total+' 条</span><div class="pagination-btns">';
  var pages=Math.ceil(total/10)||1;
  h+='<button class="page-btn" '+(page<=1?'disabled':'')+" onclick=\"loadSettingData('"+apiKey+"',"+(page-1)+",'')\">上一页</button>";
  for(var i=1;i<=Math.min(pages,5);i++){
    h+='<button class="page-btn'+(i===page?' active':'')+"\" onclick=\"loadSettingData('"+apiKey+"',"+i+",'')\">"+i+'</button>';
  }
  h+='<button class="page-btn" '+(page>=pages?'disabled':'')+" onclick=\"loadSettingData('"+apiKey+"',"+(page+1)+",'')\">下一页</button>";
  h+='</div></div>';
  wrap.innerHTML=h;
}

function getSettingCols(apiKey){
  if(apiKey==='supplier') return [{key:'code',l:'编码'},{key:'name',l:'供应商名称'},{key:'contact',l:'联系人'},{key:'phone',l:'电话'},{key:'total_payable',l:'应付余额',a:'right',format:function(v){return '¥'+Number(v||0).toLocaleString();}}];
  if(apiKey==='customer') return [{key:'code',l:'编码'},{key:'name',l:'客户名称'},{key:'contact',l:'联系人'},{key:'phone',l:'电话'},{key:'balance',l:'应收余额',a:'right',format:function(v){return '¥'+Number(v||0).toLocaleString();}}];
  if(apiKey==='warehouse') return [{key:'name',l:'仓库名称'},{key:'type',l:'类型',format:function(v){return {1:'普通仓',2:'原料仓',3:'成品仓'}[v]||'未知';}},{key:'address',l:'地址'},{key:'keeper',l:'负责人'}];
  if(apiKey==='goods') return [{key:'code',l:'编码'},{key:'name',l:'商品名称'},{key:'barcode',l:'条码'},{key:'purchase_price',l:'进货价',a:'right',format:function(v){return '¥'+Number(v||0).toFixed(2);}},{key:'retail_price',l:'零售价',a:'right',format:function(v){return '¥'+Number(v||0).toFixed(2);}}];
  if(apiKey==='account') return [{key:'name',l:'账户名称'},{key:'type',l:'类型',format:function(v){return {1:'现金',2:'银行',3:'在线'}[v]||'未知';}},{key:'balance',l:'余额',a:'right',format:function(v){return '¥'+Number(v||0).toLocaleString();}}];
  return [];
}

async function submitSetting(apiKey,id){
  var body={};
  if(apiKey==='supplier'||apiKey==='customer'){
    body={code:gv('sf_code'),name:gv('sf_name'),contact:gv('sf_contact'),phone:gv('sf_phone'),address:gv('sf_address'),remark:gv('sf_remark')};
  }else if(apiKey==='warehouse'){
    body={name:gv('sf_name'),type:parseInt(gv('sf_type'))||1,address:gv('sf_address'),keeper:gv('sf_keeper')};
  }else if(apiKey==='goods'){
    body={code:gv('sf_code'),name:gv('sf_name'),barcode:gv('sf_barcode'),purchase_price:parseFloat(gv('sf_purchase_price'))||0,retail_price:parseFloat(gv('sf_retail_price'))||0,wholesale_price:parseFloat(gv('sf_wholesale_price'))||0};
  }else if(apiKey==='account'){
    body={name:gv('sf_name'),type:parseInt(gv('sf_type'))||1};
  }
  if(!body.name){showToast('请填写名称','error');return;}
  var res;
  if(id) res=await apiPut('/shop/'+apiKey+'/'+id,body);
  else res=await apiPost('/shop/'+apiKey,body);
  if(res&&res.code===0){showToast(id?'更新成功':'创建成功');hideModal();loadSettingData(apiKey,1,'');}
  else showToast(res?res.message:'操作失败','error');
}

async function settingDelete(apiKey,id){
  if(!confirm('确定删除？')) return;
  var token=localStorage.getItem('pisa_token');
  var r=await fetch(API_BASE+'/shop/'+apiKey+'/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}});
  var d=await r.json();
  if(d.code===0){showToast('删除成功');loadSettingData(apiKey,1,'');}
  else showToast(d.message||'删除失败','error');
}

function showToast(msg){

var _confirmResolve=null;
function showConfirm(opts){
  return new Promise(function(resolve){
    _confirmResolve=resolve;
    document.getElementById('confirmTitle').textContent=opts.title||'确认操作';
    document.getElementById('confirmMsg').textContent=opts.message||'确定要执行此操作吗？';
    document.getElementById('confirmDesc').textContent=opts.desc||'';
    var d=document.getElementById('confirmDetail');
    if(opts.detail){d.textContent=opts.detail;d.style.display='block';}else{d.style.display='none';}
    var icon=document.getElementById('confirmIcon');
    icon.className='confirm-icon '+(opts.iconType||'warn');
    var okBtn=document.getElementById('confirmOkBtn');
    okBtn.textContent=opts.okText||'确定';
    okBtn.className='btn '+(opts.okClass||'btn-primary');
    document.getElementById('confirmModal').classList.add('show');
  });
}
function closeConfirm(){
  document.getElementById('confirmModal').classList.remove('show');
  if(_confirmResolve){var r=_confirmResolve;_confirmResolve=null;r(false);}
}
function doConfirm(){
  var r=_confirmResolve;_confirmResolve=null;
  document.getElementById('confirmModal').classList.remove('show');
  if(r)r(true);
}
(function(){var ov=document.getElementById('confirmModal');if(ov)ov.addEventListener('click',function(e){if(e.target===ov)closeConfirm();});})();

/* 自定义下拉 */
function stSelValue(id){ var e=document.getElementById(id); return e?e.getAttribute('data-value'):''; }
function stSelHTML(id, value, opts, disabled){
  var sel = opts.filter(function(o){return String(o.v)===String(value);})[0] || opts[0] || {v:'',t:''};
  var h='<div class="stsel'+(disabled?' disabled':'')+'" id="'+id+'" data-value="'+sel.v+'">'
    +'<div class="stsel-input" onclick="toggleStSel(\''+id+'\',event)"><span class="stsel-label">'+stEsc(sel.t)+'</span>'
    +'<svg class="stsel-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>'
    +'<div class="stsel-panel">';
  opts.forEach(function(o){
    h+='<div class="stsel-opt'+(String(o.v)===String(sel.v)?' active':'')+'" data-value="'+o.v+'" onclick="pickStSel(\''+id+'\',\''+o.v+'\',this,event)">'+stEsc(o.t)+'</div>';
  });
  h+='</div></div>';
  return h;
}
function toggleStSel(id, ev){
  if(ev) ev.stopPropagation();
  var e=document.getElementById(id); if(!e||e.classList.contains('disabled')) return;
  var open=e.classList.contains('open'); closeAllStSel(); if(!open) e.classList.add('open');
}
function pickStSel(id, val, opt, ev){
  if(ev) ev.stopPropagation();
  var e=document.getElementById(id); if(!e) return;
  e.setAttribute('data-value', val);
  var lbl=e.querySelector('.stsel-label'); if(lbl&&opt) lbl.textContent=opt.textContent.trim();
  e.querySelectorAll('.stsel-opt').forEach(function(o){ o.classList.toggle('active', String(o.getAttribute('data-value'))===String(val)); });
  if(window.onStSelChange) window.onStSelChange(id, val);
  closeAllStSel();
}
function closeAllStSel(){ document.querySelectorAll('.stsel.open').forEach(function(e){ e.classList.remove('open'); }); }
document.addEventListener('click', function(e){ if(!e.target.closest || !e.target.closest('.stsel')) closeAllStSel(); });

async function submitStaffModal(){
  if(StaffModal.mode==='commission'){ return submitCommissionRule(); }
  if(StaffModal.mode==='user'){
    const name=gv('suName').trim();
    if(!name){ showToast('请输入姓名','error'); return; }
    if(StaffModal.id){
      const st=document.getElementById('suStatusSel');
      const body={ name:name, role:parseInt(stSelValue('suRoleSel'),10)||0, role_id:parseInt(stSelValue('suRoleIdSel'),10)||0 };
      if(st && !st.classList.contains('disabled')) body.status=parseInt(stSelValue('suStatusSel'),10);
      const res=await apiPut('/shop/staff/users/'+StaffModal.id, body);
      if(res&&res.code===0){ showToast('修改成功'); hideStaffModal(); loadStaffUsers(); }
      else showToast((res&&res.message)||'操作失败','error');
    }else{
      const pwd=gv('suPwd');
      if(pwd.length<6){ showToast('初始密码至少6位','error'); return; }
      const body={ name:name, phone:gv('suPhone').trim(), role:parseInt(stSelValue('suRoleSel'),10)||3, role_id:parseInt(stSelValue('suRoleIdSel'),10)||0, password:pwd };
      const res=await apiPost('/shop/staff/users', body);
      if(res&&res.code===0){ showToast('新增成功'); hideStaffModal(); loadStaffUsers(); }
      else showToast((res&&res.message)||'操作失败','error');
    }
  }else if(StaffModal.mode==='salesman'){
    const name=gv('ssName').trim();
    if(!name){ showToast('请输入业务员姓名','error'); return; }
    const body={ name:name, phone:gv('ssPhone').trim(), shop_id:parseInt(stSelValue('ssShopSel'),10)||0 };
    const res = StaffModal.id
      ? await apiPut('/shop/salesmen/'+StaffModal.id, body)
      : await apiPost('/shop/salesmen', body);
    if(res&&res.code===0){ showToast(StaffModal.id?'修改成功':'新增成功'); hideStaffModal(); loadStaffSalesmen(); }
    else showToast((res&&res.message)||'操作失败','error');
  }else if(StaffModal.mode==='shop'){
    const name=gv('shName').trim();
    if(!name){ showToast('请输入门店名称','error'); return; }
    const cb=document.getElementById('shIsMain');
    const body={ name:name, phone:gv('shPhone').trim(), address:gv('shAddress').trim(), is_main:(cb&&cb.checked)?1:0 };
    const res = StaffModal.id
      ? await apiPut('/shop/shops/'+StaffModal.id, body)
      : await apiPost('/shop/shops', body);
    if(res&&res.code===0){ showToast(StaffModal.id?'修改成功':'新增成功'); hideStaffModal(); loadShopsPage(); }
    else showToast((res&&res.message)||'操作失败','error');
  }
}

  if(res&&res.code===0){ showToast('删除成功'); loadStaffSalesmen(); }

}

function purchaseDatePreset(t){
  function fmt(d){ return d.toISOString().slice(0,10); }
  var now=new Date(), from='', to=fmt(now);
  if(t==='今日'){ from=fmt(now); to=fmt(now); }
  else if(t==='本周'){ var w=new Date(now.getTime()-((now.getDay()||7)-1)*86400000); from=fmt(w); to=fmt(now); }
  else if(t==='上月'){ from=fmt(new Date(now.getFullYear(),now.getMonth()-1,1)); to=fmt(new Date(now.getFullYear(),now.getMonth(),0)); }
  else if(t==='本月'){ from=fmt(new Date(now.getFullYear(),now.getMonth(),1)); to=fmt(now); }
  else if(t==='去年'){ from=fmt(new Date(now.getFullYear()-1,0,1)); to=fmt(new Date(now.getFullYear()-1,11,31)); }
  else if(t==='本年'){ from=fmt(new Date(now.getFullYear(),0,1)); to=fmt(now); }
  else if(t==='最近一年'){ from=fmt(new Date(now.getFullYear()-1,now.getMonth(),now.getDate())); to=fmt(now); }
  else { from=''; to=''; }
  var f=document.getElementById('pcDateFrom'), tt=document.getElementById('pcDateTo');
  if(f) f.value=from; if(tt) tt.value=to;
  loadPurchases(1);
}
function pcSearchDebounce(){ clearTimeout(window._pcSearchTimer); window._pcSearchTimer=setTimeout(function(){ loadPurchases(1); },300); }

async function loadPurchases(page){
  PC_PAGE.page=page||1;
  PC_PAGE.keyword=gv('pcSearch');
  PC_PAGE.dateFrom=gv('pcDateFrom');
  PC_PAGE.dateTo=gv('pcDateTo');
  var wrap=document.getElementById('purchaseListBody'); if(!wrap) return;
  var path=PC_KINDS[pcListKind].base+'/list?page='+PC_PAGE.page+'&page_size=10';
  if(PC_PAGE.keyword) path+='&keyword='+encodeURIComponent(PC_PAGE.keyword);
  if(PC_PAGE.dateFrom) path+='&date_from='+PC_PAGE.dateFrom;
  if(PC_PAGE.dateTo) path+='&date_to='+PC_PAGE.dateTo;
  var res=await apiGet(path);
  if(!res||res.code!==0){ wrap.innerHTML='<div style="padding:40px;text-align:center;color:var(--gray-400)">加载失败</div>'; return; }
  var list=res.data.list||[], total=res.data.total||0;
  if(PC_PAGE.hideVoid) list=list.filter(function(r){ return pcListKind==='order' ? r.status!==5 : r.status!==4; });
  renderPurchases(list,total);
}

function purchaseCell(c,row){
  var v=row[c.key];
  if(c.key==='status' && pcListKind==='order'){
    var map={1:'草稿',2:'待审核',3:'未转进货',4:'已转进货',5:'已关闭'};
    var colors={1:'var(--gray-500)',2:'#F59E0B',3:'var(--danger-500)',4:'var(--success-600)',5:'var(--gray-400)'};
    var t=map[Number(v)]||'未知';
    return '<span style="display:inline-flex;align-items:center;gap:5px;color:'+(colors[Number(v)]||'inherit')+'"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>'+t+'</span>';
  }
  if(c.key==='status' && pcListKind==='return'){
    var rmap={1:'草稿',2:'待审核',3:'已生效',4:'已作废'};
    var rcolors={1:'var(--gray-500)',2:'#F59E0B',3:'var(--success-600)',4:'var(--danger-500)'};
    var rt=rmap[Number(v)]||'未知';
    return '<span style="display:inline-flex;align-items:center;gap:5px;color:'+(rcolors[Number(v)]||'inherit')+'"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>'+rt+'</span>';
  }
  if(c.key==='status' && pcListKind==='saleorder'){
    var omap={1:'草稿',2:'待审核',3:'已生效',4:'已取消'};
    var ocolors={1:'var(--gray-500)',2:'#F59E0B',3:'var(--success-600)',4:'var(--danger-500)'};
    var ot=omap[Number(v)]||'未知';
    return '<span style="display:inline-flex;align-items:center;gap:5px;color:'+(ocolors[Number(v)]||'inherit')+'"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>'+ot+'</span>';
  }
  if(c.key==='receive_status'){
    var rsmap={0:'未收款',1:'部分收款',2:'已收清'};
    var rscolors={0:'var(--danger-500)',1:'#F59E0B',2:'var(--success-600)'};
    return '<span style="color:'+(rscolors[Number(v)]||'inherit')+'">'+(rsmap[Number(v)]||'未知')+'</span>';
  }
  if(c.num){ return '<span style="color:var(--gray-400)">¥</span>'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
  if(c.key==='invoice_status'){ return Number(v)===1?'<span style="color:var(--success-600)">已开票</span>':'<span style="color:var(--danger-500)">未开票</span>'; }
  if(c.key==='attachments'){
    if(!v) return '-';
    try{ var arr=JSON.parse(v); if(arr&&arr[0]) return '<img src="'+stEsc(arr[0])+'" style="width:34px;height:34px;object-fit:cover;border-radius:4px">'; }catch(e){}
    return '-';
  }
  if(c.key==='related_no') return stEsc(v||'--');
  if(c.key==='related_order_no') return stEsc(v||'--');
  if(c.key==='order_date') return stEsc(v||'-');
  if(c.key==='bill_date') return stEsc(v||'-');
  if(c.key==='order_no') return stEsc(v||'-');
  if(c.key==='created_at'){ var s=String(v||'').replace('T',' '); return stEsc(s? s.slice(0,19) : '-'); }
  if(c.key==='print_status'){ return Number(v)===1?'<span style="color:var(--success-600)">已打印</span>':'<span style="color:var(--danger-500)">未打印</span>'; }
  return stEsc(v==null||v===''?'-':v);
}

function pcReorderCol(from,to,after){
  if(!pcDraftCols) return;
  var arr=pcDraftCols.filter(function(k){ return k!==from; });
  var ti=arr.indexOf(to);
  if(ti<0) ti=arr.length; else if(after) ti+=1;

}
function initPurchaseColsDnD(){
  var grid=document.getElementById('pcShownGrid'); if(!grid||grid.getAttribute('data-dnd')==='1') return;
  grid.setAttribute('data-dnd','1');
  var dragKey=null;
  grid.addEventListener('dragstart',function(e){ var chip=e.target.closest('.col-chip'); if(!chip) return; dragKey=chip.getAttribute('data-key'); chip.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragKey); }catch(err){} });
  grid.addEventListener('dragend',function(e){ var chip=e.target.closest('.col-chip'); if(chip) chip.classList.remove('dragging'); grid.querySelectorAll('.drag-over').forEach(function(x){ x.classList.remove('drag-over'); }); dragKey=null; });
  grid.addEventListener('dragover',function(e){ if(!dragKey) return; e.preventDefault(); e.dataTransfer.dropEffect='move'; var chip=e.target.closest('.col-chip'); grid.querySelectorAll('.drag-over').forEach(function(x){ if(x!==chip) x.classList.remove('drag-over'); }); if(chip&&chip.getAttribute('data-key')!==dragKey) chip.classList.add('drag-over'); });
  grid.addEventListener('drop',function(e){ if(!dragKey) return; e.preventDefault(); var chip=e.target.closest('.col-chip'); if(!chip) return; var tk=chip.getAttribute('data-key'); if(tk===dragKey) return; var rect=chip.getBoundingClientRect(); var after=(e.clientX-rect.left)>rect.width/2; pcReorderCol(dragKey,tk,after); });
}

const PC = { editId:null, supplierId:0, salesmanId:0, billDate:'', accountId:0, shopId:0, discount:100, freight:0, deposit:0, paid:0, remark:'', items:[], suppliers:[], salesmen:[], accounts:[], shops:[], goods:[] };

async function pcInit(kind){
  pcCurKind = kind || pcCurKind;
  var r=await Promise.all([apiGet('/shop/supplier/all'),apiGet('/shop/salesmen'),apiGet('/shop/account/all'),apiGet('/shop/goods/all'),apiGet('/shop/shops')]);
  PC.suppliers=(r[0]&&r[0].code===0)?r[0].data||[]:[];
  PC.salesmen=(r[1]&&r[1].code===0)?r[1].data||[]:[];
  PC.accounts=(r[2]&&r[2].code===0)?r[2].data||[]:[];
  PC.goods=(r[3]&&r[3].code===0)?r[3].data||[]:[];
  PC.shops=(r[4]&&r[4].code===0)?r[4].data||[]:[];
  PC.supplierId=PC.suppliers[0]?PC.suppliers[0].id:0;
  PC.accountId=PC.accounts[0]?PC.accounts[0].id:0;
  PC.shopId=PC.shops[0]?(PC.shops[0].id_str||String(PC.shops[0].id)):'';
  if(PC.editId){
    var g=await apiGet(PC_KINDS[pcCurKind].base+'/'+PC.editId);
    if(g&&g.code===0&&g.data){ pcFillFromPurchase(g.data); pcRender(); return; }
    PC.editId=null;
  }
  if(pcRestoreDraft()){ pcRender(); } else { pcReset(true); }
}
function pcFillFromPurchase(d){
  PC.supplierId=d.supplier_id||0;
  PC.shopId=d.shop_id?String(d.shop_id):PC.shopId;
  PC.salesmanId=d.salesman_id||0;
  PC.accountId=d.account_id||0;
  PC.billDate=d.bill_date||new Date().toISOString().slice(0,10);
  PC.discount=(d.discount!=null?d.discount:100);
  PC.freight=d.freight||0;
  PC.deposit=d.deposit_offset||0;
  PC.paid=d.paid_amount||0;
  PC.remark=d.remark||'';
  PC.items=(d.items||[]).map(function(it){
    var gid=(it.goods_id_str!=null&&it.goods_id_str!=='')?String(it.goods_id_str):(it.goods_id!=null?String(it.goods_id):'');
    var qty=Number(it.quantity||0), price=Number(it.unit_price||0);
    return {goods_id:gid, name:it.goods_name||'', spec:it.spec||'', code:it.goods_code||'', barcode:it.barcode||'', unit:it.unit_name||'', qty:qty, price:price, amount:Number(it.amount||(qty*price)), remark:it.remark||''};
  });
}
function pcSpecNames(g){
  try{ var gs=JSON.parse(g.spec_groups||'[]'); return gs.map(function(x){return x.name;}).filter(Boolean).join('/'); }catch(e){ return ''; }
}
function pcSupplierName(){ var s=PC.suppliers.filter(function(x){ return String(x.id)===String(PC.supplierId); })[0]; return s?s.name:''; }

function pcMatchName(name, kw){
  name=String(name||''); kw=String(kw||'');

function pcFindGoods(val){
  val=(val||'').trim(); if(!val) return null;
  return PC.goods.filter(function(g){ return g.name===val || g.code===val || g.barcode===val; })[0] || null;
}
function pcDraftKey(){ return 'pisa_pc_draft_'+pcCurKind; }
function pcSaveDraft(){
  try{
    sessionStorage.setItem(pcDraftKey(), JSON.stringify({
      supplierId:PC.supplierId, salesmanId:PC.salesmanId, billDate:PC.billDate, accountId:PC.accountId,
      discount:PC.discount, freight:PC.freight, deposit:PC.deposit, paid:PC.paid, remark:PC.remark, items:PC.items
    }));
  }catch(e){}
}
function pcClearDraft(){ try{ sessionStorage.removeItem(pcDraftKey()); }catch(e){} }
function pcRestoreDraft(){
  try{
    var raw=sessionStorage.getItem(pcDraftKey()); if(!raw) return false;
    var d=JSON.parse(raw); if(!d) return false;
    if(d.supplierId) PC.supplierId=d.supplierId;
    if(d.accountId) PC.accountId=d.accountId;
    PC.salesmanId=d.salesmanId||0;
    PC.billDate=d.billDate||PC.billDate;
    PC.discount=(d.discount!=null?d.discount:100); PC.freight=d.freight||0;
    PC.deposit=d.deposit||0; PC.paid=d.paid||0; PC.remark=d.remark||'';
    PC.items=Array.isArray(d.items)?d.items:[];
    return true;
  }catch(e){ return false; }
}

/* 表头左右拖拽调整列宽 */
function freezeCols(table){
  if(table.dataset.frozen==='1') return;
  var total=0;
  table.querySelectorAll('thead th').forEach(function(th){ var w=th.offsetWidth; th.style.width=w+'px'; total+=w; });
  table.style.tableLayout='fixed';
  table.style.width=total+'px';
  table.dataset.frozen='1';
}
function enableColResize(table, skip){
  if(!table) return;
  skip = skip || [];
  table.querySelectorAll('thead th').forEach(function(th){
    if(skip.some(function(c){ return th.classList.contains(c); })) return;
    if(th.querySelector('.col-resizer')) return;
    var r=document.createElement('span'); r.className='col-resizer';
    th.appendChild(r);
    r.addEventListener('mousedown', function(e){
      e.preventDefault(); e.stopPropagation();
      freezeCols(table);
      var startX=e.clientX, startW=th.offsetWidth, tableW=table.offsetWidth;
      r.classList.add('active');
      document.body.style.userSelect='none'; document.body.style.cursor='col-resize';
      function move(ev){
        var w=Math.max(40, startW+(ev.clientX-startX));
        th.style.width=w+'px';
        table.style.width=(tableW+(w-startW))+'px';
      }
      function up(){
        document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
        r.classList.remove('active'); document.body.style.userSelect=''; document.body.style.cursor='';
      }
      document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
    });
  });
}
function pcSubtotal(){ return PC.items.reduce(function(a,b){ return a+Number(b.amount||0); },0); }
function pcDiscounted(){ return pcSubtotal()*(Number(PC.discount)||0)/100; }
function pcPayable(){ return pcDiscounted()+Number(PC.freight||0); }
function pcSetDiscount(v){ PC.discount=Number(v)||0; pcUpdateTotals(); }
function pcSetFreight(v){ PC.freight=Number(v)||0; pcUpdateTotals(); }
function pcSetQty(i,v){ if(!PC.items[i])return; PC.items[i].qty=Number(v)||0; PC.items[i].amount=PC.items[i].qty*PC.items[i].price; var a=document.getElementById('pcAmt'+i); if(a)a.textContent=Number(PC.items[i].amount).toFixed(2); pcUpdateTotals(); }
function pcSetPrice(i,v){ if(!PC.items[i])return; PC.items[i].price=Number(v)||0; PC.items[i].amount=PC.items[i].qty*PC.items[i].price; var a=document.getElementById('pcAmt'+i); if(a)a.textContent=Number(PC.items[i].amount).toFixed(2); pcUpdateTotals(); }
function pcSetRemark(i,v){ if(PC.items[i]) PC.items[i].remark=v; }
function pcGid(g){ return g.id_str || String(g.id); }
function pcItemFromGoods(g){ return {goods_id:pcGid(g),name:g.name,spec:pcSpecNames(g),code:g.code||'',barcode:g.barcode||'',unit:g.main_unit||'',qty:1,price:Number(g.purchase_price||0),amount:Number(g.purchase_price||0),remark:''}; }
function pcFillItem(it,g){ it.goods_id=pcGid(g); it.name=g.name; it.spec=pcSpecNames(g); it.code=g.code||''; it.barcode=g.barcode||''; it.unit=g.main_unit||''; it.price=Number(g.purchase_price||0); it.amount=(it.qty||1)*it.price; }
function pcNameChange(i,val){
  var g=pcFindGoods(val);
  if(!g){ if(i<PC.items.length) PC.items[i].name=val; return; }
  if(i<PC.items.length) pcFillItem(PC.items[i],g); else PC.items.push(pcItemFromGoods(g));
  pcRender();
}

var pcNameCtx = { target:'pc' };
function pcNameGoodsList(target){
  if(target==='st') return ST.goods||[];
  if(target==='cb') return CB.goods||[];
  if(target==='asmc'||target==='asms') return ASM.goods||[];
  if(target==='spc'||target==='sps') return SPL.goods||[];
  if(target==='qbc') return QBC.goods||[];
  if(target==='rcc'||target==='rcs') return REC.goods||[];
  return PC.goods||[];
}
function pcNameSearch(i,el,target){
  pcNameCtx.target = target || 'pc';
  var drop=pcNameDropEl();
  var kw=(el.value||'').trim();
  if(!kw){ drop.style.display='none'; return; }
  var kwl=kw.toLowerCase();
  var list=pcNameGoodsList(pcNameCtx.target).filter(function(g){
    return ((g.name||'')+' '+(g.code||'')+' '+(g.barcode||'')).toLowerCase().indexOf(kwl)>=0;
  }).slice(0,8);
  var r=el.getBoundingClientRect();
  drop.style.left=r.left+'px';
  drop.style.top=(r.bottom+2)+'px';
  drop.style.width=Math.max(r.width,560)+'px';
  var h='<table class="pcnd-tbl"><thead><tr><th style="width:50px">序号</th><th>商品名称</th><th style="width:130px">规格</th><th style="width:150px">编号/货号</th><th style="width:110px">商品库存</th></tr></thead><tbody>';
  if(!list.length) h+='<tr><td colspan="5" class="pcnd-empty">无匹配商品</td></tr>';
  list.forEach(function(g,idx){
    var img=g.image_url?'<img class="pcnd-thumb" src="'+stEsc(g.image_url)+'">':'<span class="pcnd-thumb ph"></span>';
    h+='<tr'+(idx===0?' class="active"':'')+' onmousedown="event.preventDefault();pcPickNameGoods('+i+','+g.id+')">'
      +'<td>'+(idx+1)+'</td>'
      +'<td><div class="pcnd-goods">'+img+'<div><div>'+stEsc(g.name)+'</div><div class="pcnd-code">'+stEsc(g.barcode||g.code||'')+'</div></div></div></td>'
      +'<td>'+stEsc(pcSpecNames(g)||'--')+'</td>'
      +'<td>'+stEsc(g.code||'--')+'</td>'
      +'<td>'+Number(g.current_stock||0)+stEsc(g.main_unit||'')+'</td>'
      +'</tr>';
  });
  h+='</tbody></table><div class="pcnd-add" onmousedown="event.preventDefault();pcNameAddNew()">新增</div>';
  drop.innerHTML=h;
  drop.style.display='block';
}
function pcNameAddNew(){
  if(pcNameCtx.target==='st') stSaveDraft(); else pcSaveDraft();
  location.href='/goods.html#goods:add';
}
function pcPickNameGoods(i,gid){
  var target=pcNameCtx.target;
  var g=pcNameGoodsList(target).filter(function(x){ return x.id===gid; })[0];
  if(!g) return;
  if(target==='st'){
    if(i<ST.items.length) ST.items[i]=stNewItem(g); else ST.items.push(stNewItem(g));
    pcCloseNameDrop(); stRender(); return;
  }
  if(target==='cb'){
    if(i<CB.items.length) CB.items[i]=cbNewItem(g); else CB.items.push(cbNewItem(g));
    pcCloseNameDrop(); cbRender(); return;
  }
  if(target==='asmc'||target==='asms'){
    var arr=target==='asmc'?ASM.comp:ASM.sub;
    if(i<arr.length) arr[i]=asmNewItem(g); else arr.push(asmNewItem(g));
    pcCloseNameDrop(); asmRender('asm'); return;
  }
  if(target==='spc'||target==='sps'){
    var sarr=target==='spc'?SPL.comp:SPL.sub;
    if(i<sarr.length) sarr[i]=asmNewItem(g); else sarr.push(asmNewItem(g));
    pcCloseNameDrop(); asmRender('split'); return;
  }
  if(target==='qbc'){
    if(i<QBC.rows.length) QBC.rows[i]=qbcNewItem(g); else QBC.rows.push(qbcNewItem(g));
    pcCloseNameDrop(); qbcuRender(); return;
  }
  if(target==='rcc'||target==='rcs'){
    var rarr=target==='rcc'?REC.comp:REC.sub;
    if(i<rarr.length) rarr[i]=rcNewItem(g); else rarr.push(rcNewItem(g));
    pcCloseNameDrop(); rcRender(); return;
  }
  if(i<PC.items.length) pcFillItem(PC.items[i],g); else PC.items.push(pcItemFromGoods(g));
  pcCloseNameDrop();
  pcRender();
}

function pcCloseGoodsDialog(){ var m=document.getElementById('pcGoodsModal'); if(m) m.remove(); }
function pcgmRenderCats(){
  var el=document.getElementById('pcgmCats'); if(!el) return;
  var cats=PCGM.cats||[];
  var childrenMap={};
  cats.forEach(function(c){
    var id=String(c.id_str||c.id);
    var pid=(c.parent_id_str!=null && c.parent_id_str!=='')?String(c.parent_id_str):String(c.parent_id||0);
    (childrenMap[pid]=childrenMap[pid]||[]).push({id:id, name:c.name});
  });
  var h='<div class="pcgm-cat-title">商品分类</div>';
  h+='<div class="pcgm-cat'+(PCGM.catId===0?' active':'')+'" onclick="pcgmPickCat(0)"><span class="pcgm-caret">▾</span>全部</div>';
  var seen={};
  (function walk(pid, level){
    if(level>8) return;
    (childrenMap[pid]||[]).forEach(function(c){
      if(seen[c.id]) return; seen[c.id]=1;
      var hasKids=(childrenMap[c.id]||[]).length>0;
      h+='<div class="pcgm-cat'+(String(PCGM.catId)===c.id?' active':'')+'" style="padding-left:'+(16+level*14)+'px" onclick="pcgmPickCat(\''+c.id+'\')">'
        +(hasKids?'<span class="pcgm-caret">▾</span>':'<span class="pcgm-caret"></span>')+stEsc(c.name)+'</div>';
      walk(c.id, level+1);
    });
  })(0,1);
  h+='<div class="pcgm-cat'+(PCGM.catId===-1?' active':'')+'" onclick="pcgmPickCat(-1)">未分类</div>';
  el.innerHTML=h;
}

      +'<td><div class="pcgm-goods">'+img+'<span>'+stEsc(g.name)+'</span></div></td>'
      +'<td>'+stEsc(pcSpecNames(g)||'--')+'</td>'

  for(var p=s;p<=e;p++) h+='<button class="page-btn'+(p===PCGM.page?' active':'')+'" onclick="pcgmGoPage('+p+')">'+p+'</button>';
  h+='<button class="page-btn"'+(PCGM.page>=pages?' disabled':'')+' onclick="pcgmGoPage('+(PCGM.page+1)+')">下一页</button>';

async function pcSave(andPrint){
  if(!PC.supplierId){ showToast('请选择供应商','error'); return; }
  var items=PC.items.filter(function(it){ return it.goods_id && Number(it.qty)>0; });
  if(!items.length){ showToast('请添加商品明细','error'); return; }
  var body={
    supplier_id:PC.supplierId, shop_id:PC.shopId||0, salesman_id:PC.salesmanId, account_id:PC.accountId,
    bill_date:PC.billDate, order_date:PC.billDate, discount:Number(PC.discount)||100, freight:Number(PC.freight)||0,
    deposit_offset:Number(PC.deposit)||0, paid_amount:Number(PC.paid)||0, remark:PC.remark,
    items: items.map(function(it){ return {goods_id:it.goods_id, quantity:Number(it.qty), unit_price:Number(it.price), remark:it.remark||''}; })
  };
  var res = PC.editId ? await apiPut(PC_KINDS[pcCurKind].base+'/'+PC.editId, body) : await apiPost(PC_KINDS[pcCurKind].base, body);
  if(res&&res.code===0){
    showToast('保存成功');
    if(PC.editId){ PC.editId=null; showPage(PC_KINDS[pcCurKind].list); return; }
    pcClearDraft();

    if(keep&&keep.checked){ PC.items=[]; PC.paid=0; PC.remark=''; pcRender(); }
    else { showPage(PC_KINDS[pcCurKind].list); }
  } else showToast((res&&res.message)||'保存失败','error');
}

function cmPreset(t){
  function fmt(d){ return d.toISOString().slice(0,10); }
  var now=new Date(), from='', to=fmt(now);
  if(t==='今日'){ from=fmt(now); }
  else if(t==='昨日'){ var y=new Date(now.getTime()-86400000); from=fmt(y); to=fmt(y); }
  else if(t==='本周'){ var w=new Date(now.getTime()-((now.getDay()||7)-1)*86400000); from=fmt(w); }
  else if(t==='本月'){ from=fmt(new Date(now.getFullYear(),now.getMonth(),1)); }
  else { from=''; to=''; }
  var f=document.getElementById('cmFrom'), tt=document.getElementById('cmTo');
  if(f) f.value=from; if(tt) tt.value=to;
  cmSyncDate('cmFrom'); cmSyncDate('cmTo');
}

var CB_CHECK_SVG='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';

function cbCatChildren(pid){ return (CB.categories||[]).filter(function(c){return String(c.parent_id||0)===String(pid||0);}); }
function cbCatById(id){ return (CB.categories||[]).filter(function(c){return String(c.id)===String(id);})[0]; }
function cbCatHasChild(id){ return cbCatChildren(id).length>0; }
function cbCatPath(id){ var c=cbCatById(id); if(!c) return ''; var p=c.parent_id?cbCatById(c.parent_id):null; return p?(p.name+' / '+c.name):c.name; }
function cbCatAncestorPath(id){ var path=[],c=id?cbCatById(id):null; while(c){ path.unshift(c.id); c=c.parent_id?cbCatById(c.parent_id):null; } return path; }
function cbBuildCascade(hoverPath, selectedId){
  hoverPath=hoverPath||[];
  function opt(id,depth,label){
    var active=String(hoverPath[depth])===String(id);
    var sel=String(selectedId)===String(id);
    return '<div class="cat-opt'+(active?' active':'')+(sel?' selected':'')+'" onmouseover="cbHoverCat('+id+','+depth+')" onclick="cbSelectCategory('+id+')">'+stEsc(label)
      +(id&&cbCatHasChild(id)?'<svg class="cat-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>':'<span class="opt-check">'+CB_CHECK_SVG+'</span>')+'</div>';
  }
  var cols=[], col0=opt(0,0,'未分类');
  cbCatChildren(0).forEach(function(c){ col0+=opt(c.id,0,c.name); });
  cols.push(col0);
  for(var depth=1;depth<=5;depth++){
    var pid=hoverPath[depth-1]; if(!pid) break;
    var kids=cbCatChildren(pid);
    if(!kids.length){ cols.push('<div class="cat-opt empty">暂无子类别</div>'); break; }
    var html=''; kids.forEach(function(c){ html+=opt(c.id,depth,c.name); });
    cols.push(html);
  }
  while(cols.length<2) cols.push('<div class="cat-opt empty">请选择左侧类别</div>');
  return cols;
}
function cbSamePath(a,b){ if(a.length!==b.length) return false; for(var i=0;i<a.length;i++){ if(String(a[i])!==String(b[i])) return false; } return true; }

function stockDatePreset(t){
  function fmt(d){ return d.toISOString().slice(0,10); }
  var now=new Date(), from='', to=fmt(now);
  if(t==='今日'){ from=fmt(now); }
  else if(t==='昨日'){ var y=new Date(now.getTime()-86400000); from=fmt(y); to=fmt(y); }
  else if(t==='本周'){ var w=new Date(now.getTime()-((now.getDay()||7)-1)*86400000); from=fmt(w); }
  else if(t==='本月'){ from=fmt(new Date(now.getFullYear(),now.getMonth(),1)); }
  else { from=''; to=''; }
  dfieldSet('stDateFrom', from); dfieldSet('stDateTo', to);
  loadStockCounts(1);
}
function stSearchDebounce(){ clearTimeout(window._stSearchTimer); window._stSearchTimer=setTimeout(function(){ loadStockCounts(1); },300); }

function asmDatePreset(mode,t){
  function fmt(d){ return d.toISOString().slice(0,10); }
  var now=new Date(), from='', to=fmt(now);
  if(t==='今日'){ from=fmt(now); }
  else if(t==='昨日'){ var y=new Date(now.getTime()-86400000); from=fmt(y); to=fmt(y); }
  else if(t==='本周'){ var w=new Date(now.getTime()-((now.getDay()||7)-1)*86400000); from=fmt(w); }
  else if(t==='本月'){ from=fmt(new Date(now.getFullYear(),now.getMonth(),1)); }
  else { from=''; to=''; }
  dfieldSet('asmDateFrom', from); dfieldSet('asmDateTo', to);
  loadAsmList(mode,1);
}

async function loadAsmList(mode,page){

async function asmInit(mode){

      S.form={ salesmanId:String(d.salesman_id||(S.salesmen[0]?S.salesmen[0].id:'0')), billDate:d.bill_date||new Date().toISOString().slice(0,10), assemblyFee:d.assembly_fee||0, accountId:String(d.account_id||(S.accounts[0]?S.accounts[0].id:'0')), remark:d.remark||'' };

    S.form={ salesmanId: S.salesmen[0]?String(S.salesmen[0].id):'0', billDate:new Date().toISOString().slice(0,10), assemblyFee:0, accountId: S.accounts[0]?String(S.accounts[0].id):'0', remark:'' };

async function asmSave(mode,andPrint){

  asmCapture(mode);
  var items=[];
  S.comp.filter(function(it){return it.goods_id;}).forEach(function(it){ items.push({kind:1,goods_id:it.goods_id,quantity:Number(it.qty)||0,unit_cost:Number(it.cost)||0,amount:Number(it.amount)||0,remark:it.remark||''}); });
  S.sub.filter(function(it){return it.goods_id;}).forEach(function(it){ items.push({kind:2,goods_id:it.goods_id,quantity:Number(it.qty)||0,unit_cost:Number(it.cost)||0,amount:Number(it.amount)||0,remark:it.remark||''}); });
  if(!items.length){ showToast('请添加明细','error'); return; }
  var saveRecipeEl=document.getElementById('asmSaveRecipe');
  var body={ salesman_id:Number(S.form.salesmanId)||0, bill_date:S.form.billDate, assembly_fee:Number(S.form.assemblyFee)||0, account_id:Number(S.form.accountId)||0, remark:S.form.remark, items:items, save_recipe: !!(saveRecipeEl&&saveRecipeEl.checked) };
  var res = S.editId ? await apiPut(c.api+'/'+S.editId, body) : await apiPost(c.api, body);
  if(res&&res.code===0){
    showToast('保存成功');
    var cont=document.getElementById('asmSaveContinue');
    if(andPrint) showToast('打印功能开发中');
    if(cont&&cont.checked){ S.editId=null; S.comp=[]; S.sub=[]; S.form.remark=''; asmRender(mode); }
    else { S.editId=null; showPage(c.listKey); }
  } else showToast((res&&res.message)||'保存失败','error');
}

async function rcSave(){
  var comp=REC.comp.filter(function(it){return it.goods_id;});
  if(!comp.length){ showToast('请选择组合件商品','error'); return; }
  var subs=REC.sub.filter(function(it){return it.goods_id;});
  var body={ goods_id:comp[0].goods_id, quantity:Number(comp[0].qty)||1, remark:'', items: subs.map(function(it){ return { goods_id:it.goods_id, quantity:Number(it.qty)||1, unit_cost:0, remark:'' }; }) };
  var res = REC.editId ? await apiPut('/shop/recipe/'+REC.editId, body) : await apiPost('/shop/recipe', body);

function tfDatePreset(t){
  function fmt(d){ return d.toISOString().slice(0,10); }
  var now=new Date(), from='', to=fmt(now);
  if(t==='今日'){ from=fmt(now); }
  else if(t==='昨日'){ var y=new Date(now.getTime()-86400000); from=fmt(y); to=fmt(y); }
  else if(t==='本周'){ var w=new Date(now.getTime()-((now.getDay()||7)-1)*86400000); from=fmt(w); }
  else if(t==='本月'){ from=fmt(new Date(now.getFullYear(),now.getMonth(),1)); }
  else { from=''; to=''; }
  dfieldSet('tfDateFrom', from); dfieldSet('tfDateTo', to);
  loadTransfers(1);
}

function rcDatePreset(t){
  function fmt(d){ return d.toISOString().slice(0,10); }
  var now=new Date(), from='', to=fmt(now);
  if(t==='今日'){ from=fmt(now); }
  else if(t==='昨日'){ var y=new Date(now.getTime()-86400000); from=fmt(y); to=fmt(y); }
  else if(t==='本周'){ var w=new Date(now.getTime()-((now.getDay()||7)-1)*86400000); from=fmt(w); }
  else if(t==='本月'){ from=fmt(new Date(now.getFullYear(),now.getMonth(),1)); }
  else { from=''; to=''; }
  dfieldSet('rcDateFrom', from); dfieldSet('rcDateTo', to);
  loadReceipts(1);
}

function pmDatePreset(t){
  function fmt(d){ return d.toISOString().slice(0,10); }
  var now=new Date(), from='', to=fmt(now);
  if(t==='今日'){ from=fmt(now); }
  else if(t==='昨日'){ var y=new Date(now.getTime()-86400000); from=fmt(y); to=fmt(y); }
  else if(t==='本周'){ var w=new Date(now.getTime()-((now.getDay()||7)-1)*86400000); from=fmt(w); }
  else if(t==='本月'){ from=fmt(new Date(now.getFullYear(),now.getMonth(),1)); }
  else { from=''; to=''; }
  dfieldSet('pmDateFrom', from); dfieldSet('pmDateTo', to);
  loadPayments(1);
}

function ffDonutSVG(items,total,centerLabel){
  var size=170, r=62, cx=85, cy=85, sw=26;
  var h='<svg viewBox="0 0 '+size+' '+size+'" width="170" height="170">';
  if(!total||total<=0){ h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#E5E7EB" stroke-width="'+sw+'"/>'; }
  else {
    var a0=-Math.PI/2;
    items.forEach(function(it,i){
      var frac=it.amount/total; if(frac<=0) return;
      var a1=a0+frac*Math.PI*2;
      var large=frac>0.5?1:0;
      var x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
      var x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      h+='<path d="M '+x0.toFixed(2)+' '+y0.toFixed(2)+' A '+r+' '+r+' 0 '+large+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+'" fill="none" stroke="'+FF_COLORS[i%FF_COLORS.length]+'" stroke-width="'+sw+'"/>';
      a0=a1;
    });
  }
  h+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="12" fill="#9CA3AF">'+centerLabel+'</text>';
  h+='<text x="'+cx+'" y="'+(cy+18)+'" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">¥'+Number(total||0).toFixed(2)+'</text>';
  h+='</svg>';
  return h;
}

  var legend=(items||[]).map(function(it,i){ var pct=total>0?(it.amount/total*100).toFixed(2):'0.00'; return '<div class="ff-legend"><span class="ff-dot" style="background:'+FF_COLORS[i%FF_COLORS.length]+'"></span>'+stEsc(it.name)+': '+Number(it.amount).toFixed(2)+' ('+pct+'%)</div>'; }).join('') || '<div class="ff-legend" style="color:var(--gray-400)">暂无数据</div>';
  return '<div class="ff-donut">'+ffDonutSVG(items,total,centerLabel)+'<div class="ff-legend-wrap">'+legend+'</div></div>';
}

function ssDatePreset(t){
  var now=new Date(), from='', to='';
  function fmt(d){ return d.toISOString().slice(0,10); }
  if(t==='今日'){ from=fmt(now); to=fmt(now); }
  else if(t==='昨日'){ var y=new Date(now.getTime()-86400000); from=fmt(y); to=fmt(y); }
  else if(t==='本周'){ var w=new Date(now.getTime()-((now.getDay()||7)-1)*86400000); from=fmt(w); to=fmt(now); }
  else if(t==='本月'){ from=fmt(new Date(now.getFullYear(),now.getMonth(),1)); to=fmt(new Date(now.getFullYear(),now.getMonth()+1,0)); }
  else { from=''; to=''; }
  dfieldSet('ssFrom', from); dfieldSet('ssTo', to);
  ssLoad();
}
async function ssLoad(){
  var wrap=document.getElementById('ssListBody'); if(!wrap) return;
  var params=[];
  var df=gv('ssFrom'), dt=gv('ssTo');
  if(df) params.push('date_from='+df);
  if(dt) params.push('date_to='+dt);
  var cid=gv('ssCustomer'); if(cid&&cid!=='0') params.push('customer_id='+cid);

function anDatePreset(presetId, fromId, toId, loadFn, t){
  var now=new Date(), from='', to='';
  function fmt(d){ return d.toISOString().slice(0,10); }
  if(t==='今日'){ from=fmt(now); to=fmt(now); }
  else if(t==='昨日'){ var y=new Date(now.getTime()-86400000); from=fmt(y); to=fmt(y); }
  else if(t==='本周'){ var w=new Date(now.getTime()-((now.getDay()||7)-1)*86400000); from=fmt(w); to=fmt(now); }
  else if(t==='本月'){ from=fmt(new Date(now.getFullYear(),now.getMonth(),1)); to=fmt(new Date(now.getFullYear(),now.getMonth()+1,0)); }
  else { from=''; to=''; }
  dfieldSet(fromId, from); dfieldSet(toId, to);
  loadFn();
}
function anDateSel(id, loadFn){
  return '<div class="stsel" id="'+id+'" data-value="自定义" style="width:110px"><div class="stsel-input" onclick="toggleStSel(\''+id+'\',event)"><span class="stsel-label">自定义</span><svg class="stsel-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>'
    +'<div class="stsel-panel">'+['今日','昨日','本周','本月','自定义'].map(function(t){return '<div class="stsel-opt'+(t==='自定义'?' active':'')+'" data-value="'+t+'" onclick="pickStSel(\''+id+'\',\''+t+'\',this,event);'+loadFn+'(\''+t+'\')">'+t+'</div>';}).join('')+'</div></div>';
}

const CU_COL_STORE = 'pisa_customer_cols';
function cuColDef(key){ for(var i=0;i<CU_COL_DEFS.length;i++){ if(CU_COL_DEFS[i].key===key) return CU_COL_DEFS[i]; } return null; }
function cuDefaultCols(){ return CU_COL_DEFS.map(function(c){ return c.key; }); }
function cuNormalizeCols(cols){
  var valid=CU_COL_DEFS.map(function(c){ return c.key; });
  var out=(cols||[]).filter(function(k){ return valid.indexOf(k)>=0 && k!=='actions'; });
  if(out.indexOf('name')<0) out.unshift('name');
  out.push('actions');
  return out;
}
function cuLoadCols(){
  try{
    var r=JSON.parse(localStorage.getItem(CU_COL_STORE)||'null');
    if(Array.isArray(r)) return cuNormalizeCols(r);
  }catch(e){}
  return cuDefaultCols();
}
function cuSaveCols(){ try{ localStorage.setItem(CU_COL_STORE, JSON.stringify(CU.columns)); }catch(e){} }
CU.columns = cuLoadCols();
let cuDraftCols=null;
function openCuColsDrawer(){
  cuDraftCols=CU.columns.slice();
  var old=document.getElementById('cuColsDrawer'); if(old) old.remove();
  var oldMask=document.getElementById('cuColsMask'); if(oldMask) oldMask.remove();
  var mask=document.createElement('div'); mask.className='col-mask'; mask.id='cuColsMask'; mask.onclick=closeCuColsDrawer;
  var dr=document.createElement('aside'); dr.className='col-drawer'; dr.id='cuColsDrawer';
  dr.innerHTML='<div class="col-drawer-head">'
    +'<button class="col-drawer-close" onclick="closeCuColsDrawer()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'
    +'<div class="col-drawer-title">自定义表头</div></div>'
    +'<div class="col-drawer-body">'
    +'<div class="col-sec-title">已显示表头<span>拖拽可调整表头顺序</span></div>'
    +'<div class="col-grid" id="cuShownGrid"></div>'
