<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PISA 进销存</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 布局与主题见 /css/app-shell.css，此处仅保留页面组件样式 */
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-title{font-size:18px;font-weight:600;color:var(--gray-800)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--gray-200);margin-bottom:16px}
.tab{padding:10px 16px;font-size:13px;color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--gray-700)}
.tab.active{color:var(--primary-600);border-bottom-color:var(--primary-500);font-weight:500}
.filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.search-wrapper{display:flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--gray-200);border-radius:var(--radius-md);background:#fff;width:260px}
.search-wrapper svg{color:var(--gray-400);width:16px;height:16px;flex-shrink:0}
.search-input{border:none;outline:none;font-size:13px;color:var(--gray-700);width:100%;background:none}
.filter-select{height:34px;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:0 10px;font-size:13px;color:var(--gray-600);background:#fff;outline:none}
.date-input{height:34px;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:0 10px;font-size:13px;color:var(--gray-600);background:#fff;outline:none}
.table-wrapper{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow:hidden}
.table-wrapper table{width:100%;border-collapse:collapse}
.table-wrapper th{background:var(--gray-50);font-size:12px;color:var(--gray-500);padding:10px 14px;text-align:left;font-weight:500;border-bottom:1px solid var(--gray-200)}
.table-wrapper td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--gray-100);color:var(--gray-700)}
.table-wrapper tr:last-child td{border-bottom:none}
.table-wrapper tr:hover td{background:var(--gray-50)}
.table-wrapper .num{text-align:right;font-variant-numeric:tabular-nums}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:12px;color:var(--gray-500)}
.pagination-btns{display:flex;gap:4px}
.page-btn{padding:4px 10px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);background:#fff;font-size:12px;cursor:pointer;color:var(--gray-600)}
.page-btn:hover{border-color:var(--gray-300)}
.page-btn.active{background:var(--primary-500);color:#fff;border-color:var(--primary-500)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-block;padding:2px 8px;border-radius:var(--radius-full);font-size:12px;font-weight:500;white-space:nowrap}
.badge-default{background:var(--gray-100);color:var(--gray-600)}
.badge-success{background:var(--success-50);color:var(--success-600)}
.badge-warning{background:var(--warning-50);color:var(--warning-600)}
.badge-danger{background:var(--danger-50);color:var(--danger-600)}
.badge-info{background:var(--info-50);color:var(--info-500)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-md);font-size:13px;font-weight:500;border:none;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--primary-500);color:#fff}.btn-primary:hover{background:var(--primary-600)}
.btn-secondary{background:#fff;color:var(--gray-700);border:1px solid var(--gray-200)}.btn-secondary:hover{background:var(--gray-50);border-color:var(--gray-300)}
.btn-teal{background:var(--success-500);color:#fff}.btn-teal:hover{background:var(--success-600)}
.btn-danger{background:#fff;color:var(--danger-500);border:1px solid var(--danger-500)}.btn-danger:hover{background:var(--danger-50)}
.btn-ghost{background:none;color:var(--gray-600);padding:6px 10px}.btn-ghost:hover{background:var(--gray-100)}
.btn-sm{padding:5px 10px;font-size:12px}
.op-btns{display:flex;gap:4px}
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:600;color:var(--gray-800);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.link{font-size:12px;color:var(--primary-500);cursor:pointer;font-weight:400}
.link:hover{text-decoration:underline}
.dash-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.dash-hello{font-size:22px;font-weight:700;color:var(--gray-800)}
.dash-sub{font-size:13px;color:var(--gray-400);margin-top:4px}
.dash-actions{display:flex;gap:8px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:18px 20px}
.stat-top{display:flex;justify-content:space-between;align-items:flex-start}
.stat-label{font-size:13px;color:var(--gray-500);margin-bottom:6px}
.stat-value{font-size:24px;font-weight:700;color:var(--gray-800);font-variant-numeric:tabular-nums}
.stat-change{font-size:12px;color:var(--success-500);margin-top:4px}
.stat-change.down{color:var(--danger-500)}
.stat-icon{width:42px;height:42px;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon svg{width:20px;height:20px}
.stat-icon.blue{background:var(--primary-50);color:var(--primary-500)}
.stat-icon.green{background:var(--success-50);color:var(--success-500)}
.stat-icon.orange{background:var(--warning-50);color:var(--warning-500)}
.stat-icon.red{background:var(--danger-50);color:var(--danger-500)}
.grid-2b{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--primary-300),var(--primary-500));transition:height .3s}
.bar-val{font-size:11px;color:var(--gray-500);margin-bottom:4px;font-variant-numeric:tabular-nums}
.bar-label{font-size:11px;color:var(--gray-400);margin-top:6px}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{width:140px;height:140px;border-radius:50%;position:relative;flex-shrink:0}
.donut-center{position:absolute;inset:28px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-center b{font-size:16px;font-weight:700;color:var(--gray-800)}
.donut-center span{font-size:11px;color:var(--gray-400)}
.legend{display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray-600)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-item b{margin-left:auto;font-variant-numeric:tabular-nums}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-100)}
.rank-row:last-child{border-bottom:none}
.rank-no{width:20px;height:20px;border-radius:var(--radius-sm);background:var(--gray-100);color:var(--gray-500);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.rank-no.top{background:var(--primary-500);color:#fff}
.rank-name{flex:1;font-size:13px;color:var(--gray-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-bar{width:100px;height:6px;background:var(--gray-100);border-radius:3px;overflow:hidden;flex-shrink:0}
.rank-bar i{display:block;height:100%;background:linear-gradient(90deg,#93c5fd,#3b82f6);border-radius:3px}
.rank-val{font-size:12px;color:var(--gray-500);width:66px;text-align:right;font-variant-numeric:tabular-nums}
.warn-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--gray-100);font-size:13px}
.warn-row:last-child{border-bottom:none}
.warn-name{flex:1;color:var(--gray-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warn-qty{font-size:12px;color:var(--gray-500);font-variant-numeric:tabular-nums}
.doc-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--gray-100);font-size:13px}
.doc-row:last-child{border-bottom:none}
.doc-no{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--primary-600);width:128px;flex-shrink:0}
.doc-party{flex:1;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-amt{width:88px;text-align:right;font-variant-numeric:tabular-nums;color:var(--gray-700)}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.quick-tile{border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:16px 6px;text-align:center;cursor:pointer;transition:all .15s}
.quick-tile:hover{border-color:var(--primary-500);color:var(--primary-600);box-shadow:0 2px 8px rgba(59,130,246,.12);transform:translateY(-1px)}
.quick-tile svg{width:22px;height:22px;margin-bottom:6px}
.quick-tile div{font-size:12px}
.overview-row{display:flex;align-items:center;gap:12px;padding:9px 0}
.overview-label{font-size:13px;color:var(--gray-600);width:78px;flex-shrink:0}
.overview-bar{flex:1;height:8px;background:var(--gray-100);border-radius:4px;overflow:hidden}
.overview-bar i{display:block;height:100%;border-radius:4px}
.overview-val{font-size:12px;color:var(--gray-500);width:64px;text-align:right;font-variant-numeric:tabular-nums}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:10px;width:640px;max-width:92vw;max-height:88vh;overflow:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--gray-200)}
.modal-title{font-size:16px;font-weight:600}
.modal-close{border:none;background:none;cursor:pointer;color:var(--gray-400);font-size:22px;line-height:1}
.modal-body{padding:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.form-label{display:block;font-size:13px;color:var(--gray-600);margin-bottom:6px}
.form-input{width:100%;height:36px;border:1px solid var(--gray-300);border-radius:var(--radius-md);padding:0 10px;font-size:13px;outline:none;color:var(--gray-700)}
.form-input:focus{border-color:var(--primary-500)}
/* 自定义下拉（参考设计） */
.stsel{position:relative}
.stsel-input{display:flex;align-items:center;justify-content:space-between;gap:8px;height:36px;border:1px solid var(--gray-300);border-radius:var(--radius-md);padding:0 10px;font-size:13px;color:var(--gray-700);cursor:pointer;background:#fff;transition:border-color .15s,box-shadow .15s}
.stsel.open .stsel-input{border-color:var(--accent-400);box-shadow:0 0 0 3px rgba(16,185,129,.12)}
.stsel.disabled .stsel-input{background:var(--gray-50);color:var(--gray-400);cursor:not-allowed}
.stsel-caret{width:16px;height:16px;color:var(--gray-400);flex-shrink:0;transition:transform .15s}
.stsel.open .stsel-caret{transform:rotate(180deg)}
.stsel-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:210;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-md);box-shadow:0 10px 24px rgba(15,23,42,.12);padding:4px 0;max-height:240px;overflow-y:auto}
.stsel.open .stsel-panel{display:block}
.stsel-opt{position:relative;padding:9px 14px;font-size:13px;color:var(--gray-700);cursor:pointer}
.stsel-opt:hover{background:var(--gray-50)}
.stsel-opt.active{color:var(--gray-900);font-weight:500;padding-left:32px}
.stsel-opt.active::before{content:'';position:absolute;left:13px;top:50%;width:6px;height:11px;border-right:2px solid var(--accent-600);border-bottom:2px solid var(--accent-600);transform:translateY(-60%) rotate(45deg)}
/* 采购列表（仿货品管理） */
.plist-wrap{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg)}
.plist-scroll{overflow-x:auto}
.plist-scroll::-webkit-scrollbar{height:6px}
.plist-scroll::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:5px}
.plist-scroll::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}
.plist-scroll::-webkit-scrollbar-track{background:var(--gray-100);border-radius:5px}
.plist-wrap table{width:100%;min-width:1100px;border-collapse:collapse}
.plist-wrap th{background:var(--gray-50);font-size:12px;color:var(--gray-500);padding:10px 14px;text-align:left;font-weight:500;border-bottom:1px solid var(--gray-200);white-space:nowrap;vertical-align:middle}
.plist-wrap th:not(.plist-tools):not(.plist-actions){min-width:170px}
.plist-wrap td{padding:10px 14px;font-size:13px;color:var(--gray-700);border-bottom:1px solid var(--gray-100);white-space:nowrap;vertical-align:middle}
.plist-wrap tr:last-child td{border-bottom:none}
.plist-wrap tr:hover td{background:var(--gray-50)}
.plist-wrap .num{text-align:right;font-variant-numeric:tabular-nums}
.plist-tools{width:64px;padding:6px 8px;text-align:center;position:sticky;left:0;z-index:3;background:var(--gray-50)}
.plist-idx{width:64px;text-align:center;color:var(--gray-400);position:sticky;left:0;z-index:2;background:#fff;font-variant-numeric:tabular-nums}
.plist-wrap tr:hover .plist-idx{background:var(--gray-50)}
.plist-tools::after,.plist-idx::after{content:'';position:absolute;top:0;bottom:0;left:100%;width:4px;background:linear-gradient(to right,rgba(0,0,0,.08),rgba(0,0,0,0));pointer-events:none}
.plist-actions{width:150px;position:sticky;right:0;z-index:2;background:#fff}
.plist-wrap tr:hover .plist-actions{background:var(--gray-50)}
.plist-actions::before{content:'';position:absolute;top:0;bottom:0;right:100%;width:4px;background:linear-gradient(to left,rgba(0,0,0,.08),rgba(0,0,0,0));pointer-events:none}
.plist-wrap tbody tr{cursor:pointer}
.plist-row-sel td,.plist-row-sel .plist-idx{background:var(--accent-50)!important}
.plist-sum td{background:var(--gray-50);font-weight:500;color:var(--gray-800);border-top:1px solid var(--gray-200)}
.plist-sum .plist-sum-idx{position:sticky;left:0;z-index:2;background:var(--gray-50);text-align:center;color:var(--gray-600)}
.plist-sum .plist-sum-idx::after{content:'';position:absolute;top:0;bottom:0;left:100%;width:4px;background:linear-gradient(to right,rgba(0,0,0,.08),rgba(0,0,0,0));pointer-events:none}
.pc-items-panel{display:flex;flex-direction:column;align-items:center;margin-top:14px}
.pc-items-toggle{display:inline-flex;align-items:center;gap:6px;padding:8px 22px;background:#fff;border:1px solid var(--gray-200);border-bottom:none;border-radius:12px 12px 0 0;font-size:14px;color:var(--gray-700);cursor:pointer}
.pc-items-toggle:hover{color:var(--accent-600)}
.pc-items-caret{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .15s}
.pc-items-toggle.collapsed .pc-items-caret{transform:rotate(180deg)}
.pc-items-body{width:100%;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow-x:auto}
.pc-items-body .pcv-tbl{width:100%;border-collapse:collapse;min-width:900px}
.pc-items-sum{text-align:right;padding:10px 14px;font-size:13px;color:var(--gray-600);border-top:1px solid var(--gray-100);background:var(--gray-50)}
.plist-gear-btn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-md);color:var(--gray-500);cursor:pointer;border:none;background:none;transition:background .15s,color .15s}
.plist-gear-btn:hover{background:var(--gray-200);color:var(--accent-600)}
.plist-gear-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
/* 自定义表头抽屉（与货品一致） */
.col-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:1200}
.col-mask.show{opacity:1;visibility:visible}
.col-drawer{position:fixed;top:0;right:0;height:100%;width:520px;max-width:100vw;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s ease;z-index:1201;display:flex;flex-direction:column}
.col-drawer.show{transform:translateX(0)}
.col-drawer-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--gray-100)}
.col-drawer-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);color:var(--gray-500);cursor:pointer;border:none;background:none}
.col-drawer-close:hover{background:var(--gray-100)}
.col-drawer-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.col-drawer-title{font-size:16px;font-weight:600;color:var(--gray-800)}
.col-drawer-body{flex:1;padding:18px 20px;overflow-y:auto}
.col-sec-title{font-size:14px;font-weight:600;color:var(--gray-800);margin:6px 0 14px;display:flex;align-items:baseline;gap:8px}
.col-sec-title span{font-size:12px;font-weight:400;color:var(--gray-400)}
.col-sec-title:not(:first-child){margin-top:30px}
.col-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col-chip{position:relative;display:flex;align-items:center;gap:6px;height:44px;padding:0 8px;background:var(--gray-100);border:1px solid transparent;border-radius:var(--radius-md);font-size:14px;color:var(--gray-700);user-select:none;transition:background .12s,border-color .12s}
.col-chip .col-label{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-chip.dragging{opacity:.4}
.col-chip.drag-over{border-color:var(--accent-400);background:var(--accent-50)}
.col-drag{cursor:grab;color:var(--gray-400);display:inline-flex;flex-shrink:0}
.col-drag svg{width:14px;height:14px;fill:currentColor;stroke:none}
.col-del,.col-add{position:absolute;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;flex-shrink:0;transition:opacity .12s,transform .12s;border:none;cursor:pointer}
.col-del{right:-9px;background:var(--danger-500)}
.col-add{right:-9px;background:var(--accent-500)}
.col-chip.shown .col-del{opacity:0;pointer-events:none}
.col-chip.shown:hover .col-del{opacity:1;pointer-events:auto}
.col-chip.avail .col-add{opacity:0;pointer-events:none}
.col-chip.avail:hover .col-add{opacity:1;pointer-events:auto}
.col-chip.avail:hover{background:var(--gray-200)}
.col-drawer-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-top:1px solid var(--gray-100);background:#fff}
.col-foot-right{display:flex;gap:10px}
.plist-filter{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.plist-filter .mini-input{height:34px;border:1px solid var(--gray-300);border-radius:var(--radius-md);padding:0 10px;font-size:13px;outline:none;background:#fff;color:var(--gray-700)}
.plist-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.plist-check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gray-600);cursor:pointer}
/* 采购开单 */
.pc-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.pc-title{text-align:center;font-size:18px;font-weight:600;color:var(--gray-800)}
.pc-divider{height:1px;background:var(--gray-200);margin:0 0 16px}
.pc-sup-drop{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:60;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-md);box-shadow:0 10px 24px rgba(15,23,42,.12);max-height:240px;overflow-y:auto;min-width:220px}
.pc-sup-opt{padding:8px 12px;font-size:13px;color:var(--gray-700);cursor:pointer}
.pc-sup-opt:hover{background:var(--gray-50)}
.pc-sup-empty{padding:12px;color:var(--gray-400);font-size:13px}
.pc-field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray-600)}
.pc-tbl-wrap{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow-x:auto;margin-bottom:16px}
.pc-tbl{width:100%;min-width:1050px;border-collapse:collapse;table-layout:fixed}
.pc-tbl th{background:var(--gray-50);font-size:12px;color:var(--gray-500);padding:9px 10px;text-align:left;font-weight:500;border-bottom:1px solid var(--gray-200);white-space:nowrap}
.pc-tbl td{padding:4px 8px;border-bottom:1px solid var(--gray-100);font-size:13px;color:var(--gray-700)}
.pc-tbl tbody tr{height:40px}

};

  localStorage.setItem('pisa_token', State.token);

async function api(path, opts={}){
  const headers = {'Content-Type':'application/json'};
  if(State.token) headers['Authorization']='Bearer '+State.token;
  const res = await fetch(API_BASE+path, {...opts, headers});
  const data = await res.json();
  if(res.status===401){logout();return null;}
  return data;
}

function findNavLabel(key){
  var nav=(window.PisaShell&&PisaShell.NAV)||[];
  for(var i=0;i<nav.length;i++){
    var m=nav[i];
    if(m.key===key)return {label:m.label,mod:m};
    if(m.cols){
      for(var j=0;j<m.cols.length;j++){
        var items=m.cols[j].items||[];
        for(var k=0;k<items.length;k++) if(items[k].key===key) return {label:items[k].label,mod:m};
      }
    }
  }
  return null;
}

async function loadPurchaseData(key,page,keyword){
  var wrap=document.getElementById('purchaseTableWrap');
  if(!wrap) return;
  var path='/shop/'+{purchases:'purchase','purchase-order':'purchase-order','purchase-return':'purchase-return'}[key]+'/list?page='+page+'&page_size=10';
  if(keyword) path+='&keyword='+encodeURIComponent(keyword);
  var res=await apiGet(path);
  if(!res||res.code!==0){wrap.innerHTML='<div style="padding:40px;text-align:center;color:var(--gray-400)">加载失败</div>';return;}
  var list=res.data.list||[];
  var total=res.data.total||0;
  var cols=getPurchaseCols(key);
  var h='<table><thead><tr>';
  cols.forEach(function(c){h+='<th'+(c.a==='right'?' class="num"':'')+'>'+c.l+'</th>';});
  h+='<th style="width:140px">操作</th></tr></thead><tbody>';
  if(list.length===0){
    h+='<tr><td colspan="'+(cols.length+1)+'" style="text-align:center;padding:40px;color:var(--gray-400)">暂无数据</td></tr>';
  }else{
    list.forEach(function(row){
      h+='<tr>';
      cols.forEach(function(c){
        var v=row[c.key]||'-';
        if(c.format) v=c.format(v,row);
        if(c.badge) v=B(v);
        h+='<td'+(c.a==='right'?' class="num"':'')+'>'+v+'</td>';
      });
      h+='<td class="table-actions">';
      if(row.status===1) h+='<button class="btn btn-ghost btn-sm" onclick="showToast(\'编辑功能开发中\')">编辑</button><button class="btn btn-teal btn-sm" onclick="purchaseAudit(\''+key+'\','+row.id+')">审核</button><button class="btn btn-danger btn-sm" onclick="purchaseDelete(\''+key+'\','+row.id+')">删除</button>';
      else if(row.status===3) h+='<button class="btn btn-ghost btn-sm" onclick="showToast(\'查看功能开发中\')">查看</button><button class="btn btn-ghost btn-sm" onclick="purchaseUnaudit(\''+key+'\','+row.id+')">反审核</button>';
      else h+='<button class="btn btn-ghost btn-sm" onclick="showToast(\'查看功能开发中\')">查看</button>';
      h+='</td></tr>';
    });
  }
  h+='</tbody></table>';
  h+='<div class="pagination"><span>共 '+total+' 条</span><div class="pagination-btns">';
  var pages=Math.ceil(total/10)||1;
  h+='<button class="page-btn" '+(page<=1?'disabled':'')+" onclick=\"loadPurchaseData('"+key+"',"+(page-1)+",'')\">上一页</button>";
  for(var i=1;i<=Math.min(pages,5);i++){
    h+='<button class="page-btn'+(i===page?' active':'')+"\" onclick=\"loadPurchaseData('"+key+"',"+i+",'')\">"+i+'</button>';
  }
  h+='<button class="page-btn" '+(page>=pages?'disabled':'')+" onclick=\"loadPurchaseData('"+key+"',"+(page+1)+",'')\">下一页</button>";
  h+='</div></div>';
  wrap.innerHTML=h;
}

  if(key==='purchases') return [

    {key:'total_amount',l:'总金额',a:'right',format:function(v){return '¥'+Number(v).toLocaleString();}},
    {key:'paid_amount',l:'已付金额',a:'right',format:function(v){return '¥'+Number(v).toLocaleString();}},
    {key:'unpaid_amount',l:'未付金额',a:'right',format:function(v){return '¥'+Number(v).toLocaleString();}},
    {key:'status',l:'状态',badge:1,format:function(v){return {1:'草稿',2:'待审核',3:'已生效',4:'已作废'}[v]||'未知';}}

  return [
    {key:'order_no',l:'退货单号'},{key:'supplier_name',l:'供应商'},{key:'bill_date',l:'退货日期'},

async function purchaseDelete(key,id){
  if(!confirm('确定删除？')) return;
  var path='/shop/'+{purchases:'purchase','purchase-order':'purchase-order','purchase-return':'purchase-return'}[key]+'/'+id;
  var res=await apiGet(path); // just check exists

  var r=await fetch(API_BASE+path,{method:'DELETE',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}});

}

      h+='</select></div>';
      // remark
      h+='<div class="form-group"><label class="form-label">备注</label><input class="form-input" id="poRemark" placeholder="选填"></div>';
    }else{
      h+='<div class="form-group"><label class="form-label">仓库</label><select class="form-input form-select" id="poWarehouse">';
      _warehouses.forEach(function(w){h+='<option value="'+w.id+'">'+w.name+'</option>';});
      h+='</select></div>';
      h+='<div class="form-group"><label class="form-label">备注</label><input class="form-input" id="poRemark" placeholder="选填"></div>';
    }
    h+='</div>';
    // items table
    h+='<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-weight:500">明细</span>'+
      '<button class="btn btn-ghost btn-sm" onclick="addPurchaseItem()">+ 添加货品</button></div>';
    h+='<table id="poItemsTable"><thead><tr><th>货品</th><th style="width:80px">数量</th><th style="width:100px">单价</th><th style="width:100px">金额</th><th style="width:60px">操作</th></tr></thead><tbody id="poItemsBody">';
    h+='<tr id="poEmptyRow"><td colspan="5" style="text-align:center;color:var(--gray-400);padding:20px">点击"添加货品"增加明细行</td></tr>';
    h+='</tbody></table></div>';
    h+='<div style="margin-top:12px;text-align:right;font-weight:500">合计：<span id="poTotal" style="color:var(--primary-500)">¥0.00</span></div>';

    document.getElementById('modalTitle').textContent=title;
    document.getElementById('modalBody').innerHTML=h;
    document.getElementById('modal').classList.add('show');
    document.getElementById('modalConfirm').onclick=function(){submitPurchase(key);};
    window._poItemCount=0;
  });
}

function addPurchaseItem(){
  var tbody=document.getElementById('poItemsBody');
  var empty=document.getElementById('poEmptyRow');
  if(empty) empty.remove();
  var idx=window._poItemCount++;
  var h='<tr data-idx="'+idx+'"><td><select class="form-input form-select" style="min-width:160px" id="poItemGoods'+idx+'" onchange="poItemPrice('+idx+')">';
  _goods.forEach(function(g){h+='<option value="'+g.id+'" data-price="'+g.purchase_price+'">'+g.name+'</option>';});
  h+='</select></td><td><input class="form-input" type="number" min="1" value="1" id="poItemQty'+idx+'" onchange="poCalc('+idx+')"></td>'+
    '<td><input class="form-input" type="number" step="0.01" value="0" id="poItemPrice'+idx+'" onchange="poCalc('+idx+')"></td>'+
    '<td id="poItemAmt'+idx+'" style="text-align:right">¥0.00</td>'+
    '<td><button class="btn btn-ghost btn-sm text-danger" onclick="removePoItem('+idx+')">删</button></td></tr>';
  tbody.insertAdjacentHTML('beforeend',h);
  poItemPrice(idx);
}
function poItemPrice(idx){
  var sel=document.getElementById('poItemGoods'+idx);
  if(!sel) return;
  var opt=sel.options[sel.selectedIndex];
  var price=opt?parseFloat(opt.getAttribute('data-price'))||0:0;
  document.getElementById('poItemPrice'+idx).value=price;
  poCalc(idx);
}
function poCalc(idx){
  var qty=parseFloat(document.getElementById('poItemQty'+idx).value)||0;
  var price=parseFloat(document.getElementById('poItemPrice'+idx).value)||0;
  var amt=qty*price;
  document.getElementById('poItemAmt'+idx).textContent='¥'+amt.toFixed(2);
  poTotalCalc();
}
function poTotalCalc(){
  var total=0;
  for(var i=0;i<window._poItemCount;i++){
    var el=document.getElementById('poItemAmt'+i);
    if(el) total+=parseFloat(el.textContent.replace('¥',''))||0;
  }
  var t=document.getElementById('poTotal');
  if(t) t.textContent='¥'+total.toFixed(2);
}
function removePoItem(idx){
  var tr=document.querySelector('#poItemsTable tr[data-idx="'+idx+'"]');
  if(tr) tr.remove();
  poTotalCalc();
  if(!document.querySelector('#poItemsTable tbody tr')){
    document.getElementById('poItemsBody').innerHTML='<tr id="poEmptyRow"><td colspan="5" style="text-align:center;color:var(--gray-400);padding:20px">点击"添加货品"增加明细行</td></tr>';
  }
}

async function submitPurchase(key){
  var supplier_id=parseInt(document.getElementById('poSupplier').value)||0;
  var bill_date=document.getElementById('poDate').value;
  var warehouse_id=parseInt(document.getElementById('poWarehouse').value)||0;
  var remark=document.getElementById('poRemark').value;
  if(!supplier_id){showToast('请选择供应商','error');return;}
  if(!bill_date){showToast('请选择日期','error');return;}
  var items=[];
  for(var i=0;i<window._poItemCount;i++){
    var goodsEl=document.getElementById('poItemGoods'+i);
    var qtyEl=document.getElementById('poItemQty'+i);
    var priceEl=document.getElementById('poItemPrice'+i);
    if(!goodsEl) continue;
    items.push({goods_id:parseInt(goodsEl.value),quantity:parseInt(qtyEl.value)||1,unit_price:parseFloat(priceEl.value)||0});
  }
  if(items.length===0){showToast('请添加明细','error');return;}
  var body={supplier_id:supplier_id,bill_date:bill_date,warehouse_id:warehouse_id,remark:remark,items:items};
  var path='/shop/'+{purchases:'purchase','purchase-order':'purchase-order','purchase-return':'purchase-return'}[key];
  var res=await apiPost(path,body);
  if(res&&res.code===0){showToast('创建成功');hideModal();loadPurchaseData(key,1,'');}
  else showToast(res?res.message:'创建失败','error');
}

async function loadSettingData(apiKey,page,keyword){
  var wrap=document.getElementById('settingTableWrap');
  if(!wrap) return;
  var path='/shop/'+apiKey+'/list?page='+page+'&page_size=10';
  if(keyword) path+='&keyword='+encodeURIComponent(keyword);
  var res=await apiGet(path);
  if(!res||res.code!==0){wrap.innerHTML='<div style="padding:40px;text-align:center;color:var(--gray-400)">加载失败</div>';return;}
  var list=res.data.list||[];
  var total=res.data.total||0;
  var cols=getSettingCols(apiKey);
  var h='<table><thead><tr>';
  cols.forEach(function(c){h+='<th'+(c.a==='right'?' class="num"':'')+'>'+c.l+'</th>';});
  h+='<th style="width:120px">操作</th></tr></thead><tbody>';
  if(list.length===0){
    h+='<tr><td colspan="'+(cols.length+1)+'" style="text-align:center;padding:40px;color:var(--gray-400)">暂无数据</td></tr>';
  }else{
    list.forEach(function(row){
      h+='<tr>';
      cols.forEach(function(c){
        var v=row[c.key]!==undefined?row[c.key]:'-';
        if(c.format) v=c.format(v,row);
        h+='<td'+(c.a==='right'?' class="num"':'')+'>'+v+'</td>';
      });
      h+='<td class="table-actions"><button class="btn btn-ghost btn-sm" onclick="showSettingEdit(\''+apiKey+'\','+row.id+')">编辑</button><button class="btn btn-danger btn-sm" onclick="settingDelete(\''+apiKey+'\','+row.id+')">删除</button></td></tr>';
    });
  }
  h+='</tbody></table>';
  h+='<div class="pagination"><span>共 '+total+' 条</span><div class="pagination-btns">';
  var pages=Math.ceil(total/10)||1;
  h+='<button class="page-btn" '+(page<=1?'disabled':'')+" onclick=\"loadSettingData('"+apiKey+"',"+(page-1)+",'')\">上一页</button>";
  for(var i=1;i<=Math.min(pages,5);i++){
    h+='<button class="page-btn'+(i===page?' active':'')+"\" onclick=\"loadSettingData('"+apiKey+"',"+i+",'')\">"+i+'</button>';
  }
  h+='<button class="page-btn" '+(page>=pages?'disabled':'')+" onclick=\"loadSettingData('"+apiKey+"',"+(page+1)+",'')\">下一页</button>";
  h+='</div></div>';
  wrap.innerHTML=h;
}

function getSettingCols(apiKey){
  if(apiKey==='supplier') return [{key:'code',l:'编码'},{key:'name',l:'供应商名称'},{key:'contact',l:'联系人'},{key:'phone',l:'电话'},{key:'total_payable',l:'应付余额',a:'right',format:function(v){return '¥'+Number(v||0).toLocaleString();}}];
  if(apiKey==='customer') return [{key:'code',l:'编码'},{key:'name',l:'客户名称'},{key:'contact',l:'联系人'},{key:'phone',l:'电话'},{key:'balance',l:'应收余额',a:'right',format:function(v){return '¥'+Number(v||0).toLocaleString();}}];
  if(apiKey==='warehouse') return [{key:'name',l:'仓库名称'},{key:'type',l:'类型',format:function(v){return {1:'普通仓',2:'原料仓',3:'成品仓'}[v]||'未知';}},{key:'address',l:'地址'},{key:'keeper',l:'负责人'}];
  if(apiKey==='goods') return [{key:'code',l:'编码'},{key:'name',l:'货品名称'},{key:'barcode',l:'条码'},{key:'purchase_price',l:'进货价',a:'right',format:function(v){return '¥'+Number(v||0).toFixed(2);}},{key:'retail_price',l:'零售价',a:'right',format:function(v){return '¥'+Number(v||0).toFixed(2);}}];
  if(apiKey==='account') return [{key:'name',l:'账户名称'},{key:'type',l:'类型',format:function(v){return {1:'现金',2:'银行',3:'在线'}[v]||'未知';}},{key:'balance',l:'余额',a:'right',format:function(v){return '¥'+Number(v||0).toLocaleString();}}];
  return [];
}

async function submitSetting(apiKey,id){
  var body={};
  if(apiKey==='supplier'||apiKey==='customer'){
    body={code:gv('sf_code'),name:gv('sf_name'),contact:gv('sf_contact'),phone:gv('sf_phone'),address:gv('sf_address'),remark:gv('sf_remark')};
  }else if(apiKey==='warehouse'){
    body={name:gv('sf_name'),type:parseInt(gv('sf_type'))||1,address:gv('sf_address'),keeper:gv('sf_keeper')};
  }else if(apiKey==='goods'){
    body={code:gv('sf_code'),name:gv('sf_name'),barcode:gv('sf_barcode'),purchase_price:parseFloat(gv('sf_purchase_price'))||0,retail_price:parseFloat(gv('sf_retail_price'))||0,wholesale_price:parseFloat(gv('sf_wholesale_price'))||0};
  }else if(apiKey==='account'){
    body={name:gv('sf_name'),type:parseInt(gv('sf_type'))||1};
  }
  if(!body.name){showToast('请填写名称','error');return;}
  var res;
  if(id) res=await apiPut('/shop/'+apiKey+'/'+id,body);
  else res=await apiPost('/shop/'+apiKey,body);
  if(res&&res.code===0){showToast(id?'更新成功':'创建成功');hideModal();loadSettingData(apiKey,1,'');}
  else showToast(res?res.message:'操作失败','error');
}

async function settingDelete(apiKey,id){
  if(!confirm('确定删除？')) return;
  var token=localStorage.getItem('pisa_token');
  var r=await fetch(API_BASE+'/shop/'+apiKey+'/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}});
  var d=await r.json();
  if(d.code===0){showToast('删除成功');loadSettingData(apiKey,1,'');}
  else showToast(d.message||'删除失败','error');
}

const StaffState = { tab:'users', users:[], salesmen:[], shops:[], maxStaff:0, used:0, remaining:0 };
let StaffModal = { mode:'', id:null };
function stEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function maskPhone(p){
  p=String(p||'');
  if(p.length===11) return p.slice(0,3)+'******'+p.slice(-2);
  return p||'-';
}
function roleName(r){ return r===1?'主账号':r===2?'管理员':'操作员'; }

function staffPageHTML(){
  setTimeout(function(){ ensureStaffShops().then(loadStaffUsers); },0);
  return '<div class="page-head"><div class="page-title">员工管理</div></div>'
    +'<div class="tabs">'
    +'<div class="tab active" id="staffTabUsers" onclick="switchStaffTab(\'users\')">用户</div>'
    +'<div class="tab" id="staffTabSalesmen" onclick="switchStaffTab(\'salesmen\')">业务员</div>'
    +'</div>'
    +'<div id="staffBody"><div style="padding:40px;text-align:center;color:var(--gray-400)">加载中...</div></div>';
}

function ensureStaffShops(){
  if(StaffState.shops.length) return Promise.resolve(StaffState.shops);
  return apiGet('/shop/shops').then(function(res){
    if(res&&res.code===0) StaffState.shops=res.data||[];
    return StaffState.shops;
  }).catch(function(){ return []; });
}

function switchStaffTab(tab){
  StaffState.tab=tab;
  var tu=document.getElementById('staffTabUsers'), ts=document.getElementById('staffTabSalesmen');
  if(tu) tu.classList.toggle('active', tab==='users');
  if(ts) ts.classList.toggle('active', tab==='salesmen');
  if(tab==='users') loadStaffUsers(); else loadStaffSalesmen();
}

async function loadStaffUsers(){
  const body=document.getElementById('staffBody'); if(!body) return;
  const res=await apiGet('/shop/staff/users');
  if(!res||res.code!==0){ body.innerHTML='<div style="padding:40px;text-align:center;color:var(--gray-400)">加载失败</div>'; return; }
  StaffState.users=res.data.list||[];
  StaffState.maxStaff=res.data.max_staff||0;
  StaffState.used=res.data.used||0;
  StaffState.remaining=(res.data.remaining==null?0:res.data.remaining);
  renderStaffUsers();
}

  const body=document.getElementById('staffBody'); if(!body) return;
  const st=StaffState;
  const remainTxt = st.remaining<0 ? '不限' : st.remaining;

    +'<a style="font-size:13px;color:var(--primary-600);cursor:pointer" onclick="openNav(\'settings:shop\')">立即增购</a>'
    +'</div>';
  h+='<div class="table-wrapper"><table><thead><tr><th>姓名</th><th>手机号</th><th>角色</th><th>状态</th><th style="width:120px">操作</th></tr></thead><tbody>';

    h+='<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--gray-400)">暂无数据</td></tr>';
  }

    const name=stEsc(u.name||'-')+(u.is_current?' <span class="badge badge-danger">当前</span>':'');
    h+='<tr><td>'+name+'</td><td>'+stEsc(maskPhone(u.phone))+'</td><td>'+roleName(u.role)+'</td>'
      +'<td>'+(u.status===1?'启用中':'已停用')+'</td>'
      +'<td><button class="btn btn-ghost btn-sm" onclick="openUserModal('+u.id+')">修改</button></td></tr>';

async function loadStaffSalesmen(){

/* 自定义下拉 */
function stSelValue(id){ var e=document.getElementById(id); return e?e.getAttribute('data-value'):''; }
function stSelHTML(id, value, opts, disabled){
  var sel = opts.filter(function(o){return String(o.v)===String(value);})[0] || opts[0] || {v:'',t:''};
  var h='<div class="stsel'+(disabled?' disabled':'')+'" id="'+id+'" data-value="'+sel.v+'">'
    +'<div class="stsel-input" onclick="toggleStSel(\''+id+'\',event)"><span class="stsel-label">'+stEsc(sel.t)+'</span>'
    +'<svg class="stsel-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>'
    +'<div class="stsel-panel">';
  opts.forEach(function(o){
    h+='<div class="stsel-opt'+(String(o.v)===String(sel.v)?' active':'')+'" data-value="'+o.v+'" onclick="pickStSel(\''+id+'\',\''+o.v+'\',this,event)">'+stEsc(o.t)+'</div>';
  });
  h+='</div></div>';
  return h;
}
function toggleStSel(id, ev){
  if(ev) ev.stopPropagation();
  var e=document.getElementById(id); if(!e||e.classList.contains('disabled')) return;
  var open=e.classList.contains('open'); closeAllStSel(); if(!open) e.classList.add('open');
}
function pickStSel(id, val, opt, ev){
  if(ev) ev.stopPropagation();
  var e=document.getElementById(id); if(!e) return;
  e.setAttribute('data-value', val);
  var lbl=e.querySelector('.stsel-label'); if(lbl&&opt) lbl.textContent=opt.textContent.trim();
  e.querySelectorAll('.stsel-opt').forEach(function(o){ o.classList.toggle('active', String(o.getAttribute('data-value'))===String(val)); });
  if(window.onStSelChange) window.onStSelChange(id, val);
  closeAllStSel();
}
function closeAllStSel(){ document.querySelectorAll('.stsel.open').forEach(function(e){ e.classList.remove('open'); }); }
document.addEventListener('click', function(e){ if(!e.target.closest || !e.target.closest('.stsel')) closeAllStSel(); });

function openUserModal(id){
  const u = id ? StaffState.users.filter(function(x){return x.id===id;})[0] : null;
  StaffModal={ mode:'user', id:id||null };
  document.getElementById('staffModalTitle').textContent = id?'修改用户':'新增用户';

    +'<div><label class="form-label">姓名 <span style="color:var(--danger-500)">*</span></label>'
    +'<input class="form-input" id="suName" placeholder="请输入2-20字的姓名" value="'+stEsc(u?u.name:'')+'"></div>'
    +'<div><label class="form-label">手机号 <span style="color:var(--danger-500)">*</span></label>'
    +'<input class="form-input" id="suPhone" placeholder="登录账号" value="'+stEsc(u?u.phone:'')+'"'+(id?' disabled':'')+'></div>'
    +'</div>';
  h+='<div class="form-row">'
    +'<div><label class="form-label">角色</label>'
    + stSelHTML('suRoleSel', (u&&u.role===2)?'2':'3', [{v:'2',t:'管理员'},{v:'3',t:'操作员'}], !!(u&&u.is_owner))
    +'</div>';
  if(id){
    h+='<div><label class="form-label">状态</label>'
      + stSelHTML('suStatusSel', (u&&u.status===0)?'0':'1', [{v:'1',t:'启用中'},{v:'0',t:'已停用'}], !!(u&&u.is_owner))
      +'</div>';
  }else{
    h+='<div><label class="form-label">初始密码 <span style="color:var(--danger-500)">*</span></label>'
      +'<input class="form-input" id="suPwd" type="password" placeholder="至少6位"></div>';
  }
  h+='</div>';
  document.getElementById('staffModalBody').innerHTML=h;
  document.getElementById('staffModal').classList.add('show');
}

function openSalesmanModal(id){
  const s = id ? StaffState.salesmen.filter(function(x){return x.id===id;})[0] : null;
  StaffModal={ mode:'salesman', id:id||null };
  document.getElementById('staffModalTitle').textContent = id?'修改业务员':'新增业务员';
  const shops = StaffState.shops||[];
  const shopOpts = shops.length ? shops.map(function(sp){ return {v:String(sp.id), t:sp.name}; }) : [{v:'0', t:'我的店铺'}];
  let shopVal = '0';
  if(s){ shopVal = String(s.shop_id||0); }
  else { const main = shops.filter(function(sp){return sp.is_main;})[0] || shops[0]; if(main) shopVal = String(main.id); }
  let h='<div class="form-row"><div><label class="form-label">业务员姓名 <span style="color:var(--danger-500)">*</span></label>'
    +'<input class="form-input" id="ssName" placeholder="请输入2-20字的姓名" value="'+stEsc(s?s.name:'')+'"></div></div>';
  h+='<div class="form-row"><div><label class="form-label">手机号码</label>'
    +'<div style="display:flex;gap:8px;align-items:center">'
    +'<span class="form-input" style="width:72px;display:flex;align-items:center;justify-content:center;color:var(--gray-500);background:var(--gray-50)">+86</span>'
    +'<input class="form-input" id="ssPhone" placeholder="请输入员工手机号码" value="'+stEsc(s?s.phone:'')+'"></div></div></div>';
  h+='<div class="form-row"><div><label class="form-label">所属门店 <span style="color:var(--danger-500)">*</span></label>'
    + stSelHTML('ssShopSel', shopVal, shopOpts, false) +'</div></div>';
  document.getElementById('staffModalBody').innerHTML=h;
  document.getElementById('staffModal').classList.add('show');

async function submitStaffModal(){
  if(StaffModal.mode==='user'){
    const name=gv('suName').trim();
    if(!name){ showToast('请输入姓名','error'); return; }
    if(StaffModal.id){
      const st=document.getElementById('suStatusSel');
      const body={ name:name, role:parseInt(stSelValue('suRoleSel'),10)||0 };
      if(st && !st.classList.contains('disabled')) body.status=parseInt(stSelValue('suStatusSel'),10);
      const res=await apiPut('/shop/staff/users/'+StaffModal.id, body);
      if(res&&res.code===0){ showToast('修改成功'); hideStaffModal(); loadStaffUsers(); }
      else showToast((res&&res.message)||'操作失败','error');
    }else{
      const pwd=gv('suPwd');
      if(pwd.length<6){ showToast('初始密码至少6位','error'); return; }
      const body={ name:name, phone:gv('suPhone').trim(), role:parseInt(stSelValue('suRoleSel'),10)||3, password:pwd };
      const res=await apiPost('/shop/staff/users', body);
      if(res&&res.code===0){ showToast('新增成功'); hideStaffModal(); loadStaffUsers(); }
      else showToast((res&&res.message)||'操作失败','error');
    }
  }else if(StaffModal.mode==='salesman'){
    const name=gv('ssName').trim();
    if(!name){ showToast('请输入业务员姓名','error'); return; }
    const body={ name:name, phone:gv('ssPhone').trim(), shop_id:parseInt(stSelValue('ssShopSel'),10)||0 };
    const res = StaffModal.id
      ? await apiPut('/shop/salesmen/'+StaffModal.id, body)
      : await apiPost('/shop/salesmen', body);
    if(res&&res.code===0){ showToast(StaffModal.id?'修改成功':'新增成功'); hideStaffModal(); loadStaffSalesmen(); }
    else showToast((res&&res.message)||'操作失败','error');
  }else if(StaffModal.mode==='shop'){
    const name=gv('shName').trim();
    if(!name){ showToast('请输入门店名称','error'); return; }
    const cb=document.getElementById('shIsMain');
    const body={ name:name, phone:gv('shPhone').trim(), address:gv('shAddress').trim(), is_main:(cb&&cb.checked)?1:0 };
    const res = StaffModal.id
      ? await apiPut('/shop/shops/'+StaffModal.id, body)
      : await apiPost('/shop/shops', body);
    if(res&&res.code===0){ showToast(StaffModal.id?'修改成功':'新增成功'); hideStaffModal(); loadShopsPage(); }
    else showToast((res&&res.message)||'操作失败','error');
  }
}

async function deleteSalesman(id){
  if(!confirm('确定删除该业务员？')) return;
  const res=await apiDelete('/shop/salesmen/'+id);
  if(res&&res.code===0){ showToast('删除成功'); loadStaffSalesmen(); }
  else showToast((res&&res.message)||'删除失败','error');
}

function purchaseDatePreset(t){
  function fmt(d){ return d.toISOString().slice(0,10); }
  var now=new Date(), from='', to=fmt(now);
  if(t==='今日'){ from=fmt(now); }
  else if(t==='昨日'){ var y=new Date(now.getTime()-86400000); from=fmt(y); to=fmt(y); }
  else if(t==='本周'){ var w=new Date(now.getTime()-((now.getDay()||7)-1)*86400000); from=fmt(w); }
  else if(t==='本月'){ from=fmt(new Date(now.getFullYear(),now.getMonth(),1)); }
  else { from=''; to=''; }
  var f=document.getElementById('pcDateFrom'), tt=document.getElementById('pcDateTo');
  if(f) f.value=from; if(tt) tt.value=to;
  loadPurchases(1);
}
function pcSearchDebounce(){ clearTimeout(window._pcSearchTimer); window._pcSearchTimer=setTimeout(function(){ loadPurchases(1); },300); }

async function loadPurchases(page){
  PC_PAGE.page=page||1;
  PC_PAGE.keyword=gv('pcSearch');
  PC_PAGE.dateFrom=gv('pcDateFrom');
  PC_PAGE.dateTo=gv('pcDateTo');
  var hv=document.getElementById('pcHideVoid'); PC_PAGE.hideVoid=hv?hv.checked:true;
  var wrap=document.getElementById('purchaseListBody'); if(!wrap) return;
  var path=PC_KINDS[pcListKind].base+'/list?page='+PC_PAGE.page+'&page_size=10';
  if(PC_PAGE.keyword) path+='&keyword='+encodeURIComponent(PC_PAGE.keyword);
  if(PC_PAGE.dateFrom) path+='&date_from='+PC_PAGE.dateFrom;
  if(PC_PAGE.dateTo) path+='&date_to='+PC_PAGE.dateTo;
  var res=await apiGet(path);
  if(!res||res.code!==0){ wrap.innerHTML='<div style="padding:40px;text-align:center;color:var(--gray-400)">加载失败</div>'; return; }
  var list=res.data.list||[], total=res.data.total||0;
  if(PC_PAGE.hideVoid) list=list.filter(function(r){ return pcListKind==='order' ? r.status!==5 : r.status!==4; });
  renderPurchases(list,total);
}

function purchaseCell(c,row){
  var v=row[c.key];
  if(c.key==='status' && pcListKind==='order'){
    var map={1:'草稿',2:'待审核',3:'未转进货',4:'已转进货',5:'已关闭'};
    var colors={1:'var(--gray-500)',2:'#F59E0B',3:'var(--danger-500)',4:'var(--success-600)',5:'var(--gray-400)'};
    var t=map[Number(v)]||'未知';
    return '<span style="display:inline-flex;align-items:center;gap:5px;color:'+(colors[Number(v)]||'inherit')+'"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>'+t+'</span>';
  }
  if(c.key==='status' && pcListKind==='return'){
    var rmap={1:'草稿',2:'待审核',3:'已生效',4:'已作废'};
    var rcolors={1:'var(--gray-500)',2:'#F59E0B',3:'var(--success-600)',4:'var(--danger-500)'};
    var rt=rmap[Number(v)]||'未知';
    return '<span style="display:inline-flex;align-items:center;gap:5px;color:'+(rcolors[Number(v)]||'inherit')+'"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>'+rt+'</span>';
  }
  if(c.key==='status' && pcListKind==='saleorder'){
    var omap={1:'草稿',2:'待审核',3:'已生效',4:'已取消'};
    var ocolors={1:'var(--gray-500)',2:'#F59E0B',3:'var(--success-600)',4:'var(--danger-500)'};
    var ot=omap[Number(v)]||'未知';
    return '<span style="display:inline-flex;align-items:center;gap:5px;color:'+(ocolors[Number(v)]||'inherit')+'"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>'+ot+'</span>';
  }
  if(c.key==='receive_status'){
    var rsmap={0:'未收款',1:'部分收款',2:'已收清'};
    var rscolors={0:'var(--danger-500)',1:'#F59E0B',2:'var(--success-600)'};
    return '<span style="color:'+(rscolors[Number(v)]||'inherit')+'">'+(rsmap[Number(v)]||'未知')+'</span>';
  }
  if(c.num){ return '<span style="color:var(--gray-400)">¥</span>'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
  if(c.key==='invoice_status'){ return Number(v)===1?'<span style="color:var(--success-600)">已开票</span>':'<span style="color:var(--danger-500)">未开票</span>'; }
  if(c.key==='attachments'){
    if(!v) return '-';
    try{ var arr=JSON.parse(v); if(arr&&arr[0]) return '<img src="'+stEsc(arr[0])+'" style="width:34px;height:34px;object-fit:cover;border-radius:4px">'; }catch(e){}
    return '-';
  }
  if(c.key==='related_no') return stEsc(v||'--');
  if(c.key==='related_order_no') return stEsc(v||'--');
  if(c.key==='order_date') return stEsc(v||'-');
  if(c.key==='bill_date') return stEsc(v||'-');
  if(c.key==='order_no') return stEsc(v||'-');
  if(c.key==='created_at'){ var s=String(v||'').replace('T',' '); return stEsc(s? s.slice(0,19) : '-'); }
  if(c.key==='print_status'){ return Number(v)===1?'<span style="color:var(--success-600)">已打印</span>':'<span style="color:var(--danger-500)">未打印</span>'; }
  return stEsc(v==null||v===''?'-':v);
}

function renderPurchases(list,total){
  var wrap=document.getElementById('purchaseListBody'); if(!wrap) return;

  vis.forEach(function(k){ var c=pcColDef(kind,k); h+='<th'+(c.num?' class="num"':'')+'>'+c.l+'</th>'; });

  if(!list.length){ h+='<tr><td colspan="'+colCount+'" style="text-align:center;padding:30px;color:var(--gray-400)">暂无数据</td></tr>'; }

    fixed.forEach(function(c){ h+='<td'+(c.num?' class="num"':'')+'>'+purchaseCell(c,row)+'</td>'; });
    vis.forEach(function(k){ var c=pcColDef(kind,k); h+='<td'+(c.num?' class="num"':'')+'>'+purchaseCell(c,row)+'</td>'; });
    h+='<td class="plist-actions">'+pcRowActions(row)+'</td></tr>';
  });
  h+='</tbody><tfoot><tr class="plist-sum"><td class="plist-sum-idx">合计</td>';
  fixed.forEach(function(c){ h+=pcSumCell(c,list); });
  vis.forEach(function(k){ h+=pcSumCell(pcColDef(kind,k),list); });
  h+='<td class="plist-actions"></td></tr></tfoot></table></div>';
  var pages=Math.ceil(total/10)||1;
  h+='<div class="pagination"><span>共 '+total+' 条</span><div class="pagination-btns">';
  h+='<button class="page-btn" '+(PC_PAGE.page<=1?'disabled':'')+' onclick="loadPurchases('+(PC_PAGE.page-1)+')">上一页</button>';

function renderPurchaseColsDrawer(){
  var kind=pcListKind;
  var shown=document.getElementById('pcShownGrid'), avail=document.getElementById('pcAvailGrid');
  if(!shown||!avail||!pcDraftCols) return;
  var dots='<span class="col-drag"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>';
  shown.innerHTML=pcDraftCols.map(function(k){
    var c=pcColDef(kind,k); if(!c) return '';
    return '<div class="col-chip shown" draggable="true" data-key="'+k+'">'+dots
      +'<span class="col-label">'+stEsc(c.l)+'</span>'
      +'<button type="button" class="col-del" title="移除" onclick="pcRemoveCol(\''+k+'\',event)">−</button></div>';
  }).join('');
  avail.innerHTML=pcDefs(kind).filter(function(c){ return pcDraftCols.indexOf(c.key)<0; }).map(function(c){
    return '<div class="col-chip avail" data-key="'+c.key+'"><span class="col-label">'+stEsc(c.l)+'</span>'
      +'<button type="button" class="col-add" title="添加" onclick="pcAddCol(\''+c.key+'\',event)">+</button></div>';
  }).join('');

function pcAddCol(k,ev){ if(ev) ev.stopPropagation(); if(!pcDraftCols||pcDraftCols.indexOf(k)>=0) return; pcDraftCols.push(k); renderPurchaseColsDrawer(); }
function pcRemoveCol(k,ev){ if(ev) ev.stopPropagation(); if(!pcDraftCols) return; pcDraftCols=pcDraftCols.filter(function(x){ return x!==k; }); renderPurchaseColsDrawer(); }

function pcConfirmCols(){ if(pcDraftCols){ PC_COLS[pcListKind]=pcDraftCols.slice(); pcSaveCols(pcListKind); } closePurchaseColsDrawer(); loadPurchases(PC_PAGE.page); }
function pcReorderCol(from,to,after){
  if(!pcDraftCols) return;
  var arr=pcDraftCols.filter(function(k){ return k!==from; });
  var ti=arr.indexOf(to);
  if(ti<0) ti=arr.length; else if(after) ti+=1;
  arr.splice(ti,0,from); pcDraftCols=arr; renderPurchaseColsDrawer();
}
function initPurchaseColsDnD(){
  var grid=document.getElementById('pcShownGrid'); if(!grid||grid.getAttribute('data-dnd')==='1') return;
  grid.setAttribute('data-dnd','1');
  var dragKey=null;
  grid.addEventListener('dragstart',function(e){ var chip=e.target.closest('.col-chip'); if(!chip) return; dragKey=chip.getAttribute('data-key'); chip.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragKey); }catch(err){} });
  grid.addEventListener('dragend',function(e){ var chip=e.target.closest('.col-chip'); if(chip) chip.classList.remove('dragging'); grid.querySelectorAll('.drag-over').forEach(function(x){ x.classList.remove('drag-over'); }); dragKey=null; });
  grid.addEventListener('dragover',function(e){ if(!dragKey) return; e.preventDefault(); e.dataTransfer.dropEffect='move'; var chip=e.target.closest('.col-chip'); grid.querySelectorAll('.drag-over').forEach(function(x){ if(x!==chip) x.classList.remove('drag-over'); }); if(chip&&chip.getAttribute('data-key')!==dragKey) chip.classList.add('drag-over'); });
  grid.addEventListener('drop',function(e){ if(!dragKey) return; e.preventDefault(); var chip=e.target.closest('.col-chip'); if(!chip) return; var tk=chip.getAttribute('data-key'); if(tk===dragKey) return; var rect=chip.getBoundingClientRect(); var after=(e.clientX-rect.left)>rect.width/2; pcReorderCol(dragKey,tk,after); });
}

/* 表头左右拖拽调整列宽 */
function freezeCols(table){
  if(table.dataset.frozen==='1') return;
  var total=0;
  table.querySelectorAll('thead th').forEach(function(th){ var w=th.offsetWidth; th.style.width=w+'px'; total+=w; });
  table.style.tableLayout='fixed';
  table.style.width=total+'px';
  table.dataset.frozen='1';
}
function enableColResize(table, skip){
  if(!table) return;
  skip = skip || [];
  table.querySelectorAll('thead th').forEach(function(th){
    if(skip.some(function(c){ return th.classList.contains(c); })) return;
    if(th.querySelector('.col-resizer')) return;
    var r=document.createElement('span'); r.className='col-resizer';
    th.appendChild(r);
    r.addEventListener('mousedown', function(e){
      e.preventDefault(); e.stopPropagation();
      freezeCols(table);
      var startX=e.clientX, startW=th.offsetWidth, tableW=table.offsetWidth;
      r.classList.add('active');
      document.body.style.userSelect='none'; document.body.style.cursor='col-resize';
      function move(ev){
        var w=Math.max(40, startW+(ev.clientX-startX));
        th.style.width=w+'px';
        table.style.width=(tableW+(w-startW))+'px';
      }
      function up(){
        document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
        r.classList.remove('active'); document.body.style.userSelect=''; document.body.style.cursor='';
      }
      document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
    });
  });
}
function pcSubtotal(){ return PC.items.reduce(function(a,b){ return a+Number(b.amount||0); },0); }
function pcDiscounted(){ return pcSubtotal()*(Number(PC.discount)||0)/100; }
function pcPayable(){ return pcDiscounted()+Number(PC.freight||0); }
function pcSetDiscount(v){ PC.discount=Number(v)||0; pcUpdateTotals(); }
function pcSetFreight(v){ PC.freight=Number(v)||0; pcUpdateTotals(); }
function pcSetQty(i,v){ if(!PC.items[i])return; PC.items[i].qty=Number(v)||0; PC.items[i].amount=PC.items[i].qty*PC.items[i].price; var a=document.getElementById('pcAmt'+i); if(a)a.textContent=Number(PC.items[i].amount).toFixed(2); pcUpdateTotals(); }
function pcSetPrice(i,v){ if(!PC.items[i])return; PC.items[i].price=Number(v)||0; PC.items[i].amount=PC.items[i].qty*PC.items[i].price; var a=document.getElementById('pcAmt'+i); if(a)a.textContent=Number(PC.items[i].amount).toFixed(2); pcUpdateTotals(); }
function pcSetRemark(i,v){ if(PC.items[i]) PC.items[i].remark=v; }
function pcItemFromGoods(g){ return {goods_id:g.id,name:g.name,spec:pcSpecNames(g),code:g.code||'',barcode:g.barcode||'',unit:g.main_unit||'',qty:1,price:Number(g.purchase_price||0),amount:Number(g.purchase_price||0),remark:''}; }
function pcFillItem(it,g){ it.goods_id=g.id; it.name=g.name; it.spec=pcSpecNames(g); it.code=g.code||''; it.barcode=g.barcode||''; it.unit=g.main_unit||''; it.price=Number(g.purchase_price||0); it.amount=(it.qty||1)*it.price; }
function pcNameChange(i,val){

}
async function pcSave(andPrint){
  if(!PC.supplierId){ var s=document.getElementById('pcSupplierSel'); if(s) PC.supplierId=parseInt(s.getAttribute('data-value'),10)||0; }
  if(!PC.supplierId){ showToast('请选择供应商','error'); return; }
  var items=PC.items.filter(function(it){ return it.goods_id && Number(it.qty)>0; });
  if(!items.length){ showToast('请添加商品明细','error'); return; }
  var body={
    supplier_id:PC.supplierId, salesman_id:PC.salesmanId, account_id:PC.accountId,
    bill_date:PC.billDate, order_date:PC.billDate, discount:Number(PC.discount)||100, freight:Number(PC.freight)||0,
    deposit_offset:Number(PC.deposit)||0, paid_amount:Number(PC.paid)||0, remark:PC.remark,
    items: items.map(function(it){ return {goods_id:it.goods_id, quantity:Number(it.qty), unit_price:Number(it.price), remark:it.remark||''}; })
  };
  var res=await apiPost(PC_KINDS[pcCurKind].base, body);
  if(res&&res.code===0){
    showToast('保存成功');
    var keep=document.getElementById('pcSaveContinue');
    if(keep&&keep.checked){ PC.items=[]; PC.paid=0; PC.remark=''; pcRender(); }
    else { showPage(PC_KINDS[pcCurKind].list); }
  } else showToast((res&&res.message)||'保存失败','error');
}
function onStSelChange(id,val){
  if(id==='pcSupplierSel') PC.supplierId=parseInt(val,10)||0;
  else if(id==='pcSalesmanSel') PC.salesmanId=parseInt(val,10)||0;
  else if(id==='pcAccountSel') PC.accountId=parseInt(val,10)||0;
}

/* ═══════════ Auth ═══════════ */
function logout(){
  State.token='';State.user={};State.tenants=[];State.currentTenant=null;saveState();
  window.location.href='/login.html';
}
function initUser(){
  if(!State.token||!State.user.id){window.location.href='/login.html';return;}
  if(!State.tenants.length){
    State.tenants=[{id:1,name:'我的商户',role:'主账号'}];
    State.currentTenant=State.tenants[0];
    saveState();
  }
}

/* ═══════════ Init ═══════════ */
initUser();
handleHash();
</script>
