    +'<span class="itsel-label" id="incTypeLabel">'+(S.form.typeName||'请选择'+c.label+'类型')+'</span>'
    +'<svg class="itsel-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'
    +'</div>';
}
function incToggleType(e){
  if(e) e.stopPropagation();
  var d=document.getElementById('incTypeDrop');
  if(!d){ d=document.createElement('div'); d.id='incTypeDrop'; d.className='pcnd'; document.body.appendChild(d); }
  var f=document.getElementById('incTypeField'); var r=f.getBoundingClientRect();
  d.style.left=r.left+'px'; d.style.top=(r.bottom+2)+'px'; d.style.width=Math.max(r.width,240)+'px';
  d.innerHTML='<div style="padding:8px;border-bottom:1px solid var(--gray-100)"><input class="itsel-search" id="incTypeSearch" placeholder="搜索" oninput="incTypeRenderOpts()"></div><div id="incTypeOpts"></div>';
  incTypeRenderOpts();
  d.style.display='block';
  setTimeout(function(){ var s=document.getElementById('incTypeSearch'); if(s) s.focus(); },0);
}
function incTypeRenderOpts(){
  var S=incS(incCurMode());
  var kw=(gv('incTypeSearch')||'').toLowerCase();
  var opts=S.types.filter(function(t){ return !kw || (t.name||'').toLowerCase().indexOf(kw)>=0; });
  var el=document.getElementById('incTypeOpts'); if(!el) return;
  el.innerHTML=opts.length?opts.map(function(t){return '<div class="itsel-opt'+(String(S.form.typeId)===String(t.id)?' active':'')+'" onclick="incPickType('+t.id+')">'+stEsc(t.name)+'</div>';}).join(''):'<div class="itsel-opt empty">无匹配类型</div>';
}
function incPickType(id){ var S=incS(incCurMode()); var t=S.types.filter(function(x){return x.id===id;})[0]; if(!t) return; S.form.typeId=t.id; S.form.typeName=t.name; var l=document.getElementById('incTypeLabel'); if(l) l.textContent=t.name; var d=document.getElementById('incTypeDrop'); if(d) d.style.display='none'; }
document.addEventListener('mousedown', function(e){
  var d=document.getElementById('incTypeDrop');
  if(d && d.style.display==='block' && !(e.target.closest && (e.target.closest('#incTypeDrop')||e.target.closest('#incTypeField')))) d.style.display='none';
});
/* 新增/修改其他收入 */
function incPartySearch(el){
  var S=incS(incCurMode());
  var drop=cpndEl();
  var kw=(el.value||'').trim().toLowerCase();
  var rows=[];
  (S.customers||[]).forEach(function(c){ if(!kw||(c.name||'').toLowerCase().indexOf(kw)>=0||(c.phone||'').indexOf(kw)>=0) rows.push({k:'客',name:c.name,contact:c.contact,phone:c.phone,remark:c.remark}); });
  (S.suppliers||[]).forEach(function(s){ if(!kw||(s.name||'').toLowerCase().indexOf(kw)>=0||(s.phone||'').indexOf(kw)>=0) rows.push({k:'供',name:s.name,contact:s.contact,phone:s.phone,remark:s.remark}); });
  rows=rows.slice(0,10);
  S._partyRows=rows;
  var r=el.getBoundingClientRect();
  drop.style.left=r.left+'px'; drop.style.top=(r.bottom+2)+'px'; drop.style.width=Math.max(r.width,820)+'px';
  var h='<table class="cpnd-tbl"><thead><tr><th>名称</th><th style="width:100px">类型</th><th style="width:150px">联系人</th><th style="width:180px">联系电话</th><th>备注</th></tr></thead><tbody>';
  if(!rows.length) h+='<tr><td colspan="5" class="pcnd-empty">无匹配客户/供应商</td></tr>';
  rows.forEach(function(x,idx){
    h+='<tr'+(idx===0?' class="active"':'')+' onmousedown="event.preventDefault();incPickParty('+idx+')">'
      +'<td><div class="pcnd-goods"><span class="cpnd-avatar">'+x.k+'</span><span>'+stEsc(x.name)+'</span></div></td>'
      +'<td>'+(x.k==='客'?'客户':'供应商')+'</td><td>'+stEsc(x.contact||'--')+'</td><td>'+stEsc(x.phone||'--')+'</td><td>'+stEsc(x.remark||'')+'</td></tr>';
  });
  h+='</tbody></table>';
  drop.innerHTML=h; drop.style.display='block';
}
function incPickParty(idx){ var S=incS(incCurMode()); var x=(S._partyRows||[])[idx]; if(!x) return; S.form.partyName=x.name; var el=document.getElementById('incParty'); if(el) el.value=x.name; cpndClose(); }
function incomeCreateHTML(){ window._incMode='income'; setTimeout(function(){ incInit('income'); },0); return '<div id="incForm"><div style="padding:40px;text-align:center;color:var(--gray-400)">加载中...</div></div>'; }
function expenseCreateHTML(){ window._incMode='expense'; setTimeout(function(){ incInit('expense'); },0); return '<div id="incForm"><div style="padding:40px;text-align:center;color:var(--gray-400)">加载中...</div></div>'; }
async function incInit(mode){
  mode=mode||'income'; window._incMode=mode;
  var S=incS(mode), c=incCfg(mode);
  var r=await Promise.all([apiGet('/shop/income-type/list?direction='+c.typeDir),apiGet('/shop/account/all'),apiGet('/shop/salesmen'),apiGet('/shop/customer/all'),apiGet('/shop/supplier/all')]);
  S.types=(r[0]&&r[0].code===0)?r[0].data||[]:[];
  S.accounts=(r[1]&&r[1].code===0)?r[1].data||[]:[];
  S.salesmen=(r[2]&&r[2].code===0)?r[2].data||[]:[];
  S.customers=(r[3]&&r[3].code===0)?r[3].data||[]:[];
  S.suppliers=(r[4]&&r[4].code===0)?r[4].data||[]:[];
  var today=new Date().toISOString().slice(0,10);
  if(S.editId){
    var g=await apiGet(c.api+'/'+S.editId);
    if(g&&g.code===0){
      var d=g.data||{};
      S.form={ typeId:d.type_id||0, typeName:d.type_name||'', partyName:d.party_name||'', salesmanId:String(d.salesman_id||(S.salesmen[0]?S.salesmen[0].id:'0')), billDate:d.bill_date||today, remark:d.remark||'' };
      S.items=(d.items||[]).map(function(it){ return { accountId:it.account_id||0, amount:Number(it.amount||0).toFixed(2) }; });
      if(!S.items.length) S.items=[{accountId:0,amount:''}];
    }else{ S.editId=null; }
  }
  if(!S.editId){
    S.form={ typeId: S.types[0]?S.types[0].id:0, typeName: S.types[0]?S.types[0].name:'', partyName:'', salesmanId: S.salesmen[0]?String(S.salesmen[0].id):'0', billDate:today, remark:'' };
    S.items=[{accountId:0,amount:''},{accountId:0,amount:''},{accountId:0,amount:''}];
  }
  incRender(mode);
}
function incSalesmanOpts(mode){ var S=incS(mode||incCurMode()); var o=S.salesmen.map(function(s){return {v:String(s.id),t:s.name};}); if(!o.length) o=[{v:'0',t:(State.user&&State.user.name)||'老板'}]; return o; }
function incAccountOptions(sel){ var S=incS(incCurMode()); return '<option value="0">请选择账户</option>'+S.accounts.map(function(a){return '<option value="'+a.id+'"'+(String(a.id)===String(sel)?' selected':'')+'>'+stEsc(a.name)+'</option>';}).join(''); }
function incCapture(mode){
  var S=incS(mode||incCurMode());
  var pn=document.getElementById('incParty'); if(pn) S.form.partyName=pn.value;
  var sm=document.getElementById('incSalesmanSel'); if(sm) S.form.salesmanId=sm.getAttribute('data-value');
  var bd=document.getElementById('incBillDate'); if(bd) S.form.billDate=bd.value;
  var rm=document.getElementById('incRemark'); if(rm) S.form.remark=rm.value;
  var rows=document.querySelectorAll('#incForm .inc-item-row');
  if(rows.length){ S.items=[]; rows.forEach(function(row){ var a=row.querySelector('.inc-acc'), m=row.querySelector('.inc-amt'); S.items.push({accountId:a?a.value:0, amount:m?m.value:''}); }); }
}
function incRender(mode){
  mode=mode||incCurMode(); window._incMode=mode;
  var S=incS(mode), c=incCfg(mode);
  incCapture(mode);
  var page=document.getElementById('incForm'); if(!page) return;
  var h='<div class="pc-head" style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:12px"><div></div><div class="pc-title">'+(S.editId?'修改':'新增')+c.doc.replace('详情','')+'</div><div></div></div>';
  h+='<div class="pc-divider"></div>';
  h+='<div class="pc-head" style="justify-content:flex-start">'
    +'<div class="pc-field">'+c.label+'类型 '+incTypeFieldHTML()+'<span class="link" style="color:var(--accent-600);font-size:16px;margin-left:8px" onclick="openIncomeTypes()" title="新增收支类型">＋</span></div>'
    +'<div class="pc-field" style="margin-left:18px">客户/供应商 <input class="cpnd-input" id="incParty" placeholder="请输入客户搜索" value="'+stEsc(S.form.partyName||'')+'" oninput="incPartySearch(this)" onfocus="incPartySearch(this)"></div>'
    +'<div style="flex:1"></div>'
    +'<div class="pc-field">业务员 '+stSelHTML('incSalesmanSel', S.form.salesmanId, incSalesmanOpts(mode), false)+'</div>'
    +'<div class="pc-field">单据日期 '+dateFieldHTML('incBillDate', S.form.billDate, "incS('"+mode+"').form.billDate=this.value")+'</div>'
    +'</div>';
  h+='<div class="pc-tbl-wrap" style="margin-top:16px"><table class="pc-tbl" style="min-width:800px"><thead><tr>'
    +'<th style="width:80px">序号</th><th>'+c.accountLabel+'</th><th style="width:220px" class="num">'+c.amountLabel+'</th>'
    +'</tr></thead><tbody>';
  var rows=Math.max(3, S.items.length);
  for(var i=0;i<rows;i++){ var it=S.items[i]||{accountId:0,amount:''};
    h+='<tr class="inc-item-row"><td>'+(i+1)+'</td>'
      +'<td><select class="pc-cell-input inc-acc" style="width:100%">'+incAccountOptions(it.accountId)+'</select></td>'
      +'<td><input class="pc-cell-input inc-amt" type="number" step="0.01" value="'+stEsc(it.amount)+'" oninput="incSum()" placeholder=""></td></tr>';
  }
  h+='</tbody><tfoot><tr class="pc-sum"><td colspan="2" style="text-align:left;padding-left:14px">合计</td><td class="num" id="incTotal" style="text-align:right;padding-right:12px">0.00</td></tr></tfoot></table></div>';
  h+='<div class="pc-foot" style="margin-top:14px"><div>'
    +'<div class="pc-row" style="align-items:flex-start">备注 <textarea class="pc-textarea" id="incRemark" placeholder="请输入单据备注" oninput="incS(\''+mode+'\').form.remark=this.value">'+stEsc(S.form.remark)+'</textarea></div>'
    +'<div class="pc-row" style="align-items:center"><div class="pc-upload" onclick="showToast(\'上传附件开发中\')"><span style="font-size:20px">+</span>上传附件</div>'
    +'<div style="font-size:12px;color:var(--gray-400)">最多上传5个附件，每个附件最大10MB<br>支持"拖拽上传"和"复制粘贴上传"</div></div>'
    +'</div></div>';
  h+='<div class="pc-footer" style="margin-top:16px">'
    +'<label class="plist-check"><input type="checkbox" id="incSaveContinue"> 保存后继续开单</label>'
    +'<div class="grow"></div>'
    +'<button class="btn btn-secondary" onclick="showPage(\''+c.listKey+'\')">取消</button>'
    +'<button class="btn btn-primary" onclick="incSave(\''+mode+'\')">保存(Alt+S)</button></div>';
  page.innerHTML=h;
  incSum();
}
function incSum(){
  var s=0; document.querySelectorAll('#incForm .inc-amt').forEach(function(el){ s+=Number(el.value)||0; });
  var t=document.getElementById('incTotal'); if(t) t.textContent=s.toFixed(2);
  return s;
}
async function incSave(mode){
  mode=mode||incCurMode();
  var S=incS(mode), c=incCfg(mode);
  incCapture(mode);
  var total=incSum();
  if(total<=0){ showToast('请输入'+c.amountLabel,'error'); return; }
  var items=S.items.filter(function(it){ return Number(it.amount)>0; }).map(function(it){ return { account_id:Number(it.accountId)||0, amount:Number(it.amount)||0 }; });
  var body={ type_id:Number(S.form.typeId)||0, type_name:S.form.typeName, party_name:S.form.partyName, salesman_id:Number(S.form.salesmanId)||0, bill_date:S.form.billDate, remark:S.form.remark, items:items };
  var res = S.editId ? await apiPut(c.api+'/'+S.editId, body) : await apiPost(c.api, body);
  if(res&&res.code===0){
    showToast('保存成功');
    var cont=document.getElementById('incSaveContinue');
    if(cont&&cont.checked){ S.editId=null; S.form.remark=''; S.items=[{accountId:0,amount:''},{accountId:0,amount:''},{accountId:0,amount:''}]; incRender(mode); }
    else { S.editId=null; showPage(c.listKey); }
  } else showToast((res&&res.message)||'保存失败','error');
}
/* 详情 */
function incomeViewHTML(){ window._incMode='income'; setTimeout(function(){ incLoadView('income'); },0); return '<div id="incView"><div style="padding:40px;text-align:center;color:var(--gray-400)">加载中...</div></div>'; }
function expenseViewHTML(){ window._incMode='expense'; setTimeout(function(){ incLoadView('expense'); },0); return '<div id="incView"><div style="padding:40px;text-align:center;color:var(--gray-400)">加载中...</div></div>'; }
async function incLoadView(mode){
  mode=mode||incCurMode(); window._incMode=mode;
  var S=incS(mode), c=incCfg(mode);
  var page=document.getElementById('incView'); if(!page) return;
  var res=await apiGet(c.api+'/'+S.viewId);
  if(!res||res.code!==0){ page.innerHTML='<div style="padding:40px;text-align:center;color:var(--gray-400)">加载失败</div>'; return; }
  S.view=res.data||{}; incRenderView(mode);
}
function incRenderView(mode){
  mode=mode||incCurMode();
  var S=incS(mode), c=incCfg(mode);
  var page=document.getElementById('incView'); if(!page) return;
  var d=S.view||{};
  var h='<div class="pcv-toolbar">'
    +'<span class="link" onclick="openIncEdit(\''+mode+'\',\''+d.id_str+'\')">修改</span>'
    +'<span class="link" onclick="voidInc(\''+mode+'\',\''+d.id_str+'\')">作废</span>'
    +'<span class="link" onclick="showPage(\''+c.listKey+'\')">'+c.doc.replace('详情','列表')+'</span>'
    +'</div>';
  h+='<div class="pcv-title-row"><div class="pcv-title">'+c.doc+'</div><div class="pcv-no">单据编号：<b>'+stEsc(d.order_no||'')+'</b></div></div>';
  h+='<div class="pcv-info" style="justify-content:space-between">'
    +'<span>'+c.label+'类型：<b>'+stEsc(d.type_name||'-')+'</b></span>'
    +'<span>客户/供应商：<b>'+stEsc(d.party_name||'-')+'</b></span>'
    +'<span>业务员：<b>'+stEsc(d.salesman_name||'-')+'</b></span>'
    +'<span>单据日期：<b>'+stEsc(d.bill_date||'-')+'</b></span>'
    +'<span>制单人：<b>'+stEsc(d.maker_name||'-')+'</b></span>'
    +'</div>';
  var items=d.items||[];
  var h2='<div class="pcv-tbl-wrap"><table class="pcv-tbl"><thead><tr><th style="width:60px">序号</th><th>'+c.accountLabel+'</th><th class="num" style="width:220px">'+c.amountLabel+'</th></tr></thead><tbody>';
  if(!items.length) h2+='<tr><td colspan="3" style="text-align:center;padding:20px;color:var(--gray-400)">暂无</td></tr>';
  items.forEach(function(it,i){ h2+='<tr><td>'+(i+1)+'</td><td>'+stEsc(it.account_name||'--')+'</td><td class="num">'+Number(it.amount||0).toFixed(2)+'</td></tr>'; });
  h2+='</tbody><tfoot><tr class="pc-sum"><td colspan="2" style="text-align:left;padding-left:14px">合计</td><td class="num" style="text-align:right;padding-right:12px">'+Number(d.amount||0).toFixed(2)+'</td></tr></tfoot></table></div>';
  h+=h2;
  h+='<div class="pcv-foot" style="margin-top:16px"><div class="row"><span>备注：'+stEsc(d.remark||'-')+' <span class="link" style="color:var(--accent-600)" onclick="showToast(\'修改开发中\')">修改</span></span></div></div>';
  h+='<div style="margin-top:16px"><div class="pc-upload" onclick="showToast(\'上传附件开发中\')"><span style="font-size:20px">+</span>上传附件</div>'
    +'<div style="font-size:12px;color:var(--gray-400);margin-top:6px">最多上传5个附件，每个附件最大10MB<br>支持"拖拽上传"和"复制粘贴上传"</div></div>';
  page.innerHTML=h;
}
/* 收支类型 */
const ITY = { list:[] };
function incomeTypeListHTML(){
  setTimeout(loadIncomeTypes,0);
  return '<div id="ityPage"><div style="padding:40px;text-align:center;color:var(--gray-400)">加载中...</div></div>';
}
async function loadIncomeTypes(){
  var res=await apiGet('/shop/income-type/list');
  ITY.list=(res&&res.code===0)?res.data||[]:[];
  renderIncomeTypes();
}
function renderIncomeTypes(){
  var page=document.getElementById('ityPage'); if(!page) return;
  var h='<div class="plist-toolbar" style="margin-bottom:14px"><button class="btn btn-primary" onclick="ityOpenModal(0)">新增收支类型</button></div>';
  h+='<div class="simple-tbl-wrap"><table class="simple-tbl"><thead><tr><th style="width:80px">序号</th><th>类型名称</th><th style="width:220px">收支方向</th><th style="width:160px">操作</th></tr></thead><tbody>';
  if(!ITY.list.length) h+='<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--gray-400)">暂无数据</td></tr>';
  ITY.list.forEach(function(r,i){
    h+='<tr><td>'+(i+1)+'</td><td>'+stEsc(r.name||'')+'</td><td>'+(Number(r.direction)===2?'支出':'收入')+'</td>'
      +'<td><span class="link" style="color:var(--accent-600)" onclick="ityOpenModal('+r.id+')">修改</span> <span class="link" style="color:var(--danger-500)" onclick="ityDelete('+r.id+')">删除</span></td></tr>';
  });
  h+='</tbody></table></div>';
  page.innerHTML=h;
}
function ityOpenModal(id){
  var t=id?(ITY.list.filter(function(x){return String(x.id)===String(id);})[0]||null):null;
  var old=document.getElementById('ityModal'); if(old) old.remove();
  var m=document.createElement('div'); m.className='modal-overlay show'; m.id='ityModal';
  m.innerHTML='<div class="modal" style="width:560px;max-width:96vw">'
    +'<div class="modal-header"><span class="modal-title">'+(t?'修改其他收支类型':'新增其他收支类型')+'</span><button class="modal-close" onclick="document.getElementById(\'ityModal\').remove()">&times;</button></div>'
    +'<div class="modal-body" style="padding:22px 26px">'
    +'<div class="fa-frow"><label class="fa-flabel">类别名称</label><input class="fa-input" id="ityName" placeholder="请输入类别名称" value="'+stEsc(t?t.name:'')+'"></div>'
    +'<div class="fa-frow"><label class="fa-flabel">收支方向</label><select class="fa-input" id="ityDir"><option value="1"'+(t&&Number(t.direction)===1?' selected':'')+'>收入</option><option value="2"'+(t&&Number(t.direction)===2?' selected':'')+'>支出</option></select></div>'
    +'</div>'
    +'<div class="modal-footer"><button class="btn btn-secondary" onclick="document.getElementById(\'ityModal\').remove()">取消</button><button class="btn btn-primary" onclick="itySubmit('+(id||0)+')">确定</button></div>'
    +'</div>';
  document.body.appendChild(m);
}
async function itySubmit(id){
  var name=gv('ityName').trim();
  if(!name){ showToast('请输入类别名称','error'); return; }
  var body={ name:name, direction:Number(gv('ityDir'))||1 };
  var res = id ? await apiPut('/shop/income-type/'+id, body) : await apiPost('/shop/income-type', body);
  if(res&&res.code===0){ showToast('保存成功'); var m=document.getElementById('ityModal'); if(m)m.remove(); loadIncomeTypes(); }
  else showToast((res&&res.message)||'保存失败','error');
}
async function ityDelete(id){
  if(!confirm('确定删除该类型？')) return;
  var res=await apiDelete('/shop/income-type/'+id);
  if(res&&res.code===0){ showToast('删除成功'); loadIncomeTypes(); } else showToast((res&&res.message)||'删除失败','error');
}

/* ═══════════ Auth ═══════════ */
function logout(){
  State.token='';State.user={};State.tenants=[];State.currentTenant=null;saveState();
  window.location.href='/login.html';
}
function initUser(){
  if(!State.token||!State.user.id){window.location.href='/login.html';return;}
  if(!State.tenants.length){
    State.tenants=[{id:1,name:'我的商户',role:'主账号'}];
    State.currentTenant=State.tenants[0];
    saveState();
  }
}

/* ═══════════ Init ═══════════ */
initUser();
handleHash();
</script>
