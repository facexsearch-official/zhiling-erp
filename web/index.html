    +'<div class="col-grid" id="cuAvailGrid"></div></div>'
    +'<div class="col-drawer-foot"><button class="btn btn-secondary" onclick="cuRestoreDefaultCols()">恢复默认</button>'
    +'<div class="col-foot-right"><button class="btn btn-secondary" onclick="closeCuColsDrawer()">取消</button>'
    +'<button class="btn btn-primary" onclick="cuConfirmCols()">确定</button></div></div>';
  document.body.appendChild(mask); document.body.appendChild(dr);
  renderCuColsDrawer();
  initCuColsDnD();
  setTimeout(function(){ mask.classList.add('show'); dr.classList.add('show'); },0);
}
function closeCuColsDrawer(){
  var m=document.getElementById('cuColsMask'), dr=document.getElementById('cuColsDrawer');
  if(m) m.classList.remove('show'); if(dr) dr.classList.remove('show');
  cuDraftCols=null;
  setTimeout(function(){ if(m) m.remove(); if(dr) dr.remove(); },250);
}
function renderCuColsDrawer(){
  var shown=document.getElementById('cuShownGrid'), avail=document.getElementById('cuAvailGrid');
  if(!shown||!avail||!cuDraftCols) return;
  var dots='<span class="col-drag"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>';
  shown.innerHTML=cuDraftCols.filter(function(k){ return k!=='actions'; }).map(function(k){
    var c=cuColDef(k); if(!c) return '';
    return '<div class="col-chip shown'+(c.fixed?' fixed':'')+'" draggable="true" data-key="'+k+'">'+dots
      +'<span class="col-label">'+stEsc(c.l)+'</span>'
      +(c.fixed?'':'<button type="button" class="col-del" title="移除" onclick="cuRemoveCol(\''+k+'\',event)">−</button>')+'</div>';
  }).join('');
  avail.innerHTML=CU_COL_DEFS.filter(function(c){ return !c.fixed && cuDraftCols.indexOf(c.key)<0; }).map(function(c){
    return '<div class="col-chip avail" data-key="'+c.key+'"><span class="col-label">'+stEsc(c.l)+'</span>'
      +'<button type="button" class="col-add" title="添加" onclick="cuAddCol(\''+c.key+'\',event)">+</button></div>';
  }).join('');
}
function cuAddCol(k,ev){ if(ev) ev.stopPropagation(); if(!cuDraftCols||cuDraftCols.indexOf(k)>=0) return; var arr=cuDraftCols.filter(function(x){ return x!=='actions'; }); arr.push(k); arr.push('actions'); cuDraftCols=arr; renderCuColsDrawer(); }
function cuRemoveCol(k,ev){ if(ev) ev.stopPropagation(); var c=cuColDef(k); if(!cuDraftCols||!c||c.fixed) return; cuDraftCols=cuDraftCols.filter(function(x){ return x!==k; }); renderCuColsDrawer(); }
function cuRestoreDefaultCols(){ cuDraftCols=cuDefaultCols().slice(); renderCuColsDrawer(); }
function cuConfirmCols(){ if(cuDraftCols){ CU.columns=cuNormalizeCols(cuDraftCols); cuSaveCols(); } closeCuColsDrawer(); cuRenderHead(); cuRenderBody(); }
function cuReorderCol(from,to,after){
  if(!cuDraftCols) return;
  var arr=cuDraftCols.filter(function(k){ return k!==from; });
  var ti=arr.indexOf(to);
  if(ti<0) ti=arr.length; else if(after) ti+=1;
  arr.splice(ti,0,from); cuDraftCols=arr; renderCuColsDrawer();
}
function initCuColsDnD(){
  var grid=document.getElementById('cuShownGrid'); if(!grid||grid.getAttribute('data-dnd')==='1') return;
  grid.setAttribute('data-dnd','1');
  var dragKey=null;
  grid.addEventListener('dragstart',function(e){ var chip=e.target.closest('.col-chip'); if(!chip) return; dragKey=chip.getAttribute('data-key'); chip.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',dragKey); }catch(err){} });
  grid.addEventListener('dragend',function(e){ var chip=e.target.closest('.col-chip'); if(chip) chip.classList.remove('dragging'); grid.querySelectorAll('.drag-over').forEach(function(x){ x.classList.remove('drag-over'); }); dragKey=null; });
  grid.addEventListener('dragover',function(e){ if(!dragKey) return; e.preventDefault(); e.dataTransfer.dropEffect='move'; var chip=e.target.closest('.col-chip'); grid.querySelectorAll('.drag-over').forEach(function(x){ if(x!==chip) x.classList.remove('drag-over'); }); if(chip&&chip.getAttribute('data-key')!==dragKey) chip.classList.add('drag-over'); });
  grid.addEventListener('drop',function(e){ if(!dragKey) return; e.preventDefault(); var chip=e.target.closest('.col-chip'); if(!chip) return; var tk=chip.getAttribute('data-key'); if(tk===dragKey) return; var rect=chip.getBoundingClientRect(); var after=(e.clientX-rect.left)>rect.width/2; cuReorderCol(dragKey,tk,after); });
}

const CUCAT = { collapsed:{}, searchMode:false, searchKw:'', editMode:false };
async function cuInit(){

function cuCatChildren(pid){ return CU.categories.filter(function(c){return String(c.parent_id||0)===String(pid||0);}); }
function cuCatById(id){ return CU.categories.filter(function(c){return String(c.id)===String(id);})[0]; }
function cuRenderCatTree(){
  var c=document.getElementById('cuCatTree'); if(!c) return;
  var kw=CUCAT.searchKw.toLowerCase();
  function matchKw(n){ return !kw || (n||'').toLowerCase().indexOf(kw)>=0; }
  var h='';
  var allOpen=kw?true:!CUCAT.collapsed['all'];
  h+='<div class="cat-node'+(CU.catId===0?' active':'')+'" onclick="cuPickCat(this,0)">'
    +'<svg class="cat-caret" viewBox="0 0 24 24" style="transform:rotate('+(allOpen?'90':'0')+'deg)" onclick="event.stopPropagation();cuCatToggleCollapse(\'all\')"><polyline points="9 18 15 12 9 6"/></svg><span>全部</span>';
  if(CUCAT.editMode) h+='<div class="cat-actions-row"><button class="cat-node-actions" title="新增分类" onclick="event.stopPropagation();cuCatAddChild(0)"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>';
  h+='</div>';
  function renderNode(cat, level, parentMatched){
    var kids=cuCatChildren(cat.id), matchT=matchKw(cat.name), hasKids=kids.length>0;
    var expanded=kw?true:!CUCAT.collapsed[cat.id];
    var dc=level===1?' child':level===2?' child2':level===3?' child3':' child4';
    h+='<div class="cat-node'+dc+(String(CU.catId)===String(cat.id)?' active':'')+'" onclick="cuPickCat(this,\''+cat.id+'\')">';
    if(hasKids) h+='<svg class="cat-caret" viewBox="0 0 24 24" style="transform:rotate('+(expanded?'90':'0')+'deg)" onclick="event.stopPropagation();cuCatToggleCollapse(\''+cat.id+'\')"><polyline points="9 18 15 12 9 6"/></svg>';
    else h+='<span class="cat-caret"></span>';
    h+='<span>'+stEsc(cat.name)+'</span>';
    if(CUCAT.editMode){
      h+='<div class="cat-actions-row">';
      if(level<5) h+='<button class="cat-node-actions" title="新增子分类" onclick="event.stopPropagation();cuCatAddChild(\''+cat.id+'\')"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>';
      h+='<button class="cat-node-actions" title="修改" onclick="event.stopPropagation();cuCatEdit(\''+cat.id+'\')"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>'
        +'<button class="cat-node-actions danger" title="删除" onclick="event.stopPropagation();cuCatDelete(\''+cat.id+'\')"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>';
    }
    h+='</div>';
    if(expanded&&hasKids&&level<5){
      kids.forEach(function(ch){ if(!parentMatched&&!matchT&&!matchKw(ch.name)) return; renderNode(ch,level+1,parentMatched||matchT||matchKw(ch.name)); });
    }
  }
  if(allOpen){ cuCatChildren(0).forEach(function(t){ var kids=cuCatChildren(t.id), matchT=matchKw(t.name); if(kw&&!matchT&&!kids.some(function(ch){return matchKw(ch.name);})) return; renderNode(t,1,matchT); }); }
  if(!kw||matchKw('未分类')) h+='<div class="cat-node'+(CU.catId===-1?' active':'')+'" onclick="cuPickCat(this,-1)"><span class="cat-caret"></span><span>未分类</span></div>';
  c.innerHTML=h;
}

function cuRenderPagination(){

    +[10,20,50,100].map(function(n){ return '<div class="stsel-opt'+(n===CU.pageSize?' active':'')+'" data-value="'+n+'" onclick="pickStSel(\'cuPageSizeSel\',\''+n+'\',this,event)">'+n+' 条/页</div>'; }).join('')

  var pagesEl=document.getElementById('cuPageButtons');
  if(totalPages<=1){ pagesEl.innerHTML=''; return; }
  var btns='';
  btns+='<button class="cu-page-btn'+(CU.page<=1?' disabled':'')+'" onclick="cuGoPage('+(CU.page-1)+')"'+(CU.page<=1?' disabled':'')+'><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>';
  var maxShow=5;
  var startPage=Math.max(1,CU.page-Math.floor(maxShow/2));
  var endPage=Math.min(totalPages,startPage+maxShow-1);
  if(endPage-startPage<maxShow-1) startPage=Math.max(1,endPage-maxShow+1);
  if(startPage>1) btns+='<button class="cu-page-btn" onclick="cuGoPage(1)">1</button>';
  if(startPage>2) btns+='<span style="padding:0 4px;color:var(--gray-400)">...</span>';
  for(var i=startPage;i<=endPage;i++){
    btns+='<button class="cu-page-btn'+(i===CU.page?' active':'')+'" onclick="cuGoPage('+i+')">'+i+'</button>';
  }
  if(endPage<totalPages-1) btns+='<span style="padding:0 4px;color:var(--gray-400)">...</span>';
  if(endPage<totalPages) btns+='<button class="cu-page-btn" onclick="cuGoPage('+totalPages+')">'+totalPages+'</button>';
  btns+='<button class="cu-page-btn'+(CU.page>=totalPages?' disabled':'')+'" onclick="cuGoPage('+(CU.page+1)+')"'+(CU.page>=totalPages?' disabled':'')+'><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>';
  pagesEl.innerHTML=btns;
}

var cuCatParentUI={hoverPath:[],sel:''};
function cuCatParentCols(hoverPath, selectedId, excludeId){
  hoverPath=hoverPath||[];
  function opt(id,depth,label){
    var active=String(hoverPath[depth])===String(id);
    var sel=String(selectedId)===String(id);
    var hasChild=cuCatChildren(id).filter(function(c){ return String(c.id)!==String(excludeId); }).length>0;
    return '<div class="cat-opt'+(active?' active':'')+(sel?' selected':'')+'" onmouseover="cuCatParentHover(\''+id+'\','+depth+')" onclick="cuCatParentPick(\''+id+'\')">'+stEsc(label)
      +(hasChild?'<svg class="cat-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>':'<span class="opt-check">'+CU_CAT_CHECK+'</span>')+'</div>';
  }
  var cols=[], col0=opt('0',0,'无（顶级分类）');
  cuCatChildren(0).forEach(function(c){ if(String(c.id)===String(excludeId)) return; col0+=opt(c.id,0,c.name); });
  cols.push(col0);
  for(var depth=1;depth<=5;depth++){
    var pid=hoverPath[depth-1]; if(!pid) break;
    var kids=cuCatChildren(pid).filter(function(c){ return String(c.id)!==String(excludeId); });
    if(!kids.length){ cols.push('<div class="cat-opt empty">暂无子分类</div>'); break; }
    var html=''; kids.forEach(function(c){ html+=opt(c.id,depth,c.name); });
    cols.push(html);
  }
  while(cols.length<2) cols.push('<div class="cat-opt empty">请选择左侧分类</div>');
  return cols;
}

function cuBuildCascade(hoverPath, selectedId){
  hoverPath=hoverPath||[];
  function opt(id,depth,label){
    var active=String(hoverPath[depth])===String(id);
    var sel=String(selectedId)===String(id);

      +(hasChild?'<svg class="cat-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>':'<span class="opt-check">'+CU_CAT_CHECK+'</span>')+'</div>';
  }
  var cols=[], col0='';
  cuCatChildren(0).forEach(function(c){ col0+=opt(c.id,0,c.name); });
  col0+=opt('0',0,'未分类');
  cols.push(col0);
  for(var depth=1;depth<=5;depth++){
    var pid=hoverPath[depth-1]; if(!pid) break;
    var kids=cuCatChildren(pid);
    if(!kids.length){ cols.push('<div class="cat-opt empty">暂无子类别</div>'); break; }

  return cols;
}

window.cuHoverCat=function(id,depth){
  if(_cuHoverTimer) clearTimeout(_cuHoverTimer);
  _cuHoverTimer=setTimeout(function(){
    id=(id && String(id)!=='0')?String(id):'';
    var cur=cuCatUI.hoverPath||[]; var path=cur.slice(0,depth);
    if(id) path[depth]=id;
    if(cuSamePath(path,cur)) return;
    cuCatUI.hoverPath=path; cuRenderCatCols();
  },50);
};
function cuRenderCategoryPicker(){
  var inp=document.getElementById('cuCatInput'); if(!inp) return;

}

async function cuSave(andNew){
  var name=gv('cuName').trim(); if(!name){ showToast('请输入客户名称','error'); return; }
  var body={
    name:name, category_id:CU.form.category_id||null, price_level:CU.form.price_level||'零售价', discount:Number(gv('cuDiscount'))||100,
    init_debt:Number(gv('cuInitDebt'))||0, contact:gv('cuContact'), phone:gv('cuPhone'),
    address:gv('cuAddress'), address_detail:gv('cuAddressDetail'), email:gv('cuEmail'), tax_no:gv('cuTaxNo'), fax:gv('cuFax'),
    bank_name:gv('cuBankName'), bank_account:gv('cuBankAccount'), birthday:gv('cuBirthday'), wechat:gv('cuWechat'), qq:gv('cuQQ'), remark:gv('cuRemark'),
    addresses:CU.addresses
  };
  var res = CU.editId ? await apiPut('/shop/customer/'+CU.editId, body) : await apiPost('/shop/customer', body);
  if(res&&res.code===0){ showToast('保存成功'); if(andNew){ CU.editId=null; cuFormInit(); } else { CU.editId=null; location.href='/customer.html'; } }
  else showToast((res&&res.message)||'保存失败','error');
}

function cuPickDepAccount(el){
  var s=document.getElementById('cuDepAccountSel'); if(!s||!el) return;
  var val=el.getAttribute('data-value')||'';
  s.setAttribute('data-value',val);
  var lb=s.querySelector('.fa-sel-label'); if(lb) lb.textContent=el.textContent;
  var inp=s.querySelector('.fa-sel-input'); if(inp) inp.classList.toggle('placeholder',!val);
  s.querySelectorAll('.fa-sel-opt').forEach(function(o){ o.classList.toggle('active',o===el); });
  s.classList.remove('open');
}

async function cuDepositSubmit(){
  var c=CU.view||{};
  var amount=parseFloat(document.getElementById('cuDepAmount').value);
  var depSel=document.getElementById('cuDepAccountSel');
  var accountId=depSel?depSel.getAttribute('data-value'):'';
  var billDate=new Date().toISOString().slice(0,10);
  var remark=document.getElementById('cuDepRemark').value;
  if(!amount||amount<=0){ showToast('请输入有效存款金额','warn'); return; }
  if(!accountId){ showToast('请选择结算账户','warn'); return; }
  var res=await apiPost('/shop/customer/'+c.id_str+'/deposit',{amount:amount,account_id:parseInt(accountId),bill_date:billDate,remark:remark});
  if(res&&res.code===0){
    showToast('存款成功');
    closeCuDeposit();
    var g=await apiGet('/shop/customer/'+c.id_str);
    if(g&&g.code===0){ CU.view=g.data; cuViewRender(); }
  } else { showToast(res&&res.message||'存款失败','warn'); }
}

function roleParse(s){ if(!s) return {}; try{ var o=JSON.parse(s); return (o&&typeof o==='object')?o:{}; }catch(e){ return {}; } }
function permOn(perms,key){
  if(!perms) return false;
  if(perms['*']) return true;
  if(perms[key]) return true;
  var parts=key.split('.');
  for(var i=parts.length-1;i>=1;i--){ if(perms[parts.slice(0,i).join('.')+'.*']) return true; }
  return false;
}

function roleContentEl(){ return document.querySelector('.content'); }
function roleSecEl(name){ return document.getElementById({basic:'roleBasicSec',perm:'rolePermSec',sens:'roleSensSec'}[name]); }
function roleSetActive(name){
  ROLE.tab=name;
  document.querySelectorAll('.role-nav-item').forEach(function(el){ el.classList.toggle('active', el.getAttribute('data-tab')===name); });
}
function roleScrollTo(name){
  var el=roleSecEl(name);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  roleSetActive(name);
}
function roleOnScroll(){
  if(!document.getElementById('roleBasicSec')) return;
  var content=roleContentEl(); if(!content) return;
  var base=content.getBoundingClientRect().top+90;
  var cur='basic';
  ['basic','perm','sens'].forEach(function(n){
    var el=roleSecEl(n);
    if(el && el.getBoundingClientRect().top<=base) cur=n;
  });
  if(cur!==ROLE.tab) roleSetActive(cur);
}
function roleBindScroll(){
  var content=roleContentEl(); if(!content) return;
  if(ROLE._scrollEl && ROLE._onScroll) ROLE._scrollEl.removeEventListener('scroll', ROLE._onScroll);
  ROLE._scrollEl=content;
  ROLE._onScroll=roleOnScroll;
  content.addEventListener('scroll', ROLE._onScroll);
}
function roleStartResize(e){
  e.preventDefault();
  var nav=document.querySelector('.role-nav'), sp=document.querySelector('.role-splitter');
  if(!nav) return;
  var startX=e.clientX, startW=nav.offsetWidth;
  if(sp) sp.classList.add('dragging');
  function move(ev){ nav.style.width=Math.max(110,Math.min(340,startW+(ev.clientX-startX)))+'px'; }
  function up(){ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); if(sp) sp.classList.remove('dragging'); document.body.style.userSelect=''; }
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
  document.body.style.userSelect='none';
}
function roleGroupToggle(g,checked){
  document.querySelectorAll('#rolePermSec [data-key^="'+g+'."]').forEach(function(c){ c.checked=checked; });
  document.querySelectorAll('#rolePermSec [data-s^="'+g+'."]').forEach(function(c){ c.checked=checked; c.indeterminate=false; });
  roleSyncParents();
}
function roleSubToggle(s,checked){
  document.querySelectorAll('#rolePermSec [data-key^="'+s+'."]').forEach(function(c){ c.checked=checked; });
  roleSyncParents();
}
function roleLeafToggle(){ roleSyncParents(); }
function roleSyncParents(){
  PERM_TREE.forEach(function(g){
    var total=0, checked=0;
    g.subs.forEach(function(s){
      var sel='#rolePermSec [data-key^="'+g.id+'.'+s.id+'."]';
      var st=0, sc=0;
      document.querySelectorAll(sel).forEach(function(c){ total++; st++; if(c.checked){ checked++; sc++; } });
      var scb=document.querySelector('#rolePermSec [data-s="'+g.id+'.'+s.id+'"]');
      if(scb){ scb.checked=(st>0&&sc===st); scb.indeterminate=(sc>0&&sc<st); }
    });
    var gcb=document.querySelector('#rolePermSec [data-g="'+g.id+'"]');
    if(gcb){ gcb.checked=(total>0&&checked===total); gcb.indeterminate=(checked>0&&checked<total); }
  });
}
async function roleSave(cont){
  var name=(gv('roleName')||'').trim();
  if(name.length<2||name.length>50){ showToast('角色名称需 2-50 个字','error'); return; }
  var desc=(gv('roleDesc')||'').trim();
  var perms={};
  document.querySelectorAll('#rolePermSec .perm-leaf').forEach(function(c){ if(c.checked) perms[c.getAttribute('data-key')]=true; });
  var sens={};
  document.querySelectorAll('#roleSensSec .perm-leaf').forEach(function(c){ if(c.checked) sens[c.getAttribute('data-key')]=true; });
  var body={ name:name, description:desc, permissions:JSON.stringify(perms), sensitive_data:JSON.stringify(sens) };
  var res = ROLE.editId ? await apiPut('/shop/role/'+ROLE.editId, body) : await apiPost('/shop/role', body);
  if(res&&res.code===0){
    showToast('保存成功');
    if(cont){ ROLE.editId=null; ROLE.tab='basic'; roleFormInit(); }
    else { ROLE.editId=null; showPage('settings:role'); }
  } else showToast((res&&res.message)||'保存失败','error');
}

function applyRegion(ctrl,sel){ ctrl.__region.search=''; setRegionInputValue(ctrl,sel); if(ctrl.__region.onSelect) ctrl.__region.onSelect(sel); closeRegionDrop(ctrl); }
function finalizeRegion(ctrl){ var names=ctrl.__region.names.slice(); if(names[0]==='中国'||names[0]==='海外') names=names.slice(1); applyRegion(ctrl,{province:names[0]||'',city:names[1]||'',district:names[2]||''}); }
function pickRegion(ctrl,code,depth){ var r=ctrl.__region; r.path=r.path.slice(0,depth); r.names=r.names.slice(0,depth); r.path[depth]=code; r.names[depth]=(code==='__oversea')?'海外':((code==='86')?'中国':regionNameOf(code)); r.search=''; var input=ctrl.querySelector('.region-input'); if(input) input.value=''; var kids=regionChildren(code); if(!kids.length){ finalizeRegion(ctrl); return; } renderRegionDrop(ctrl); }
window.openRegionDrop=function(input){ var ctrl=input.closest('.region-ctrl'); if(!ctrl) return; closeAllRegionDrops(); ensureArea(function(){ renderRegionDrop(ctrl); }); ctrl.querySelector('.region-drop').classList.add('open'); };
window.onRegionInput=function(input){ var ctrl=input.closest('.region-ctrl'); if(!ctrl) return; ctrl.__region.search=(input.value||'').trim(); ensureArea(function(){ renderRegionDrop(ctrl); }); ctrl.querySelector('.region-drop').classList.add('open'); };
document.addEventListener('click', function(e){ var opt=e.target.closest?e.target.closest('.region-opt'):null; if(opt){ var ctrl=opt.closest('.region-ctrl'); if(!ctrl) return; if(opt.getAttribute('data-search')==='1'){ applyRegion(ctrl,{province:opt.getAttribute('data-province')||'',city:opt.getAttribute('data-city')||'',district:opt.getAttribute('data-district')||''}); } else { pickRegion(ctrl,opt.getAttribute('data-code'),parseInt(opt.getAttribute('data-depth'),10)); } return; } if(!e.target.closest || !e.target.closest('.region-ctrl')) closeAllRegionDrops(); });

/* ═══════════ Auth ═══════════ */
function logout(){
  State.token='';State.user={};State.tenants=[];State.currentTenant=null;State.perms=null;State.sens=null;saveState();
  window.location.href='/login.html';
}
function initUser(){
  if(!State.token||!State.user.id){window.location.href='/login.html';return;}
  if(!State.tenants.length){
    State.tenants=[{id:1,name:'我的商户',role:'主账号'}];
    State.currentTenant=State.tenants[0];
    saveState();
  }
}
async function refreshPerms(){
  try{
    var res=await apiGet('/auth/me');
    if(res&&res.code===0&&res.data){
      State.perms=res.data.permissions||{};
      State.sens=res.data.sensitive_data||{};
      if(res.data.user){ State.user={id:res.data.user.id,phone:res.data.user.phone,name:res.data.user.name,avatar:res.data.user.avatar,role:res.data.role}; }
      saveState();
      if(window.PisaShell&&window.PisaShell.refreshSidebar) window.PisaShell.refreshSidebar();
      applyPerms(document.documentElement);
    }
  }catch(e){}
}

/* ═══════════ Init ═══════════ */
initUser();
startPermObserver();
refreshPerms();
handleHash();
</script>
