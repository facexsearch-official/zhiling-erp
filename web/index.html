<style>
/* 布局与主题见 /css/app-shell.css，此处仅保留页面组件样式 */
html{color-scheme:light}
select option{background:#fff;color:var(--gray-700)}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-title{font-size:19px;font-weight:600;color:var(--gray-800)}
.gd-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.gd-tb-left,.gd-tb-right{display:flex;align-items:center;gap:10px}
.search-box{position:relative;width:300px;flex:none}
.search-box input{width:100%;height:36px;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:0 12px 0 36px;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.search-box input:focus{border-color:var(--primary-400);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--gray-400);fill:none;stroke-width:2;pointer-events:none}
.th-tools{width:48px;padding:6px 8px}
.th-gear{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-md);color:var(--gray-500);transition:background .15s,color .15s}
.th-gear:hover{background:var(--gray-200);color:var(--primary-600)}
.th-gear svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.c-idx{width:48px;text-align:center;color:var(--gray-400);font-family:'Inter',monospace}
.th-actions{width:150px;position:sticky;right:0;z-index:2;background:#fff}
.th-tools::after{content:'';position:absolute;top:0;bottom:0;left:100%;width:4px;background:linear-gradient(to right,rgba(0,0,0,.08),rgba(0,0,0,0));pointer-events:none}
.th-actions::before{content:'';position:absolute;top:0;bottom:0;right:100%;width:4px;background:linear-gradient(to left,rgba(0,0,0,.08),rgba(0,0,0,0));pointer-events:none}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--gray-200);margin-bottom:16px}
.tab{padding:10px 16px;font-size:14px;color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--gray-700)}
.tab.active{color:var(--primary-600);border-bottom-color:var(--primary-500);font-weight:500}
.filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.search-wrapper{display:flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--gray-200);border-radius:var(--radius-md);background:#fff;width:260px}
.search-wrapper svg{color:var(--gray-400);width:16px;height:16px;flex-shrink:0}
.search-input{border:none;outline:none;font-size:14px;color:var(--gray-700);width:100%;background:none}
.filter-select{height:34px;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:0 10px;font-size:14px;color:var(--gray-600);background:#fff;outline:none}
.date-input{height:34px;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:0 10px;font-size:14px;color:var(--gray-600);background:#fff;outline:none}
.table-wrapper{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow:hidden}
.table-wrapper table{width:100%;border-collapse:collapse}
.table-wrapper th{background:var(--gray-50);font-size:13px;color:var(--gray-500);padding:10px 14px;text-align:left;font-weight:500;border-bottom:1px solid var(--gray-200)}
.table-wrapper td{padding:10px 14px;font-size:14px;border-bottom:1px solid var(--gray-100);color:var(--gray-700)}
.table-wrapper tr:last-child td{border-bottom:none}
.table-wrapper tr:hover td{background:var(--gray-50)}
.table-wrapper .num{text-align:right;font-variant-numeric:tabular-nums}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:13px;color:var(--gray-500)}
.pagination-btns{display:flex;gap:4px}
.page-btn{padding:4px 10px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);background:#fff;font-size:13px;cursor:pointer;color:var(--gray-600)}
.page-btn:hover{border-color:var(--gray-300)}
.page-btn.active{background:var(--primary-500);color:#fff;border-color:var(--primary-500)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-block;padding:2px 8px;border-radius:var(--radius-full);font-size:13px;font-weight:500;white-space:nowrap}
.badge-default{background:var(--gray-100);color:var(--gray-600)}
.badge-success{background:var(--success-50);color:var(--success-600)}
.badge-warning{background:var(--warning-50);color:var(--warning-600)}
.badge-danger{background:var(--danger-50);color:var(--danger-600)}
.badge-info{background:var(--info-50);color:var(--info-500)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-md);font-size:14px;font-weight:500;border:none;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--primary-500);color:#fff}.btn-primary:hover{background:var(--primary-600)}
.btn-secondary{background:#fff;color:var(--gray-700);border:1px solid var(--gray-200)}.btn-secondary:hover{background:var(--gray-50);border-color:var(--gray-300)}
.btn-teal{background:var(--success-500);color:#fff}.btn-teal:hover{background:var(--success-600)}
.btn-cyan{background:#00B8D4;color:#fff;border:1px solid #00B8D4}.btn-cyan:hover{background:#00A5C0;border-color:#00A5C0}
.btn-danger{background:#fff;color:var(--danger-500);border:1px solid var(--danger-500)}.btn-danger:hover{background:var(--danger-50)}
.btn-ghost{background:none;color:var(--gray-600);padding:6px 10px}.btn-ghost:hover{background:var(--gray-100)}
.btn-sm{padding:5px 10px;font-size:13px}
.op-btns{display:flex;gap:4px}
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;color:var(--gray-800);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.link{font-size:13px;color:var(--primary-500);cursor:pointer;font-weight:400}
.link:hover{text-decoration:underline}
.dash-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.dash-hello{font-size:23px;font-weight:700;color:var(--gray-800)}
.dash-sub{font-size:14px;color:var(--gray-400);margin-top:4px}
.dash-actions{display:flex;gap:8px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:18px 20px}
.stat-top{display:flex;justify-content:space-between;align-items:flex-start}
.stat-label{font-size:14px;color:var(--gray-500);margin-bottom:6px}
.stat-value{font-size:25px;font-weight:700;color:var(--gray-800);font-variant-numeric:tabular-nums}
.stat-change{font-size:13px;color:var(--success-500);margin-top:4px}
.stat-change.down{color:var(--danger-500)}
.stat-icon{width:42px;height:42px;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon svg{width:20px;height:20px}
.stat-icon.blue{background:var(--primary-50);color:var(--primary-500)}
.stat-icon.green{background:var(--success-50);color:var(--success-500)}
.stat-icon.orange{background:var(--warning-50);color:var(--warning-500)}
.stat-icon.red{background:var(--danger-50);color:var(--danger-500)}
.grid-2b{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:160px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--primary-300),var(--primary-500));transition:height .3s}
.bar-val{font-size:12px;color:var(--gray-500);margin-bottom:4px;font-variant-numeric:tabular-nums}
.bar-label{font-size:12px;color:var(--gray-400);margin-top:6px}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{width:140px;height:140px;border-radius:50%;position:relative;flex-shrink:0}
.donut-center{position:absolute;inset:28px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-center b{font-size:17px;font-weight:700;color:var(--gray-800)}
.donut-center span{font-size:12px;color:var(--gray-400)}
.legend{display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--gray-600)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-item b{margin-left:auto;font-variant-numeric:tabular-nums}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-100)}
.rank-row:last-child{border-bottom:none}
.rank-no{width:20px;height:20px;border-radius:var(--radius-sm);background:var(--gray-100);color:var(--gray-500);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.rank-no.top{background:var(--primary-500);color:#fff}
.rank-name{flex:1;font-size:14px;color:var(--gray-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-bar{width:100px;height:6px;background:var(--gray-100);border-radius:3px;overflow:hidden;flex-shrink:0}
.rank-bar i{display:block;height:100%;background:linear-gradient(90deg,#93c5fd,#3b82f6);border-radius:3px}
.rank-val{font-size:13px;color:var(--gray-500);width:66px;text-align:right;font-variant-numeric:tabular-nums}
.warn-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--gray-100);font-size:14px}
.warn-row:last-child{border-bottom:none}
.warn-name{flex:1;color:var(--gray-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warn-qty{font-size:13px;color:var(--gray-500);font-variant-numeric:tabular-nums}
.doc-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--gray-100);font-size:14px}
.doc-row:last-child{border-bottom:none}
.doc-no{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--primary-600);width:128px;flex-shrink:0}
.doc-party{flex:1;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-amt{width:88px;text-align:right;font-variant-numeric:tabular-nums;color:var(--gray-700)}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.quick-tile{border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:16px 6px;text-align:center;cursor:pointer;transition:all .15s}
.quick-tile:hover{border-color:var(--primary-500);color:var(--primary-600);box-shadow:0 2px 8px rgba(59,130,246,.12);transform:translateY(-1px)}
.quick-tile svg{width:22px;height:22px;margin-bottom:6px}
.quick-tile div{font-size:13px}
.overview-row{display:flex;align-items:center;gap:12px;padding:9px 0}
.overview-label{font-size:14px;color:var(--gray-600);width:78px;flex-shrink:0}
.overview-bar{flex:1;height:8px;background:var(--gray-100);border-radius:4px;overflow:hidden}
.overview-bar i{display:block;height:100%;border-radius:4px}
.overview-val{font-size:13px;color:var(--gray-500);width:64px;text-align:right;font-variant-numeric:tabular-nums}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.confirm-body{display:flex;gap:16px;align-items:flex-start}
.confirm-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.confirm-icon svg{width:24px;height:24px}
.confirm-icon.warn{background:#fef3cd;color:#f59e0b}
.confirm-icon.danger{background:#fee2e2;color:#ef4444}
.confirm-icon.info{background:#dbeafe;color:#3b82f6}
.confirm-text h3{font-size:16px;font-weight:600;margin:0 0 4px;color:var(--gray-800)}
.confirm-text p{font-size:14px;color:var(--gray-500);margin:0}
.confirm-text .detail{margin-top:8px;font-size:13px;color:var(--gray-400);background:var(--gray-50);padding:8px 12px;border-radius:6px}
.modal{background:#fff;border-radius:10px;width:640px;max-width:92vw;max-height:88vh;overflow:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--gray-200)}
.modal-title{font-size:17px;font-weight:600}
.modal-close{border:none;background:none;cursor:pointer;color:var(--gray-400);font-size:23px;line-height:1}
.modal-body{padding:20px}
.dep-modal{width:520px}
.dep-modal-head{justify-content:center;position:relative;padding:18px 20px}
.dep-modal-title{font-size:18px;font-weight:500;color:var(--gray-800)}
.dep-modal-head .modal-close{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:0}
.dep-modal-head .modal-close svg{width:18px;height:18px}
.dep-modal-head .modal-close:hover{background:var(--gray-100);color:var(--gray-600)}
.dep-modal-body{padding:28px 34px 8px}
.dep-row{display:flex;align-items:center;margin-bottom:24px}
.dep-label{width:92px;flex-shrink:0;font-size:15px;color:var(--gray-700)}
.dep-input{height:40px;border:1px solid #DCDFE6;border-radius:6px;padding:0 12px;font-size:15px;color:var(--gray-700);outline:none;background:#fff;transition:border-color .15s,box-shadow .15s}
.dep-input::placeholder{color:var(--gray-400)}
.dep-input:focus{border-color:#00B8D4;box-shadow:0 0 0 3px rgba(0,184,212,.12)}
.dep-input.dep-amount{width:400px}
select.dep-input{width:240px;color:var(--gray-700)}
select.dep-input:invalid,select.dep-input.empty{color:var(--gray-400)}
.dep-remark{width:400px}
#cuDepositModal .dep-modal-foot{display:flex;justify-content:flex-end;gap:12px;padding:6px 34px 28px;border-top:none}
.dep-btn-cancel{height:40px;padding:0 26px;border:1px solid #DCDFE6;background:#fff;color:var(--gray-700);border-radius:6px;font-size:15px;cursor:pointer}
.dep-btn-cancel:hover{background:var(--gray-50)}
.dep-btn-ok{height:40px;padding:0 26px;border:none;background:#00B8D4;color:#fff;border-radius:6px;font-size:15px;cursor:pointer}
.dep-btn-ok:hover{background:#00A5C0}
#cuDepositModal .fa-sel-opt.active{color:var(--accent-700)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.form-label{display:block;font-size:14px;color:var(--gray-600);margin-bottom:6px}
.form-input{width:100%;height:36px;border:1px solid var(--gray-300);border-radius:var(--radius-md);padding:0 10px;font-size:14px;outline:none;color:var(--gray-700)}
.form-input:focus{border-color:var(--primary-500)}
/* 自定义下拉（参考设计） */
.stsel{position:relative}
.stsel-input{display:flex;align-items:center;justify-content:space-between;gap:8px;height:36px;border:1px solid var(--gray-300);border-radius:var(--radius-md);padding:0 10px;font-size:14px;color:var(--gray-700);cursor:pointer;background:#fff;transition:border-color .15s,box-shadow .15s}
.stsel.open .stsel-input{border-color:var(--accent-400);box-shadow:0 0 0 3px rgba(16,185,129,.12)}
.stsel.disabled .stsel-input{background:var(--gray-50);color:var(--gray-400);cursor:not-allowed}
.stsel-caret{width:16px;height:16px;color:var(--gray-400);flex-shrink:0;transition:transform .15s}
.stsel.open .stsel-caret{transform:rotate(180deg)}
.stsel-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:210;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-md);box-shadow:0 10px 24px rgba(15,23,42,.12);padding:4px 0;max-height:240px;overflow-y:auto}
.stsel.open .stsel-panel{display:block}
.stsel-opt{position:relative;padding:9px 14px;font-size:14px;color:var(--gray-700);cursor:pointer;white-space:nowrap}
.stsel-label{white-space:nowrap}
.pc-field>.stsel{min-width:150px}
.stsel-opt:hover{background:var(--gray-50)}
.stsel-opt.active{color:var(--gray-900);font-weight:500;padding-left:32px}
.stsel-opt.active::before{content:'';position:absolute;left:13px;top:50%;width:6px;height:11px;border-right:2px solid var(--accent-600);border-bottom:2px solid var(--accent-600);transform:translateY(-60%) rotate(45deg)}
/* 采购列表（仿商品管理） */
.plist-wrap{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg)}
.plist-scroll{overflow-x:auto}
.plist-scroll::-webkit-scrollbar{height:6px}
.plist-scroll::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:5px}
.plist-scroll::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}
.plist-scroll::-webkit-scrollbar-track{background:var(--gray-100);border-radius:5px}
.plist-wrap table{width:100%;min-width:1100px;border-collapse:collapse}
.plist-wrap th{background:var(--gray-50);font-size:13px;color:var(--gray-500);padding:10px 14px;text-align:left;font-weight:500;border-bottom:1px solid var(--gray-200);white-space:nowrap;vertical-align:middle}
.plist-wrap th:not(.plist-tools):not(.plist-actions){min-width:170px}
.plist-wrap td{padding:10px 14px;font-size:14px;color:var(--gray-700);border-bottom:1px solid var(--gray-100);white-space:nowrap;vertical-align:middle}
.plist-wrap tr:last-child td{border-bottom:none}
.plist-wrap tr:hover td{background:var(--gray-50)}
.plist-wrap .num{text-align:right;font-variant-numeric:tabular-nums}
.plist-tools{width:44px;padding:6px 8px;text-align:center;position:sticky;left:0;z-index:3;background:var(--gray-50)}
.plist-idx{width:44px;text-align:center;color:var(--gray-400);position:sticky;left:0;z-index:2;background:#fff;font-variant-numeric:tabular-nums}
.plist-wrap tr:hover .plist-idx{background:var(--gray-50)}
.plist-tools::after,.plist-idx::after{content:'';position:absolute;top:0;bottom:0;left:100%;width:4px;background:linear-gradient(to right,rgba(0,0,0,.08),rgba(0,0,0,0));pointer-events:none}
.plist-actions{width:150px;position:sticky;right:0;z-index:2;background:#fff}
.plist-wrap tr:hover .plist-actions{background:var(--gray-50)}
.plist-actions::before{content:'';position:absolute;top:0;bottom:0;right:100%;width:4px;background:linear-gradient(to left,rgba(0,0,0,.08),rgba(0,0,0,0));pointer-events:none}
.plist-wrap tbody tr{cursor:pointer}
.plist-row-sel td,.plist-row-sel .plist-idx{background:var(--accent-50)!important}
.plist-sum td{background:var(--gray-50);font-weight:500;color:var(--gray-800);border-top:1px solid var(--gray-200)}
.plist-sum .plist-sum-idx{position:sticky;left:0;z-index:2;background:var(--gray-50);text-align:center;color:var(--gray-600)}
.plist-sum .plist-sum-idx::after{content:'';position:absolute;top:0;bottom:0;left:100%;width:4px;background:linear-gradient(to right,rgba(0,0,0,.08),rgba(0,0,0,0));pointer-events:none}
.pc-items-panel{display:flex;flex-direction:column;align-items:center;margin-top:14px}
.pc-items-toggle{display:inline-flex;align-items:center;gap:6px;padding:8px 22px;background:#fff;border:1px solid var(--gray-200);border-bottom:none;border-radius:12px 12px 0 0;font-size:15px;color:var(--gray-700);cursor:pointer}

.print-plabel{width:250px;flex:none;text-align:right;padding-right:16px;font-size:15px;color:var(--gray-700)}
.print-pfield{flex:1;max-width:520px}
.print-select{width:100%;height:42px;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:0 12px;font-size:15px;color:var(--gray-700);background:#fff;outline:none;cursor:pointer}
/* 统一日期选择框 */
.dfield{position:relative;display:inline-flex;align-items:center;width:160px}
.dfield-text{width:100%;height:36px;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:0 34px 0 11px;font-size:14px;outline:none;background:#fff;cursor:pointer;color:var(--gray-700)}
.dfield-text::placeholder{color:var(--gray-400)}
.dfield-text:focus{border-color:var(--accent-400);box-shadow:0 0 0 3px rgba(5,150,105,.10)}
.dfield-native{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;z-index:2}
.dfield-ic{position:absolute;right:10px;width:16px;height:16px;stroke:var(--gray-400);fill:none;stroke-width:2;pointer-events:none}
/* 自定义表头抽屉（与商品一致） */
.col-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:1200}
.col-mask.show{opacity:1;visibility:visible}
.col-drawer{position:fixed;top:0;right:0;height:100%;width:520px;max-width:100vw;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s ease;z-index:1201;display:flex;flex-direction:column}

.col-drawer-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--gray-100)}
.col-drawer-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);color:var(--gray-500);cursor:pointer;border:none;background:none}

.col-drawer-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.col-drawer-title{font-size:17px;font-weight:600;color:var(--gray-800)}
.col-drawer-body{flex:1;padding:18px 20px;overflow-y:auto}
.col-sec-title{font-size:15px;font-weight:600;color:var(--gray-800);margin:6px 0 14px;display:flex;align-items:baseline;gap:8px}
.col-sec-title span{font-size:13px;font-weight:400;color:var(--gray-400)}
.col-sec-title:not(:first-child){margin-top:30px}
.col-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col-chip{position:relative;display:flex;align-items:center;gap:6px;height:44px;padding:0 8px;background:var(--gray-100);border:1px solid transparent;border-radius:var(--radius-md);font-size:15px;color:var(--gray-700);user-select:none;transition:background .12s,border-color .12s}
.col-chip .col-label{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-chip.dragging{opacity:.4}
.col-chip.drag-over{border-color:var(--accent-400);background:var(--accent-50)}
.col-drag{cursor:grab;color:var(--gray-400);display:inline-flex;flex-shrink:0}
.col-drag svg{width:14px;height:14px;fill:currentColor;stroke:none}
.col-del,.col-add{position:absolute;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;flex-shrink:0;transition:opacity .12s,transform .12s;border:none;cursor:pointer}
.col-del{right:-9px;background:var(--danger-500)}
.col-add{right:-9px;background:var(--accent-500)}
.col-chip.shown .col-del{opacity:0;pointer-events:none}
.col-chip.shown:hover .col-del{opacity:1;pointer-events:auto}
.col-chip.avail .col-add{opacity:0;pointer-events:none}
.col-chip.avail:hover .col-add{opacity:1;pointer-events:auto}
.col-chip.avail:hover{background:var(--gray-200)}
.col-drawer-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-top:1px solid var(--gray-100);background:#fff}
.col-foot-right{display:flex;gap:10px}
.plist-filter{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.plist-filter .mini-input{height:34px;border:1px solid var(--gray-300);border-radius:var(--radius-md);padding:0 10px;font-size:14px;outline:none;background:#fff;color:var(--gray-700)}
.plist-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.plist-check{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--gray-600);cursor:pointer}
/* 采购开单 */
.pc-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.pc-title{text-align:center;font-size:19px;font-weight:600;color:var(--gray-800)}
.pc-divider{height:1px;background:var(--gray-200);margin:0 0 16px}
.pc-sup-drop{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:60;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-md);box-shadow:0 10px 24px rgba(15,23,42,.12);max-height:240px;overflow-y:auto;min-width:220px}

.pc-sup-box{position:relative}

.pc-sup-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:220;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-md);box-shadow:0 10px 24px rgba(15,23,42,.14);min-width:680px;max-width:90vw}

.pc-sup-tbl{width:100%;border-collapse:collapse;font-size:14px}
.pc-sup-tbl th{padding:12px 16px;text-align:left;font-weight:600;color:var(--gray-800);border-bottom:1px solid var(--gray-200)}

.pc-sup-icon{width:22px;height:22px;border-radius:50%;border:1px solid var(--accent-400);color:var(--accent-600);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.pc-sup-icon svg{width:13px;height:13px}
.pc-cus-icon{width:22px;height:22px;border-radius:50%;border:1px solid #F59E0B;color:#F59E0B;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.pc-cus-icon svg{width:13px;height:13px}
.pc-sup-add{padding:12px 16px;color:var(--accent-600);font-size:14px;cursor:pointer}
.pc-sup-add:hover{background:var(--accent-50)}
.pc-field{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--gray-600)}
.pc-tbl-wrap{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow-x:auto;margin-bottom:16px}
.pc-tbl{width:100%;min-width:1050px;border-collapse:collapse;table-layout:fixed}
.pc-tbl th{background:var(--gray-50);font-size:13px;color:var(--gray-500);padding:9px 10px;text-align:left;font-weight:500;border-bottom:1px solid var(--gray-200);white-space:nowrap}
.pc-tbl td{padding:4px 8px;border-bottom:1px solid var(--gray-100);font-size:14px;color:var(--gray-700)}

.pc-tbl .pc-gear svg{width:16px;height:16px;stroke:var(--gray-400);fill:none;stroke-width:1.8}

.pc-cell-input{width:100%;height:32px;border:1px solid transparent;border-radius:var(--radius-sm);padding:0 8px;font-size:14px;color:var(--gray-700);outline:none;background:transparent}

.pc-cell-input:focus{border-color:var(--accent-400);background:#fff}
/* 行 hover / focus 高亮 */
.pc-tbl tbody tr:hover td,
.pc-tbl tbody tr:focus-within td{background:#E7F7F3}
/* 商品名称输入框 + 选择：hover 时出现 */
.pc-name-wrap{position:relative}
.pc-name-input{width:100%;padding-right:52px}
.pc-pick{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--accent-600);font-size:14px;cursor:pointer;white-space:nowrap;visibility:hidden}
.pc-pick:hover{text-decoration:underline}
.pc-tbl tbody tr.pc-empty .pc-name-input{visibility:hidden}
.pc-tbl tbody tr.pc-empty:hover .pc-name-input,
.pc-tbl tbody tr.pc-empty:focus-within .pc-name-input{visibility:visible}
.pc-tbl tbody tr:hover .pc-pick,
.pc-tbl tbody tr:focus-within .pc-pick{visibility:visible}
/* +/-：hover 该行时出现（聚焦输入框时不显示），替换行号 */
.pc-rowbtns{display:none;gap:6px;align-items:center;justify-content:center}
.pc-tbl tbody tr:hover:not(:focus-within) .pc-rowno{display:none}
.pc-tbl tbody tr:hover:not(:focus-within) .pc-rowbtns{display:inline-flex}
.pc-plus,.pc-minus{width:20px;height:20px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;line-height:1;cursor:pointer;border:none;padding:0}

/* 商品选择对话框 */
#pcGoodsModal .modal-body{flex:1;min-height:0;padding:0;display:flex}
.pcgm-cats{width:190px;flex-shrink:0;border-right:1px solid var(--gray-200);overflow-y:auto;padding:10px 0}

.pcgm-tbl td.num{text-align:right;font-variant-numeric:tabular-nums}

.pcgm-main{flex:1;display:flex;flex-direction:column;min-width:0}
.pcgm-toolbar{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--gray-100)}
.pcgm-list{flex:1;overflow:auto;padding:0 18px 10px}
.pcgm-tbl{width:100%;min-width:900px;border-collapse:collapse}
.pcgm-tbl th{background:var(--gray-50);font-size:13px;color:var(--gray-500);padding:9px 10px;text-align:left;font-weight:500;border-bottom:1px solid var(--gray-200);white-space:nowrap}

.pcgm-goods{display:flex;align-items:center;gap:10px}

/* 商品名称搜索下拉 */

      <div class="dep-row"><label class="dep-label">存款金额</label>
        <input class="dep-input dep-amount" id="cuDepAmount" type="number" step="0.01" min="0" placeholder="0.00"></div>
      <div class="dep-row"><label class="dep-label">结算账户</label>
        <div class="fa-sel" id="cuDepAccountSel" style="flex:none;width:240px" data-value="">
          <div class="fa-sel-input placeholder" onclick="cuToggleDepAccount(event)"><span class="fa-sel-label">请选择</span><svg class="fa-sel-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
          <div class="fa-sel-panel" id="cuDepAccountPanel"></div>
        </div></div>
      <div class="dep-row"><label class="dep-label">备注</label>
        <input class="dep-input dep-remark" id="cuDepRemark" placeholder="请输入备注"></div>
    </div>
    <div class="modal-footer dep-modal-foot">
      <button class="dep-btn-cancel" onclick="closeCuDeposit()">取消</button>
      <button class="dep-btn-ok" onclick="cuDepositSubmit()">确定</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="cuDepListModal">
  <div class="modal" style="width:680px">
    <div class="modal-header">
      <span class="modal-title">存款记录</span>
      <button class="modal-close" onclick="closeCuDepList()">&times;</button>
    </div>
    <div class="modal-body" id="cuDepListBody" style="max-height:420px;overflow-y:auto">
      <div style="padding:30px;text-align:center;color:var(--gray-400)">加载中...</div>
    </div>
  </div>
</div>
