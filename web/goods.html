<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品管理 - PISA 进销存</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--primary-50:#EFF6FF;--primary-100:#DBEAFE;--primary-200:#BFDBFE;--primary-300:#93C5FD;
--primary-400:#60A5FA;--primary-500:#3B82F6;--primary-600:#2563EB;--primary-700:#1D4ED8;
--gray-50:#F9FAFB;--gray-100:#F3F4F6;--gray-200:#E5E7EB;--gray-300:#D1D5DB;
--gray-400:#9CA3AF;--gray-500:#6B7280;--gray-600:#4B5563;--gray-700:#374151;--gray-800:#1F2937;
--danger-500:#EF4444;--success-500:#22C55E;
--radius-sm:4px;--radius-md:6px;--radius-lg:8px;
--sidebar-width:252px;--sidebar-collapsed:64px;--topbar-height:60px;
}
html,body{height:100%;font-family:'Noto Sans SC','Inter',system-ui,-apple-system,sans-serif;font-size:14px;color:var(--gray-800);background:var(--gray-50)}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;background:none;font:inherit}
input{font:inherit}

/* Page Head */
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-head h1{font-size:18px;font-weight:600;color:var(--gray-800)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-md);font-size:13px;font-weight:500;transition:all .15s;border:1px solid transparent}
.btn-primary{background:var(--primary-500);color:#fff;border-color:var(--primary-500)}
.btn-primary:hover{background:var(--primary-600);border-color:var(--primary-600)}
.btn-outline{background:#fff;color:var(--gray-600);border-color:var(--gray-200)}
.btn-outline:hover{background:var(--gray-50);border-color:var(--gray-300)}
.btn-secondary{background:#fff;color:var(--gray-700);border:1px solid var(--gray-200)}
.btn-secondary:hover{background:var(--gray-50);border-color:var(--gray-300)}
.btn-ghost{background:transparent;color:var(--gray-600);border-color:transparent;padding:0 10px}
.btn-ghost:hover{background:var(--gray-100);color:var(--gray-800)}
.btn-danger{background:transparent;color:var(--danger-500);border-color:transparent;padding:0 10px}
.btn-danger:hover{background:#FEF2F2}
.btn-sm{padding:5px 10px;font-size:12px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* Filter bar */
.filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.filter-bar .search-box{position:relative;width:300px}
.filter-bar .search-box input{width:100%;height:36px;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:0 12px 0 36px;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
.filter-bar .search-box input:focus{border-color:var(--primary-400);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.filter-bar .search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--gray-400);fill:none;stroke-width:2}

/* Table */
.table-wrap{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--gray-200);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead{background:var(--gray-50)}
th{padding:10px 14px;text-align:left;font-size:12px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--gray-200);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--gray-100);font-size:13px;color:var(--gray-700);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--gray-50)}
td.text-right{text-align:right;font-family:'Inter',monospace}
td .yen{color:var(--gray-400);font-size:12px;margin-right:2px}
.actions{display:flex;gap:4px}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--gray-100)}
.pagination .info{font-size:13px;color:var(--gray-500)}
.pagination .pages{display:flex;align-items:center;gap:4px}
.page-btn{min-width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);font-size:13px;color:var(--gray-600);transition:all .15s;border:1px solid var(--gray-200);background:#fff}
.page-btn:hover:not(.disabled):not(.active){background:var(--gray-50);border-color:var(--gray-300)}
.page-btn.active{background:var(--primary-500);color:#fff;border-color:var(--primary-500)}
.page-btn.disabled{opacity:.4;cursor:not-allowed}
.page-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* Empty */
.empty{padding:60px 0;text-align:center;color:var(--gray-400)}
.empty svg{width:48px;height:48px;stroke:var(--gray-300);fill:none;stroke-width:1.2;margin-bottom:12px}
.empty p{font-size:14px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.modal-overlay.show{opacity:1;visibility:visible}
.modal{width:640px;max-width:calc(100vw - 40px);background:#fff;border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,.15);transform:translateY(20px) scale(.97);transition:transform .2s}
.modal-overlay.show .modal{transform:translateY(0) scale(1)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--gray-100)}
.modal-header h2{font-size:17px;font-weight:600}
.modal-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);transition:background .15s;color:var(--gray-400)}
.modal-close:hover{background:var(--gray-100);color:var(--gray-600)}
.modal-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.modal-body{padding:24px}
.modal-footer{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--gray-100)}

/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:13px;font-weight:500;color:var(--gray-600)}
.form-label .req{color:var(--danger-500);margin-left:2px}
.form-input{height:36px;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:0 12px;font-size:14px;color:var(--gray-800);outline:none;transition:border-color .2s,box-shadow .2s;background:#fff}
.form-input:focus{border-color:var(--primary-400);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.form-input::placeholder{color:var(--gray-400)}
.form-input::-webkit-outer-spin-button,.form-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.form-input[type=number]{-moz-appearance:textfield}

/* Toast */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:var(--radius-md);font-size:14px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.15);animation:toastIn .3s ease}
.toast.success{background:var(--success-500)}
.toast.error{background:var(--danger-500)}
.toast.info{background:var(--primary-500)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(12px)}}

/* Loading skeleton */
.skeleton{background:linear-gradient(90deg,var(--gray-100) 25%,var(--gray-200) 50%,var(--gray-100) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
<link rel="stylesheet" href="/css/app-shell.css?v=20260916b">
<link rel="stylesheet" href="/css/tabs.css?v=20260916b">
</head>
<body>

<div class="app">
  <div class="app-body">
    <aside class="sidebar">
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>
    <div class="main">
<div class="content">
  <div class="split">
    <aside class="cat-panel">
      <div class="cat-head">
        <span>商品分类</span>
        <div class="cat-actions">
          <button title="搜索分类" onclick="catSearch()"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
          <button title="新增分类" onclick="catAdd()"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></button>
        </div>
      </div>
      <div class="cat-tree" id="catTree">
        <div class="cat-node active" data-cat="0" onclick="pickCat(this,0)">
          <svg class="cat-caret" viewBox="0 0 24 24" style="transform:rotate(90deg)"><polyline points="9 18 15 12 9 6"/></svg>
          <span>全部</span><span class="cat-count" id="catCountAll">-</span>
        </div>
        <div class="cat-node child" data-cat="uncat" onclick="pickCat(this,-1)">未分类</div>
      </div>
    </aside>
    <div class="split-main">
    <div class="page-head">
      <div class="page-title">商品管理</div>
      <div>
        <button class="btn btn-secondary" onclick="exportData()">导出</button>
        <button class="btn btn-primary" onclick="showCreate()">+ 新增</button>
      </div>
    </div>

    <div class="filter-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="输入名称或编码查询" oninput="onSearchInput()">
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>编码</th>
            <th>货品名称</th>
            <th>条码</th>
            <th style="text-align:right">进货价</th>
            <th style="text-align:right">零售价</th>
            <th style="text-align:right">批发价</th>
            <th style="width:140px">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
      <div class="pagination" id="pagination" style="display:none">
        <div class="info" id="pageInfo"></div>
        <div class="pages" id="pageButtons"></div>
      </div>
    </div>
  </div>
  </div>
  </div>
</div>
    <aside class="help-panel" id="helpPanel"></aside>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="onOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">新增商品</h2>
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="goodsForm" class="form-grid" onsubmit="return false">
        <div class="form-group">
          <label class="form-label">编码</label>
          <input class="form-input" type="text" id="fCode" placeholder="请输入编码">
        </div>
        <div class="form-group">
          <label class="form-label">名称<span class="req">*</span></label>
          <input class="form-input" type="text" id="fName" placeholder="请输入名称" required>
        </div>
        <div class="form-group">
          <label class="form-label">条码</label>
          <input class="form-input" type="text" id="fBarcode" placeholder="请输入条码">
        </div>
        <div class="form-group">
          <label class="form-label">进货价</label>
          <input class="form-input" type="number" id="fPurchasePrice" step="0.01" min="0" placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">零售价</label>
          <input class="form-input" type="number" id="fRetailPrice" step="0.01" min="0" placeholder="0.00">
        </div>
        <div class="form-group">
          <label class="form-label">批发价</label>
          <input class="form-input" type="number" id="fWholesalePrice" step="0.01" min="0" placeholder="0.00">
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="submitBtn" onclick="submitForm()">保存</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
(function(){
  var token = localStorage.getItem('pisa_token');
  if(!token){ location.href='/login.html'; return; }

  var state = { page:1, pageSize:10, keyword:'', catId:0, total:0, list:[], editId:null };
  var searchTimer = null;

  // --- Auth fetch helper ---
  window.apiFetch = function(url, opts){
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers['Authorization'] = 'Bearer ' + token;
    if(opts.body && typeof opts.body==='object' && !(opts.body instanceof FormData)){
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    return fetch(url, opts).then(function(res){
      if(res.status===401){ location.href='/login.html'; throw new Error('Unauthorized'); }
      return res.json();
    });
  };

  // --- Category tree ---
  window.pickCat = function(el, catId){
    document.querySelectorAll('#catTree .cat-node').forEach(function(n){ n.classList.remove('active'); });
    if(el) el.classList.add('active');
    state.catId = catId;
    loadData(1);
  };
  window.catSearch = function(){ showToast('分类搜索开发中'); };
  window.catAdd = function(){ showToast('新增分类开发中'); };

  // --- Sidebar ---
  window.toggleSidebar = function(){
    document.getElementById('sidebar').classList.toggle('collapsed');
  };

  // --- Load user info ---

  // --- Load data ---
  window.loadData = function(page, keyword){
    state.page = page || 1;
    state.keyword = keyword !== undefined ? keyword : state.keyword;
    var params = new URLSearchParams();
    params.set('page', state.page);
    params.set('page_size', state.pageSize);
    if(state.keyword) params.set('keyword', state.keyword);
    if(state.catId > 0) params.set('category_id', state.catId);
    apiFetch('/api/shop/goods/list?' + params.toString()).then(function(res){
      if(res.code !== 0){ showToast(res.message || '加载失败', 'error'); return; }
      state.list = res.data.list || [];
      state.total = res.data.total || 0;
      renderTable();
      renderPagination();
    }).catch(function(e){
      if(e.message !== 'Unauthorized') showToast('网络错误', 'error');
    });
  };

  function renderTable(){
    var tbody = document.getElementById('tableBody');
    if(state.list.length === 0){
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty"><svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg><p>暂无商品数据</p></div></td></tr>';
      return;
    }
    var html = '';
    state.list.forEach(function(item){
      html += '<tr>'
        + '<td>' + esc(item.code || '') + '</td>'
        + '<td>' + esc(item.name || '') + '</td>'
        + '<td>' + esc(item.barcode || '') + '</td>'
        + '<td class="text-right"><span class="yen">¥</span>' + fmtPrice(item.purchase_price) + '</td>'
        + '<td class="text-right"><span class="yen">¥</span>' + fmtPrice(item.retail_price) + '</td>'
        + '<td class="text-right"><span class="yen">¥</span>' + fmtPrice(item.wholesale_price) + '</td>'
        + '<td><div class="actions">'
        + '<button class="btn btn-ghost btn-sm" onclick="showEdit(' + item.id + ')">编辑</button>'
        + '<button class="btn btn-danger btn-sm" onclick="deleteItem(' + item.id + ')">删除</button>'
        + '</div></td></tr>';
    });
    tbody.innerHTML = html;
  }

  function renderPagination(){
    var pag = document.getElementById('pagination');
    var totalPages = Math.ceil(state.total / state.pageSize);
    if(totalPages <= 1){ pag.style.display = 'none'; return; }
    pag.style.display = 'flex';
    var start = (state.page - 1) * state.pageSize + 1;
    var end = Math.min(state.page * state.pageSize, state.total);
    document.getElementById('pageInfo').textContent = '共 ' + state.total + ' 条，第 ' + start + '-' + end + ' 条';

    var btns = '';
    btns += '<button class="page-btn' + (state.page <= 1 ? ' disabled' : '') + '" onclick="loadData(' + (state.page - 1) + ')"' + (state.page <= 1 ? ' disabled' : '') + '><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>';
    var maxShow = 5;
    var startPage = Math.max(1, state.page - Math.floor(maxShow / 2));
    var endPage = Math.min(totalPages, startPage + maxShow - 1);
    if(endPage - startPage < maxShow - 1) startPage = Math.max(1, endPage - maxShow + 1);
    if(startPage > 1) btns += '<button class="page-btn" onclick="loadData(1)">1</button>';
    if(startPage > 2) btns += '<span style="padding:0 4px;color:var(--gray-400)">...</span>';
    for(var i = startPage; i <= endPage; i++){
      btns += '<button class="page-btn' + (i === state.page ? ' active' : '') + '" onclick="loadData(' + i + ')">' + i + '</button>';
    }
    if(endPage < totalPages - 1) btns += '<span style="padding:0 4px;color:var(--gray-400)">...</span>';
    if(endPage < totalPages) btns += '<button class="page-btn" onclick="loadData(' + totalPages + ')">' + totalPages + '</button>';
    btns += '<button class="page-btn' + (state.page >= totalPages ? ' disabled' : '') + '" onclick="loadData(' + (state.page + 1) + ')"' + (state.page >= totalPages ? ' disabled' : '') + '><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>';
    document.getElementById('pageButtons').innerHTML = btns;
  }

  // --- Search ---
  window.onSearchInput = function(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      loadData(1, document.getElementById('searchInput').value.trim());
    }, 300);
  };

  // --- Modal ---
  window.showCreate = function(){
    state.editId = null;
    document.getElementById('modalTitle').textContent = '新增商品';
    document.getElementById('submitBtn').textContent = '保存';
    resetForm();
    openModal();
  };

  window.showEdit = function(id){
    apiFetch('/api/shop/goods/' + id).then(function(res){
      if(res.code !== 0){ showToast(res.message || '获取失败', 'error'); return; }
      state.editId = id;
      document.getElementById('modalTitle').textContent = '编辑商品';
      document.getElementById('submitBtn').textContent = '保存';
      var d = res.data;
      document.getElementById('fCode').value = d.code || '';
      document.getElementById('fName').value = d.name || '';
      document.getElementById('fBarcode').value = d.barcode || '';
      document.getElementById('fPurchasePrice').value = d.purchase_price != null ? d.purchase_price : '';
      document.getElementById('fRetailPrice').value = d.retail_price != null ? d.retail_price : '';
      document.getElementById('fWholesalePrice').value = d.wholesale_price != null ? d.wholesale_price : '';
      openModal();
    }).catch(function(e){
      if(e.message !== 'Unauthorized') showToast('网络错误', 'error');
    });
  };

  function openModal(){
    document.getElementById('modalOverlay').classList.add('show');
    setTimeout(function(){ document.getElementById('fName').focus(); }, 100);
  }

  window.closeModal = function(){
    document.getElementById('modalOverlay').classList.remove('show');
  };

  window.onOverlayClick = function(e){
    if(e.target === e.currentTarget) closeModal();
  };

  function resetForm(){
    document.getElementById('fCode').value = '';
    document.getElementById('fName').value = '';
    document.getElementById('fBarcode').value = '';
    document.getElementById('fPurchasePrice').value = '';
    document.getElementById('fRetailPrice').value = '';
    document.getElementById('fWholesalePrice').value = '';
  }

  // --- Submit ---
  window.submitForm = function(){
    var name = document.getElementById('fName').value.trim();
    if(!name){ showToast('请输入名称', 'error'); document.getElementById('fName').focus(); return; }
    var body = {
      code: document.getElementById('fCode').value.trim(),
      name: name,
      barcode: document.getElementById('fBarcode').value.trim(),
      purchase_price: parseFloat(document.getElementById('fPurchasePrice').value) || 0,
      retail_price: parseFloat(document.getElementById('fRetailPrice').value) || 0,
      wholesale_price: parseFloat(document.getElementById('fWholesalePrice').value) || 0
    };
    var isEdit = state.editId != null;
    var url = isEdit ? '/api/shop/goods/' + state.editId : '/api/shop/goods';
    var method = isEdit ? 'PUT' : 'POST';
    apiFetch(url, { method: method, body: body }).then(function(res){
      if(res.code !== 0){ showToast(res.message || '保存失败', 'error'); return; }
      closeModal();
      showToast(isEdit ? '修改成功' : '新增成功', 'success');
      loadData(state.page);
    }).catch(function(e){
      if(e.message !== 'Unauthorized') showToast('网络错误', 'error');
    });
  };

  // --- Delete ---
  window.deleteItem = function(id){
    if(!confirm('确定要删除该商品吗？')) return;
    apiFetch('/api/shop/goods/' + id, { method: 'DELETE' }).then(function(res){
      if(res.code !== 0){ showToast(res.message || '删除失败', 'error'); return; }
      showToast('删除成功', 'success');
      var totalPages = Math.ceil(state.total / state.pageSize);
      if(state.page > totalPages && totalPages > 0) state.page = totalPages;
      loadData(state.page);
    }).catch(function(e){
      if(e.message !== 'Unauthorized') showToast('网络错误', 'error');
    });
  };

  // --- Export ---
  window.exportData = function(){
    showToast('导出功能开发中', 'info');
  };

  // --- Toast ---
  function showToast(msg, type){
    type = type || 'info';
    var c = document.getElementById('toastContainer');
    var t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(function(){
      t.style.animation = 'toastOut .3s ease forwards';
      setTimeout(function(){ t.remove(); }, 300);
    }, 3000);
  }
  window.showToast = showToast;

  // --- Helpers ---
  function esc(s){
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }
  function fmtPrice(v){
    if(v == null || v === '') return '0.00';
    return parseFloat(v).toFixed(2);
  }

  // --- Keyboard shortcut ---
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeModal();
  });

  function checkAuth() {
  if (!localStorage.getItem('pisa_token')) { location.href = '/login.html'; }
}

// --- Init ---
  checkAuth();
  loadData(1);
})();
</script>
