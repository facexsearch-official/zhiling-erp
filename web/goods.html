<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>货品管理 - PISA 进销存</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--primary-50:#EFF6FF;--primary-100:#DBEAFE;--primary-200:#BFDBFE;--primary-300:#93C5FD;
--primary-400:#60A5FA;--primary-500:#3B82F6;--primary-600:#2563EB;--primary-700:#1D4ED8;
--gray-50:#F9FAFB;--gray-100:#F3F4F6;--gray-200:#E5E7EB;--gray-300:#D1D5DB;
--gray-400:#9CA3AF;--gray-500:#6B7280;--gray-600:#4B5563;--gray-700:#374151;--gray-800:#1F2937;
--danger-500:#EF4444;--success-500:#22C55E;
--radius-sm:4px;--radius-md:6px;--radius-lg:8px;
--sidebar-width:252px;--sidebar-collapsed:64px;--topbar-height:60px;
}
html,body{height:100%;font-family:'Noto Sans SC','Inter',system-ui,-apple-system,sans-serif;font-size:14px;color:var(--gray-800);background:var(--gray-50)}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;background:none;font:inherit}
input{font:inherit}

/* Page Head */
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-head h1{font-size:18px;font-weight:600;color:var(--gray-800)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-md);font-size:13px;font-weight:500;transition:all .15s;border:1px solid transparent}
.btn-primary{background:var(--primary-500);color:#fff;border-color:var(--primary-500)}
.btn-primary:hover{background:var(--primary-600);border-color:var(--primary-600)}
.btn-outline{background:#fff;color:var(--gray-600);border-color:var(--gray-200)}
.btn-outline:hover{background:var(--gray-50);border-color:var(--gray-300)}
.btn-secondary{background:#fff;color:var(--gray-700);border:1px solid var(--gray-200)}
.btn-secondary:hover{background:var(--gray-50);border-color:var(--gray-300)}
.btn-ghost{background:transparent;color:var(--gray-600);border-color:transparent;padding:0 10px}
.btn-ghost:hover{background:var(--gray-100);color:var(--gray-800)}
.btn-danger{background:transparent;color:var(--danger-500);border-color:transparent;padding:0 10px}
.btn-danger:hover{background:#FEF2F2}
.btn-sm{padding:5px 10px;font-size:12px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* Filter bar */
.filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.filter-bar .search-box{position:relative;width:300px}
.filter-bar .search-box input{width:100%;height:36px;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:0 12px 0 36px;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
.filter-bar .search-box input:focus{border-color:var(--primary-400);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.filter-bar .search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--gray-400);fill:none;stroke-width:2}

/* Table */
.table-wrap{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--gray-200);overflow-x:auto}
.table-wrap table{min-width:920px}
.table-wrap td,.table-wrap th{white-space:nowrap}
table{width:100%;border-collapse:collapse}
thead{background:var(--gray-50)}
th{padding:10px 14px;text-align:left;font-size:12px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--gray-200);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--gray-100);font-size:13px;color:var(--gray-700);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--gray-50)}
td.text-right{text-align:right;font-family:'Inter',monospace}
td .yen{color:var(--gray-400);font-size:12px;margin-right:2px}
.actions{display:flex;gap:4px}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--gray-100)}
.pagination .info{font-size:13px;color:var(--gray-500)}
.pagination .pages{display:flex;align-items:center;gap:4px}
.page-btn{min-width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);font-size:13px;color:var(--gray-600);transition:all .15s;border:1px solid var(--gray-200);background:#fff}
.page-btn:hover:not(.disabled):not(.active){background:var(--gray-50);border-color:var(--gray-300)}
.page-btn.active{background:var(--primary-500);color:#fff;border-color:var(--primary-500)}
.page-btn.disabled{opacity:.4;cursor:not-allowed}
.page-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* Empty */
.empty{padding:60px 0;text-align:center;color:var(--gray-400)}
.empty svg{width:48px;height:48px;stroke:var(--gray-300);fill:none;stroke-width:1.2;margin-bottom:12px}
.empty p{font-size:14px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.modal-overlay.show{opacity:1;visibility:visible}
.modal{width:640px;max-width:calc(100vw - 40px);background:#fff;border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,.15);transform:translateY(20px) scale(.97);transition:transform .2s}
.modal-overlay.show .modal{transform:translateY(0) scale(1)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--gray-100)}
.modal-header h2{font-size:17px;font-weight:600}
.modal-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);transition:background .15s;color:var(--gray-400)}
.modal-close:hover{background:var(--gray-100);color:var(--gray-600)}
.modal-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.modal-body{padding:24px}
.modal-footer{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--gray-100)}

/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:13px;font-weight:500;color:var(--gray-600)}
.form-label .req{color:var(--danger-500);margin-left:2px}
.form-input{height:36px;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:0 12px;font-size:14px;color:var(--gray-800);outline:none;transition:border-color .2s,box-shadow .2s;background:#fff}
.form-input:focus{border-color:var(--primary-400);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.form-input::placeholder{color:var(--gray-400)}
.form-input::-webkit-outer-spin-button,.form-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.form-input[type=number]{-moz-appearance:textfield}

/* Toast */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:var(--radius-md);font-size:14px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.15);animation:toastIn .3s ease}
.toast.success{background:var(--success-500)}
.toast.error{background:var(--danger-500)}
.toast.info{background:var(--primary-500)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(12px)}}

/* Tag list */
.tag-list{display:flex;flex-wrap:wrap;gap:6px;min-height:32px;padding:6px 8px;border:1px solid var(--gray-200);border-radius:var(--radius-md);background:#fff;cursor:default;transition:border-color .2s,box-shadow .2s}
.tag-list:focus-within{border-color:var(--primary-400);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.tag-list:empty::before{content:attr(data-placeholder);color:var(--gray-400);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--primary-50);color:var(--primary-700);border-radius:var(--radius-sm);font-size:12px;font-weight:500}
.tag .tag-del{cursor:pointer;color:var(--primary-400);font-size:14px;line-height:1;padding:0 2px;border-radius:2px}
.tag .tag-del:hover{background:var(--primary-100);color:var(--primary-700)}

/* Checklist */
.checklist{max-height:320px;overflow-y:auto;border:1px solid var(--gray-200);border-radius:var(--radius-md)}
.checklist:empty::after{content:'暂无数据';display:block;text-align:center;padding:24px;color:var(--gray-400);font-size:13px}
.check-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background .1s}
.check-item:last-child{border-bottom:none}
.check-item:hover{background:var(--gray-50)}
.check-item.selected{background:var(--primary-50)}
.check-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary-500);cursor:pointer;flex-shrink:0}
.check-item label{font-size:13px;color:var(--gray-700);cursor:pointer;flex:1}

/* Loading skeleton */
.skeleton{background:linear-gradient(90deg,var(--gray-100) 25%,var(--gray-200) 50%,var(--gray-100) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
<link rel="stylesheet" href="/css/app-shell.css?v=20260925">
<link rel="stylesheet" href="/css/tabs.css?v=20260925">
</head>
<body>

<div class="app">
  <div class="app-body">
    <aside class="sidebar">
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>
    <div class="main">
<div class="content">
  <!-- 列表视图 -->
  <div id="listView">
  <div class="split">
    <aside class="cat-panel">
      <div class="cat-head">
        <span>货品分类</span>
        <div class="cat-actions">
          <button title="搜索分类" onclick="catSearch()"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
          <button title="新增分类" onclick="catAdd()"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></button>
        </div>
      </div>
      <div class="cat-tree" id="catTree">
        <div class="cat-node active" data-cat="0" onclick="pickCat(this,0)">
          <svg class="cat-caret" viewBox="0 0 24 24" style="transform:rotate(90deg)"><polyline points="9 18 15 12 9 6"/></svg>
          <span>全部</span><span class="cat-count" id="catCountAll">-</span>
        </div>
        <div class="cat-node child" data-cat="uncat" onclick="pickCat(this,-1)">未分类</div>
      </div>
    </aside>
    <div class="split-main">
    <div class="page-head">
      <div class="page-title">货品管理</div>
      <div>
        <button class="btn btn-secondary" onclick="exportData()">导出</button>
        <button class="btn btn-primary" onclick="showCreate()">+ 新增</button>
      </div>
    </div>

    <div class="filter-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="输入名称或编码查询" oninput="onSearchInput()">
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>编码</th>
            <th style="min-width:160px">货品名称</th>
            <th>类别</th>
            <th>单位</th>
            <th>条码</th>
            <th style="text-align:right">进货价</th>
            <th style="text-align:right">零售价</th>
            <th style="text-align:right">批发价</th>
            <th style="width:140px">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
      <div class="pagination" id="pagination" style="display:none">
        <div class="info" id="pageInfo"></div>
        <div class="pages" id="pageButtons"></div>
      </div>
    </div>
  </div>
  </div>
    </div><!-- /listView -->

  <!-- 表单视图 -->
  <div id="formView" style="display:none">
    <div class="page-head">
      <div class="page-title" id="formTitle">新增货品</div>
      <div>
        <span class="fhint" id="drawerHint" style="margin-right:10px"></span>
        <button class="btn btn-secondary" onclick="closeDrawer()">取消</button>
        <button class="btn btn-secondary" id="saveMoreBtn" onclick="submitForm(true)">保存并继续</button>
        <button class="btn btn-primary" id="saveBtn" onclick="submitForm(false)">保存</button>
      </div>
    </div>
    <div class="form-card">
    <!-- 主信息 -->
    <div class="fsection">
      <div class="frow">
        <div class="fitem">
          <label class="flabel">货品名称<span class="req">*</span></label>
          <input class="finput" id="fName" placeholder="请输入货品名称" autocomplete="off">
          <div class="fhint">扫码枪扫描条码可自动带入</div>
        </div>
        <div class="fitem">
          <label class="flabel">货品图片</label>
          <div class="imggrid" id="imgGrid"></div>
          <div class="fhint">JPG / PNG / GIF / WEBP，最多 5 张，支持拖拽与粘贴</div>
        </div>
      </div>
    </div>

    <!-- 基础信息 -->
    <div class="fsection">
      <div class="fsection-title">基础信息</div>
      <div class="frow">
        <div class="fitem">
          <label class="flabel">编号/货号</label>
          <div class="finline">
            <input class="finput" id="fCode" placeholder="编号/货号/款号等">
            <span class="flink" onclick="genCode()">自动生成</span>
          </div>
        </div>
        <div class="fitem">
          <label class="flabel">条形码</label>
          <div class="finline">
            <input class="finput" id="fBarcode" placeholder="扫码或手动输入">
            <span class="flink" onclick="genBarcode()">自动生成</span>
          </div>
        </div>
        <div class="fitem">
          <label class="flabel">货品类别</label>
          <select class="finput" id="fCategory"></select>
          <span class="flink" onclick="addCategory()">+ 新增类别</span>
        </div>
        <div class="fitem">
          <label class="flabel">品牌</label>
          <div class="tag-list" id="brandTags" data-placeholder="暂无品牌"></div>
          <span class="flink" onclick="openBrandPicker()">+ 添加品牌</span>
        </div>
        <div class="fitem">
          <label class="flabel">产地</label>
          <input class="finput" id="fOrigin" placeholder="如 浙江杭州">
        </div>
        <div class="fitem full">
          <label class="flabel">供货商</label>
          <div class="tag-list" id="supplierTags"></div>
          <span class="flink" onclick="openSupplierPicker()">+ 添加供应商</span>
        </div>
        <div class="fitem full">
          <label class="flabel">备注</label>
          <textarea class="finput" id="fRemark" placeholder="请输入备注" rows="2" style="resize:vertical;min-height:40px"></textarea>
        </div>
      </div>
    </div>

    <!-- 单位与规格 -->
    <div class="fsection">
      <div class="fsection-title">单位与规格</div>

      <div class="unit-main">
        <label class="flabel">主单位</label>
        <select class="finput" id="fUnit" onchange="onMainUnitChange()"></select>
        <span class="flink" onclick="addUnit()">+ 新增单位</span>
        <label class="fswitch" style="margin-left:12px"><input type="checkbox" id="fMultiUnit" onchange="toggleMultiUnit()"> 启用多单位</label>
      </div>
      <div class="fhint" style="margin-top:7px">主单位需设置成商品的最小单位</div>

      <div id="unitWrap" style="display:none">
        <div id="unitBoxes"></div>
        <div style="margin-top:10px"><span class="flink" onclick="addUnitRow()">+ 添加辅单位</span></div>

        <div class="unit-default-title">请选择开单默认单位</div>
        <div class="unit-default-box">
          <div class="fitem"><label class="flabel">销售单位</label><select class="finput" id="fSalesUnit"></select></div>
          <div class="fitem"><label class="flabel">进货单位</label><select class="finput" id="fPurchaseUnit"></select></div>
        </div>
      </div>

      <div class="spec-head">
        <span class="spec-head-label">规格</span>
        <label class="fswitch"><input type="checkbox" id="fMultiSpec" onchange="toggleMultiSpec()"> 启用多规格</label>
        <span class="help-dot" title="启用后可为商品设置颜色、尺码等多种规格组合">?</span>
      </div>

      <div id="specWrap" style="display:none">
        <div id="specGroups"></div>
        <button type="button" class="spec-add" onclick="addSpecGroup()">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加
        </button>
      </div>
    </div>

    <!-- 价格 -->
    <div class="fsection">
      <div class="fsection-title">商品价格</div>
      <div id="priceSimple">
        <div class="frow three">
          <div class="fitem"><label class="flabel">进货价</label><input class="finput" type="number" step="0.01" min="0" id="fPurchasePrice" placeholder="0.00"></div>
          <div class="fitem"><label class="flabel">零售价</label><input class="finput" type="number" step="0.01" min="0" id="fRetailPrice" placeholder="0.00"></div>
          <div class="fitem"><label class="flabel">批发价</label><input class="finput" type="number" step="0.01" min="0" id="fWholesalePrice" placeholder="0.00"></div>
        </div>
      </div>
      <div id="priceMulti" style="display:none">
        <div class="price-unit-bar">
          <span class="price-unit-label">价格单位</span>
          <div class="price-unit-tabs" id="priceUnitTabs"></div>
          <span class="flink price-more" onclick="addMorePrice()">新增更多价格</span>
        </div>
        <div class="spec-table-wrap"><table class="spec-table" id="priceTable"></table></div>
      </div>
    </div>

    <!-- 库存 -->
    <div class="fsection">
      <div class="fsection-title">商品库存</div>
      <label class="fswitch" style="margin-bottom:14px"><input type="checkbox" id="fAlert" onchange="toggleAlert()"> 启用库存预警 <span class="help-dot" title="低于最低库存或高于最高库存时提醒">?</span></label>
      <div id="stockSimple">
        <div class="frow">
          <div class="fitem"><label class="flabel">初始库存</label><input class="finput" type="number" min="0" id="fStock" placeholder="0"></div>
          <div class="fitem"><label class="flabel">初始成本</label><input class="finput" type="number" step="0.01" min="0" id="fInitCost" placeholder="0.00"></div>
        </div>
        <div class="frow" id="alertRow" style="display:none;margin-top:14px">
          <div class="fitem"><label class="flabel">预警下限</label><input class="finput" type="number" min="0" id="fMinStock" placeholder="0"></div>
          <div class="fitem"><label class="flabel">预警上限</label><input class="finput" type="number" min="0" id="fMaxStock" placeholder="0"></div>
        </div>
      </div>
      <div id="stockMulti" style="display:none">
        <div class="spec-table-wrap"><table class="spec-table" id="stockTable"></table></div>
      </div>
    </div>
  
    </div>
  </div><!-- /formView -->
</div>
</div>
    <aside class="help-panel" id="helpPanel"></aside>
  </div>
</div>

<!-- 新增/编辑货品 抽屉 -->


<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- 供应商选择弹窗 -->
<div class="modal-overlay" id="supplierModal">
  <div class="modal">
    <div class="modal-header">
      <h2>选择供应商</h2>
      <button class="modal-close" onclick="closeSupplierPicker()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input class="finput" id="supplierSearch" placeholder="搜索供应商名称…" style="flex:1" oninput="filterSupplierList()">
        <button class="btn btn-secondary btn-sm" onclick="addSupplierInline()">+ 新增</button>
      </div>
      <div class="checklist" id="supplierChecklist"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeSupplierPicker()">取消</button>
      <button class="btn btn-primary" onclick="confirmSupplierPick()">确定</button>
    </div>
  </div>
</div>

<!-- 品牌选择弹窗 -->
<div class="modal-overlay" id="brandModal">
  <div class="modal" style="width:420px">
    <div class="modal-header">
      <h2>选择品牌</h2>
      <button class="modal-close" onclick="closeBrandPicker()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input class="finput" id="brandSearch" placeholder="搜索品牌名称…" style="flex:1" oninput="filterBrandList()">
        <button class="btn btn-secondary btn-sm" onclick="addBrandInline()">+ 新增</button>
      </div>
      <div class="checklist" id="brandChecklist"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeBrandPicker()">取消</button>
      <button class="btn btn-primary" onclick="confirmBrandPick()">确定</button>
    </div>
  </div>
</div>

<input type="file" id="imgPicker" accept="image/*" multiple style="display:none">
<input type="file" id="specImgPicker" accept="image/*" style="display:none">

<!-- 规格自定义排序弹窗 -->
<div class="modal-overlay" id="specSortModal">
  <div class="modal" style="width:520px">
    <div class="modal-header">
      <h2 style="flex:1;text-align:center">自定义排序</h2>
      <button class="modal-close" onclick="closeSpecSort()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="sort-hint"><span id="sortSpecName" class="sort-spec-name"></span><span class="sort-hint-text">请拖动规格值进行排序</span></div>
      <div class="sort-chips" id="sortChips"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" style="color:var(--accent-600);margin-right:auto" onclick="resetSpecSort()">重置</button>
      <button class="btn btn-secondary" onclick="closeSpecSort()">取消</button>
      <button class="btn btn-primary" onclick="saveSpecSort()">保存</button>
    </div>
  </div>
</div>
<script>
(function(){
  var token = localStorage.getItem('pisa_token');
  if(!token){ location.href='/login.html'; return; }

  var state = { page:1, pageSize:10, keyword:'', catId:0, total:0, list:[], editId:null };
  var searchTimer = null;

  // --- Auth fetch helper ---
  window.apiFetch = function(url, opts){
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers['Authorization'] = 'Bearer ' + token;
    if(opts.body && typeof opts.body==='object' && !(opts.body instanceof FormData)){
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    return fetch(url, opts).then(function(res){
      if(res.status===401){ location.href='/login.html'; throw new Error('Unauthorized'); }
      return res.json();
    });
  };

  // --- Category tree ---
  window.pickCat = function(el, catId){
    document.querySelectorAll('#catTree .cat-node').forEach(function(n){ n.classList.remove('active'); });
    if(el) el.classList.add('active');
    state.catId = catId;
    loadData(1);
  };
  window.catSearch = function(){ showToast('分类搜索开发中'); };
  window.catAdd = function(){ showToast('新增分类开发中'); };

  // --- Sidebar ---
  window.toggleSidebar = function(){
    document.getElementById('sidebar').classList.toggle('collapsed');
  };

  // --- Load user info ---

  // --- Load data ---
  window.loadData = function(page, keyword){
    state.page = page || 1;
    state.keyword = keyword !== undefined ? keyword : state.keyword;
    var params = new URLSearchParams();
    params.set('page', state.page);
    params.set('page_size', state.pageSize);
    if(state.keyword) params.set('keyword', state.keyword);
    if(state.catId > 0) params.set('category_id', state.catId);
    apiFetch('/api/shop/goods/list?' + params.toString()).then(function(res){
      if(res.code !== 0){ showToast(res.message || '加载失败', 'error'); return; }
      state.list = res.data.list || [];
      state.total = res.data.total || 0;
      renderTable();
      renderPagination();
    }).catch(function(e){
      if(e.message !== 'Unauthorized') showToast('网络错误', 'error');
    });
  };

  function nameOf(list, id){
    if(!id) return '-';
    var x = list.filter(function(i){ return String(i.id) === String(id); })[0];
    return x ? x.name : '-';
  }

  function renderTable(){
    var tbody = document.getElementById('tableBody');
    if(state.list.length === 0){
      tbody.innerHTML = '<tr><td colspan="9"><div class="empty"><svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg><p>暂无货品数据</p></div></td></tr>';
      return;
    }
    var html = '';
    state.list.forEach(function(item){
      var tags = '';
      if(item.has_multi_unit) tags += '<span class="minitag">多单位</span>';
      if(item.has_multi_spec) tags += '<span class="minitag">多规格</span>';
      html += '<tr>'
        + '<td>' + esc(item.code || '') + '</td>'
        + '<td>' + esc(item.name || '') + tags + '</td>'
        + '<td>' + esc(nameOf(meta.categories, item.category_id)) + '</td>'
        + '<td>' + esc(nameOf(meta.units, item.unit_id)) + '</td>'
        + '<td>' + esc(item.barcode || '') + '</td>'
        + '<td class="text-right"><span class="yen">¥</span>' + fmtPrice(item.purchase_price) + '</td>'
        + '<td class="text-right"><span class="yen">¥</span>' + fmtPrice(item.retail_price) + '</td>'
        + '<td class="text-right"><span class="yen">¥</span>' + fmtPrice(item.wholesale_price) + '</td>'
        + '<td><div class="actions">'
        + '<button class="btn btn-ghost btn-sm" onclick="showEdit(' + item.id + ')">编辑</button>'
        + '<button class="btn btn-danger btn-sm" onclick="deleteItem(' + item.id + ')">删除</button>'
        + '</div></td></tr>';
    });
    tbody.innerHTML = html;
  }

  function renderPagination(){
    var pag = document.getElementById('pagination');
    var totalPages = Math.ceil(state.total / state.pageSize);
    if(totalPages <= 1){ pag.style.display = 'none'; return; }
    pag.style.display = 'flex';
    var start = (state.page - 1) * state.pageSize + 1;
    var end = Math.min(state.page * state.pageSize, state.total);
    document.getElementById('pageInfo').textContent = '共 ' + state.total + ' 条，第 ' + start + '-' + end + ' 条';

    var btns = '';
    btns += '<button class="page-btn' + (state.page <= 1 ? ' disabled' : '') + '" onclick="loadData(' + (state.page - 1) + ')"' + (state.page <= 1 ? ' disabled' : '') + '><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>';
    var maxShow = 5;
    var startPage = Math.max(1, state.page - Math.floor(maxShow / 2));
    var endPage = Math.min(totalPages, startPage + maxShow - 1);
    if(endPage - startPage < maxShow - 1) startPage = Math.max(1, endPage - maxShow + 1);
    if(startPage > 1) btns += '<button class="page-btn" onclick="loadData(1)">1</button>';
    if(startPage > 2) btns += '<span style="padding:0 4px;color:var(--gray-400)">...</span>';
    for(var i = startPage; i <= endPage; i++){
      btns += '<button class="page-btn' + (i === state.page ? ' active' : '') + '" onclick="loadData(' + i + ')">' + i + '</button>';
    }
    if(endPage < totalPages - 1) btns += '<span style="padding:0 4px;color:var(--gray-400)">...</span>';
    if(endPage < totalPages) btns += '<button class="page-btn" onclick="loadData(' + totalPages + ')">' + totalPages + '</button>';
    btns += '<button class="page-btn' + (state.page >= totalPages ? ' disabled' : '') + '" onclick="loadData(' + (state.page + 1) + ')"' + (state.page >= totalPages ? ' disabled' : '') + '><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>';
    document.getElementById('pageButtons').innerHTML = btns;
  }

  // --- Search ---
  window.onSearchInput = function(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      loadData(1, document.getElementById('searchInput').value.trim());
    }, 300);
  };

  // ═══════════ 抽屉表单 ═══════════
  var meta = { categories: [], units: [], suppliers: [], brands: [], attributes: [], loaded: false };
  var form = { images: [], units: [], specGroups: [], priceRows: {}, stockRows: {}, priceUnit: '', suppliers: [], brand: '', salesUnit: '', purchaseUnit: '', editId: null };

  function el(id){ return document.getElementById(id); }
  function num(id){ return parseFloat(el(id).value) || 0; }
  function int(id){ return parseInt(el(id).value, 10) || 0; }
  function checked(id){ return el(id).checked; }

  // --- 元数据（分类 / 单位 / 供货商）---
  function fillSelect(id, list, placeholder, selected){
    var e = el(id); if(!e) return;
    var h = '<option value="">' + placeholder + '</option>';
    list.forEach(function(x){
      h += '<option value="' + x.id + '"' + (String(selected) === String(x.id) ? ' selected' : '') + '>'
         + (x.name || '') + '</option>';
    });
    e.innerHTML = h;
  }

  function loadMeta(force){
    if(meta.loaded && !force) return Promise.resolve();
    return Promise.all([
      apiFetch('/api/shop/category/all'),
      apiFetch('/api/shop/unit/all'),
      apiFetch('/api/shop/supplier/all'),
      apiFetch('/api/shop/goods/brands'),
      apiFetch('/api/shop/attribute/all')
    ]).then(function(r){
      meta.categories = (r[0] && r[0].data) || [];
      meta.units      = (r[1] && r[1].data) || [];
      meta.suppliers  = (r[2] && r[2].data) || [];
      meta.brands     = (r[3] && r[3].data) || [];
      meta.attributes = (r[4] && r[4].data) || [];
      meta.loaded = true;
      fillSelect('fCategory', meta.categories, '未分类', el('fCategory').value);
      fillSelect('fUnit', meta.units, '请选择', el('fUnit').value);
      renderSupplierTags();
      renderBrandTags();
      if(checked('fMultiUnit')) renderUnits();
      else syncDefaultUnitOptions();
      if(checked('fMultiSpec')) renderSpecGroups();
    }).catch(function(e){
      if(e.message !== 'Unauthorized') showToast('基础资料加载失败', 'error');
    });
  }

  // --- 抽屉开关 ---
  var ADD_KEY = 'goods:add';
  var LIST_KEY = 'goods:list';

  function addFormTab(){
    if(!window.PisaTabs) return;
    PisaTabs.touch(ADD_KEY, '添加货品', '/goods.html#goods:add');
  }
  function removeFormTab(){
    if(!window.PisaTabs) return;
    // 先把激活标签切回「货品」，再关掉新增标签（避免关闭时整页跳转）
    PisaTabs.touch(LIST_KEY, '货品', '/goods.html');
    PisaTabs.close(ADD_KEY);
    if(location.hash === '#goods:add'){
      try{ history.replaceState(null, '', '/goods.html'); }catch(e){}
    }
  }

  function openDrawer(){
    el('listView').style.display = 'none';
    el('formView').style.display = '';
    var c = document.querySelector('.content');
    if(c) c.scrollTop = 0;
    setTimeout(function(){ el('fName').focus(); }, 120);
  }
  window.closeDrawer = function(){
    el('formView').style.display = 'none';
    el('listView').style.display = '';
    if(form.editId == null) removeFormTab();
  };

  window.showCreate = function(){
    form.editId = null;
    state.editId = null;
    el('formTitle').textContent = '新增货品';
    el('saveMoreBtn').style.display = '';
    resetForm();
    loadMeta().then(function(){
      openDrawer();
      addFormTab();
    });
  };

  window.showEdit = function(id){
    loadMeta().then(function(){
      return apiFetch('/api/shop/goods/' + id);
    }).then(function(res){
      if(!res || res.code !== 0){ showToast((res && res.message) || '获取失败', 'error'); return; }
      var d = res.data;
      form.editId = id;
      state.editId = id;
      el('formTitle').textContent = '编辑货品';
      el('saveMoreBtn').style.display = 'none';
      resetForm();

      el('fName').value        = d.name || '';
      el('fCode').value        = d.code || '';
      el('fBarcode').value     = d.barcode || '';
      el('fRemark').value      = d.remark || '';
      el('fOrigin').value      = d.origin || '';
      form.brand = d.brand || '';
      renderBrandTags();
      el('fPurchasePrice').value  = d.purchase_price || '';
      el('fRetailPrice').value    = d.retail_price || '';
      el('fWholesalePrice').value = d.wholesale_price || '';
      el('fStock').value       = d.current_stock || '';
      el('fInitCost').value    = d.init_cost || '';
      el('fCategory').value    = d.category_id || '';
      el('fUnit').value        = d.unit_id || '';

      // 供货商：兼容 supplier_id（旧）和 suppliers（新 JSON）
      form.suppliers = [];
      try {
        var parsed = JSON.parse(d.suppliers || '[]');
        if (Array.isArray(parsed) && parsed.length) {
          form.suppliers = parsed;
        } else if (d.supplier_id) {
          form.suppliers = [d.supplier_id];
        }
      } catch(e) {
        if (d.supplier_id) form.suppliers = [d.supplier_id];
      }
      renderSupplierTags();

      el('fMultiUnit').checked = !!d.has_multi_unit;
      el('fMultiSpec').checked = !!d.has_multi_spec;
      el('fAlert').checked     = !!d.enable_stock_alert;
      el('fMinStock').value    = d.min_stock || '';
      el('fMaxStock').value    = d.max_stock || '';
      toggleMultiUnit();
      toggleMultiSpec();
      toggleAlert();

      var rawUnits = (d.units || []).filter(function(u){ return !u.is_main; });
      var absArr = rawUnits.map(function(u){ return u.factor || 1; });
      var relArr = absToRel(absArr);
      form.units = rawUnits.map(function(u, i){
        return { unit_id: u.unit_id, unit_name: u.unit_name || '', factor: absArr[i], rel: relArr[i] };
      });
      form.salesUnit = d.sales_unit || '';
      form.purchaseUnit = d.purchase_unit || '';
      try{ form.specGroups = JSON.parse(d.spec_groups || '[]') || []; }catch(e){ form.specGroups = []; }
      if(!Array.isArray(form.specGroups)) form.specGroups = [];
      form.specGroups.forEach(function(g){
        g.hasImage = !!g.hasImage;
        g.values = (g.values || []).map(function(v){
          return (typeof v === 'string') ? { name:v, image:'' } : { name:v.name||'', image:v.image||'' };
        });
      });
      try{ form.priceRows = JSON.parse(d.price_rows || '{}') || {}; }catch(e){ form.priceRows = {}; }
      if(typeof form.priceRows !== 'object' || form.priceRows === null) form.priceRows = {};
      try{ form.stockRows = JSON.parse(d.stock_rows || '{}') || {}; }catch(e){ form.stockRows = {}; }
      if(typeof form.stockRows !== 'object' || form.stockRows === null) form.stockRows = {};
      form.priceUnit = '';
      try{ form.images = JSON.parse(d.images || '[]') || []; }catch(e){ form.images = []; }
      if(!form.images.length && d.image_url) form.images = [d.image_url];
      renderImages(); renderUnits(); renderSpecGroups();
      openDrawer();
    }).catch(function(e){
      if(e.message !== 'Unauthorized') showToast('网络错误', 'error');
    });
  };

  function resetForm(){
    ['fName','fCode','fBarcode','fRemark','fOrigin','fPurchasePrice','fRetailPrice',
     'fWholesalePrice','fStock','fInitCost','fMinStock','fMaxStock'].forEach(function(id){
      var e = el(id); if(e) e.value = '';
    });
    ['fMultiUnit','fMultiSpec','fAlert'].forEach(function(id){ el(id).checked = false; });
    el('fCategory').value = ''; el('fUnit').value = '';
    form.brand = '';
    renderBrandTags();
    form.images = []; form.units = []; form.specGroups = []; form.suppliers = [];
    form.priceRows = {}; form.stockRows = {}; form.priceUnit = '';
    form.salesUnit = ''; form.purchaseUnit = '';
    renderImages(); renderUnits(); renderSpecGroups(); renderSupplierTags();
    toggleMultiUnit(); toggleMultiSpec(); toggleAlert();
    el('drawerHint').textContent = '';
  }

  // --- 开关联动 ---
  window.toggleMultiUnit = function(){
    var on = checked('fMultiUnit');
    el('unitWrap').style.display = on ? '' : 'none';
    if(on && !form.units.length){
      form.units = [{ unit_name:'', rel:1 }];
    }
    renderUnits();
  };
  window.toggleMultiSpec = function(){
    var on = checked('fMultiSpec');
    el('specWrap').style.display = on ? '' : 'none';
    if(on && !form.specGroups.length){ form.specGroups = [{ name:'', hasImage:false, values:[] }]; }
    renderSpecGroups();
  };
  window.toggleAlert = function(){
    var on = checked('fAlert');
    el('alertRow').style.display = on ? '' : 'none';
    if(checked('fMultiSpec')) renderStockTable();
  };

  // --- 自动生成 ---
  function ean13(){
    var d = '69';
    for(var i=0;i<10;i++) d += Math.floor(Math.random()*10);
    var sum = 0;
    for(var j=0;j<12;j++) sum += parseInt(d.charAt(j),10) * (j%2===0?1:3);
    return d + ((10 - (sum%10)) % 10);
  }
  window.genCode = function(){
    apiFetch('/api/shop/goods/next-code').then(function(res){
      if(res.code === 0 && res.data && res.data.code) el('fCode').value = res.data.code;
      else el('fCode').value = 'SP' + Date.now().toString().slice(-10);
    }).catch(function(){ el('fCode').value = 'SP' + Date.now().toString().slice(-10); });
  };
  window.genBarcode = function(){ el('fBarcode').value = ean13(); };

  // --- 新增类别 / 单位 ---
  window.addCategory = function(){
    var name = (prompt('请输入类别名称') || '').trim();
    if(!name) return;
    apiFetch('/api/shop/category', { method:'POST', body:{ name:name } }).then(function(res){
      if(res.code !== 0){ showToast(res.message || '新增失败', 'error'); return; }
      meta.loaded = false;
      loadMeta(true).then(function(){ el('fCategory').value = res.data.id; });
      showToast('类别已新增', 'success');
    });
  };
  window.addUnit = function(){
    var name = (prompt('请输入单位名称，如 个 / 箱') || '').trim();
    if(!name) return;
    apiFetch('/api/shop/unit', { method:'POST', body:{ name:name } }).then(function(res){
      if(res.code !== 0){ showToast(res.message || '新增失败', 'error'); return; }
      meta.loaded = false;
      loadMeta(true).then(function(){ el('fUnit').value = res.data.id; });
      showToast('单位已新增', 'success');
    });
  };

  // --- 供货商多选 ---
  function renderSupplierTags(){
    var c = el('supplierTags');
    if(!form.suppliers.length){ c.innerHTML = ''; c.setAttribute('data-placeholder','暂无供应商，点击添加'); return; }
    c.removeAttribute('data-placeholder');
    var h = '';
    form.suppliers.forEach(function(id, i){
      var s = meta.suppliers.filter(function(x){ return String(x.id)===String(id); })[0];
      var name = s ? s.name : ('#' + id);
      h += '<span class="tag">' + esc(name) + '<span class="tag-del" onclick="removeSupplier(' + i + ')">×</span></span>';
    });
    c.innerHTML = h;
  }
  window.removeSupplier = function(i){
    form.suppliers.splice(i, 1);
    renderSupplierTags();
  };

  // 供应商选择弹窗
  var _pendingSupplierPick = [];
  window.openSupplierPicker = function(){
    _pendingSupplierPick = form.suppliers.slice();
    var search = el('supplierSearch');
    if(search) search.value = '';
    renderSupplierChecklist();
    el('supplierModal').classList.add('show');
    if(search) setTimeout(function(){ search.focus(); }, 100);
  };
  window.closeSupplierPicker = function(){
    el('supplierModal').classList.remove('show');
  };
  window.confirmSupplierPick = function(){
    form.suppliers = _pendingSupplierPick.slice();
    renderSupplierTags();
    closeSupplierPicker();
  };

  function renderSupplierChecklist(filter){
    var c = el('supplierChecklist');
    var list = meta.suppliers;
    if(filter){
      var kw = filter.toLowerCase();
      list = list.filter(function(s){ return (s.name||'').toLowerCase().indexOf(kw) !== -1; });
    }
    if(!list.length){ c.innerHTML = ''; return; }
    var h = '';
    list.forEach(function(s){
      var checked = _pendingSupplierPick.indexOf(s.id) !== -1;
      h += '<div class="check-item' + (checked ? ' selected' : '') + '" onclick="toggleSupplierPick(' + s.id + ',this)">'
        + '<input type="checkbox"' + (checked ? ' checked' : '') + ' onclick="event.stopPropagation();toggleSupplierPick(' + s.id + ',this.parentElement)">'
        + '<label onclick="event.stopPropagation();toggleSupplierPick(' + s.id + ',this.parentElement)">' + esc(s.name) + '</label>'
        + '</div>';
    });
    c.innerHTML = h;
  }
  window.toggleSupplierPick = function(id, el){
    var idx = _pendingSupplierPick.indexOf(id);
    if(idx === -1) _pendingSupplierPick.push(id);
    else _pendingSupplierPick.splice(idx, 1);
    renderSupplierChecklist(el('supplierSearch') ? el('supplierSearch').value.trim() : '');
  };
  window.filterSupplierList = function(){
    renderSupplierChecklist(el('supplierSearch').value.trim());
  };
  window.addSupplierInline = function(){
    var name = (prompt('请输入供应商名称') || '').trim();
    if(!name) return;
    apiFetch('/api/shop/supplier', { method:'POST', body:{ name:name } }).then(function(res){
      if(res.code !== 0){ showToast(res.message || '新增失败', 'error'); return; }
      meta.loaded = false;
      loadMeta(true).then(function(){
        // 自动勾选新增的供应商
        if(res.data && res.data.id && _pendingSupplierPick.indexOf(res.data.id) === -1){
          _pendingSupplierPick.push(res.data.id);
        }
        renderSupplierChecklist(el('supplierSearch') ? el('supplierSearch').value.trim() : '');
      });
      showToast('供应商已新增', 'success');
    });
  };

  // --- 品牌选择弹窗（单选）---
  var _pendingBrandPick = '';
  function renderBrandTags(){
    var c = el('brandTags');
    var v = form.brand || '';
    if(!v){ c.innerHTML = ''; c.setAttribute('data-placeholder','暂无品牌，点击添加'); return; }
    c.removeAttribute('data-placeholder');
    c.innerHTML = '<span class="tag">' + esc(v) + '<span class="tag-del" onclick="removeBrand()">×</span></span>';
  }
  window.removeBrand = function(){
    form.brand = '';
    renderBrandTags();
  };
  window.openBrandPicker = function(){
    _pendingBrandPick = form.brand || '';
    var search = el('brandSearch');
    if(search) search.value = '';
    renderBrandChecklist();
    el('brandModal').classList.add('show');
    if(search) setTimeout(function(){ search.focus(); }, 100);
  };
  window.closeBrandPicker = function(){
    el('brandModal').classList.remove('show');
  };
  window.confirmBrandPick = function(){
    form.brand = _pendingBrandPick;
    renderBrandTags();
    closeBrandPicker();
  };
  function renderBrandChecklist(filter){
    var c = el('brandChecklist');
    var list = meta.brands || [];
    if(filter){
      var kw = filter.toLowerCase();
      list = list.filter(function(s){ return s.toLowerCase().indexOf(kw) !== -1; });
    }
    // 合并：已有列表 + 当前输入的新名称
    var searchVal = (el('brandSearch') ? el('brandSearch').value.trim() : '');
    var allItems = list.slice();
    if(searchVal && allItems.indexOf(searchVal) === -1){
      allItems.push(searchVal);
    }

  function addImageFiles(files){
    if(!files || !files.length) return;
    var room = 5 - form.images.length;
    if(room <= 0){ showToast('最多 5 张图片', 'error'); return; }
    var list = Array.prototype.slice.call(files).slice(0, room);
    var pending = list.length;
    list.forEach(function(f){
      if(!/^image\//.test(f.type)){ pending--; return; }
      var fd = new FormData();
      fd.append('file', f);
      apiFetch('/api/shop/upload', { method:'POST', body: fd }).then(function(res){
        if(res.code === 0 && res.data && res.data.url){
          form.images.push(res.data.url);
          renderImages();
        }else{
          showToast(res.message || '上传失败', 'error');
        }
      }).catch(function(){ showToast('上传失败', 'error'); })
        .then(function(){ pending--; });
    });
  }

  window.resetSpecSort = function(){

    var order = attrValues(findAttr(g.name));
    specSort.values = g.values.slice().sort(function(a, b){
      var ia = order.indexOf(a.name), ib = order.indexOf(b.name);

  };
  function renderSortChips(){
    el('sortChips').innerHTML = specSort.values.map(function(n, i){
      return '<span class="sort-chip" draggable="true" data-i="' + i + '">' + esc(n) + '</span>';
    }).join('');
    bindSortDrag();
  }
  function bindSortDrag(){
    var chips = el('sortChips').querySelectorAll('.sort-chip');
    var dragI = -1;
    chips.forEach(function(ch){
      ch.addEventListener('dragstart', function(e){ dragI = parseInt(this.getAttribute('data-i'),10); this.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
      ch.addEventListener('dragend', function(){ this.classList.remove('dragging'); chips.forEach(function(c){ c.classList.remove('dragover'); }); });
      ch.addEventListener('dragover', function(e){ e.preventDefault(); this.classList.add('dragover'); });
      ch.addEventListener('dragleave', function(){ this.classList.remove('dragover'); });
      ch.addEventListener('drop', function(e){
        e.preventDefault();
        var to = parseInt(this.getAttribute('data-i'),10);
        if(dragI < 0 || dragI === to) return;
        var moved = specSort.values.splice(dragI, 1)[0];
        specSort.values.splice(to, 0, moved);
        renderSortChips();
      });
    });
  }
  window.saveSpecSort = function(){
    var g = form.specGroups[specSort.idx];
    var ordered = specSort.values.map(function(n){
      return g.values.filter(function(v){ return v.name === n; })[0] || { name:n, image:'' };
    });
    g.values = ordered;
    closeSpecSort();
    renderSpecGroups();
  };

  // --- 价格 / 库存 与 规格、单位 联动 ---
  function specCombos(){
    var groups = form.specGroups.filter(function(g){ return g.name && g.values.length; });
    if(!groups.length) return [];
    var combos = [{ key:'', values:{} }];
    groups.forEach(function(g){
      var next = [];
      combos.forEach(function(c){
        g.values.forEach(function(v){
          var vals = {}; for(var k in c.values) vals[k] = c.values[k];
          vals[g.name] = v.name;
          next.push({ key: (c.key ? c.key + ' / ' : '') + v.name, values: vals });
        });
      });
      combos = next;
    });
    return combos;
  }
  function priceUnitNames(){
    var names = [];
    var m = mainUnitName();
    if(m) names.push(m);
    form.units.forEach(function(u){ if(u.unit_name && names.indexOf(u.unit_name) < 0) names.push(u.unit_name); });
    return names;
  }
  function priceUnitLabel(name){
    var idx = -1;
    form.units.forEach(function(u, i){ if(u.unit_name === name) idx = i; });
    if(idx < 0) return name;
    var ref = idx === 0 ? mainUnitName() : form.units[idx-1].unit_name;
    return name + '(1' + name + '=' + (form.units[idx].rel || 1) + ref + ')';
  }
  function blankPriceRow(){ return { code:'', barcode:'', purchase_price:'', retail_price:'', wholesale_price:'', disabled:false }; }
  function blankStockRow(){ return { stock:'', min_stock:'', safe_stock:'', max_stock:'', init_cost:'' }; }

  function refreshSpecDependents(){
    var on = checked('fMultiSpec');
    el('priceSimple').style.display = on ? 'none' : '';
    el('priceMulti').style.display  = on ? '' : 'none';
    el('stockSimple').style.display = on ? 'none' : '';
    el('stockMulti').style.display  = on ? '' : 'none';
    if(!on) return;
    reconcileRows();
    renderPriceTabs();
    renderPriceTable();
    renderStockTable();
  }
  function reconcileRows(){
    var combos = specCombos();
    var keys = combos.map(function(c){ return c.key; });
    var units = priceUnitNames();
    var pr = {};
    units.forEach(function(u){
      var old = form.priceRows[u] || {};
      pr[u] = {};
      keys.forEach(function(k){ pr[u][k] = old[k] || blankPriceRow(); });
    });
    form.priceRows = pr;
    if(units.indexOf(form.priceUnit) < 0) form.priceUnit = units[0] || '';
    var oldS = form.stockRows || {};
    var ns = {};
    keys.forEach(function(k){ ns[k] = oldS[k] || blankStockRow(); });
    form.stockRows = ns;
  }
  window.selectPriceUnit = function(name){
    readPriceTable();
    form.priceUnit = name;
    renderPriceTabs();
    renderPriceTable();
  };
  window.addMorePrice = function(){
    if(!checked('fMultiUnit')){
      el('fMultiUnit').checked = true;
      toggleMultiUnit();
    }
    addUnitRow();
    showToast('请在「单位与规格」中设置新单位');
  };
  function renderPriceTabs(){
    var units = priceUnitNames();
    el('priceUnitTabs').innerHTML = units.map(function(u){
      return '<span class="price-unit-tab' + (u === form.priceUnit ? ' active' : '') + '" onclick="selectPriceUnit(\'' + jsesc(u) + '\')">' + esc(priceUnitLabel(u)) + '</span>';
    }).join('') || '<span class="fhint">请先在「单位与规格」中添加单位</span>';
  }
  function renderPriceTable(){
    var combos = specCombos();
    var groups = form.specGroups.filter(function(g){ return g.name; });
    var unit = form.priceUnit;
    var rows = form.priceRows[unit] || {};
    var h = '<thead><tr>';
    groups.forEach(function(g){ h += '<th>' + esc(g.name) + '</th>'; });
    h += '<th>单位</th>'
      + '<th>编号/货号<span class="th-sub">批量</span></th>'
      + '<th>条形码<span class="th-sub">自动生成</span></th>'
      + '<th>进货价<span class="th-sub">批量</span></th>'
      + '<th>零售价<span class="th-sub">批量</span></th>'
      + '<th>批发价<span class="th-sub">批量</span></th>'
      + '<th>停用</th></tr></thead><tbody>';
    combos.forEach(function(c){
      var r = rows[c.key] || blankPriceRow();
      h += '<tr data-key="' + esc(c.key) + '">';
      groups.forEach(function(g){ h += '<td class="spec-cell">' + esc(c.values[g.name] || '') + '</td>'; });
      h += '<td class="spec-cell">' + esc(unit) + '</td>'
        + '<td><input class="cell-input" data-f="code" value="' + esc(r.code) + '"></td>'
        + '<td><input class="cell-input" data-f="barcode" value="' + esc(r.barcode) + '"></td>'
        + '<td><input class="cell-input" type="number" step="0.01" min="0" data-f="purchase_price" value="' + (r.purchase_price || '') + '"></td>'
        + '<td><input class="cell-input" type="number" step="0.01" min="0" data-f="retail_price" value="' + (r.retail_price || '') + '"></td>'
        + '<td><input class="cell-input" type="number" step="0.01" min="0" data-f="wholesale_price" value="' + (r.wholesale_price || '') + '"></td>'
        + '<td><label class="switch"><input type="checkbox" data-f="disabled" ' + (r.disabled ? 'checked' : '') + '><span class="slider"></span></label></td>'
        + '</tr>';
    });
    h += '</tbody>';
    if(!combos.length){ h += ''; }
    el('priceTable').innerHTML = h;
  }
  function readPriceTable(){
    var unit = form.priceUnit; if(!unit) return;
    if(!form.priceRows[unit]) form.priceRows[unit] = {};
    el('priceTable').querySelectorAll('tbody tr').forEach(function(tr){
      var key = tr.getAttribute('data-key');
      var r = form.priceRows[unit][key] || blankPriceRow();
      tr.querySelectorAll('[data-f]').forEach(function(inp){
        var f = inp.getAttribute('data-f');
        r[f] = inp.type === 'checkbox' ? inp.checked : inp.value;
      });
      form.priceRows[unit][key] = r;
    });
  }
  function renderStockTable(){
    var combos = specCombos();
    var groups = form.specGroups.filter(function(g){ return g.name; });
    var unit = mainUnitName();
    var rows = form.stockRows || {};
    var alert = checked('fAlert');
    var h = '<thead><tr>';
    groups.forEach(function(g){ h += '<th>' + esc(g.name) + '</th>'; });
    h += '<th>单位</th><th>初始库存<span class="th-sub">批量</span></th>';
    if(alert){
      h += '<th>最低库存<span class="th-sub">批量</span></th>'
        + '<th>安全库存<span class="th-sub">批量</span></th>'
        + '<th>最高库存<span class="th-sub">批量</span></th>';
    }
    h += '<th>初始成本<span class="th-sub">批量</span></th></tr></thead><tbody>';
    combos.forEach(function(c){
      var r = rows[c.key] || blankStockRow();
      h += '<tr data-key="' + esc(c.key) + '">';
      groups.forEach(function(g){ h += '<td class="spec-cell">' + esc(c.values[g.name] || '') + '</td>'; });
      h += '<td class="spec-cell">' + esc(unit || '—') + '</td>'
        + '<td><input class="cell-input" type="number" min="0" data-f="stock" value="' + (r.stock || '') + '"></td>';
      if(alert){
        h += '<td><input class="cell-input" type="number" min="0" data-f="min_stock" value="' + (r.min_stock || '') + '"></td>'
          + '<td><input class="cell-input" type="number" min="0" data-f="safe_stock" value="' + (r.safe_stock || '') + '"></td>'
          + '<td><input class="cell-input" type="number" min="0" data-f="max_stock" value="' + (r.max_stock || '') + '"></td>';
      }
      h += '<td><input class="cell-input" type="number" step="0.01" min="0" data-f="init_cost" value="' + (r.init_cost || '') + '"></td>'
        + '</tr>';
    });
    h += '</tbody>';
    el('stockTable').innerHTML = h;
  }
  function readStockTable(){
    var rows = form.stockRows || {};
    el('stockTable').querySelectorAll('tbody tr').forEach(function(tr){
      var key = tr.getAttribute('data-key');
      var r = rows[key] || blankStockRow();
      tr.querySelectorAll('[data-f]').forEach(function(inp){
        r[inp.getAttribute('data-f')] = inp.value;
      });
      rows[key] = r;
    });
    form.stockRows = rows;
  }

  // --- 提交 ---
  window.submitForm = function(saveMore){
    var name = el('fName').value.trim();
    if(!name){ showToast('请输入货品名称', 'error'); el('fName').focus(); return; }

    readUnits();
    if(checked('fMultiUnit')){
      if(!mainUnitName()){ showToast('请先选择主单位', 'error'); return; }
      form.units = form.units.filter(function(u){ return (u.unit_name||'').trim() !== ''; });
      if(!form.units.length){ showToast('启用多单位时请至少选择 1 个辅单位', 'error'); return; }
    }
    if(checked('fMultiSpec')){
      form.specGroups = form.specGroups.filter(function(g){ return (g.name||'').trim() !== ''; });
      if(!form.specGroups.length){ showToast('启用多规格时请至少添加 1 组规格', 'error'); return; }
      for(var gi = 0; gi < form.specGroups.length; gi++){
        if(!form.specGroups[gi].values.length){
          showToast('规格「' + form.specGroups[gi].name + '」至少添加 1 个规格值', 'error');
          return;
        }
      }
      readPriceTable(); readStockTable();
    }

    var body = {
      name: name,
      code: el('fCode').value.trim(),
      barcode: el('fBarcode').value.trim(),
      remark: el('fRemark').value.trim(),
      spec: '',
      brand: form.brand || '',
      origin: el('fOrigin').value.trim(),
      category_id: el('fCategory').value ? parseInt(el('fCategory').value,10) : null,
      unit_id: el('fUnit').value ? parseInt(el('fUnit').value,10) : null,
      supplier_id: form.suppliers.length ? form.suppliers[0] : null,
      suppliers: JSON.stringify(form.suppliers),
      has_multi_unit: checked('fMultiUnit') ? 1 : 0,
      has_multi_spec: checked('fMultiSpec') ? 1 : 0,
      sales_unit: checked('fMultiUnit') ? (el('fSalesUnit').value || '') : '',
      purchase_unit: checked('fMultiUnit') ? (el('fPurchaseUnit').value || '') : '',
      enable_stock_alert: checked('fAlert') ? 1 : 0,
      init_cost: num('fInitCost'),
      current_stock: int('fStock'),
      min_stock: checked('fAlert') ? int('fMinStock') : 0,
      max_stock: checked('fAlert') ? int('fMaxStock') : 0,
      purchase_price: num('fPurchasePrice'),
      retail_price: num('fRetailPrice'),
      wholesale_price: num('fWholesalePrice'),
      images: JSON.stringify(form.images),
      image_url: form.images[0] || '',
      units: (function(){
        if(!checked('fMultiUnit')) return [];
        var rels = form.units.map(function(u){ return parseFloat(u.rel) || 1; });
        var abs = relToAbs(rels);
        return form.units.map(function(u, i){
          return {
            unit_id: u.unit_id || null,
            unit_name: u.unit_name || '',
            factor: abs[i],
            is_main: 0
          };
        });
      })(),
      specs: [],
      spec_groups: checked('fMultiSpec') ? JSON.stringify(form.specGroups) : '',
      price_rows: checked('fMultiSpec') ? JSON.stringify(form.priceRows) : '',
      stock_rows: checked('fMultiSpec') ? JSON.stringify(form.stockRows) : ''
    };

    var isEdit = form.editId != null;
    var url = isEdit ? '/api/shop/goods/' + form.editId : '/api/shop/goods';
    var method = isEdit ? 'PUT' : 'POST';
    el('saveBtn').disabled = true; el('saveMoreBtn').disabled = true;
    el('drawerHint').textContent = '保存中…';

    apiFetch(url, { method: method, body: body }).then(function(res){
      if(res.code !== 0){ showToast(res.message || '保存失败', 'error'); return; }
      showToast(isEdit ? '修改成功' : '新增成功', 'success');
      if(saveMore && !isEdit){
        resetForm();
        el('fName').focus();
      }else{
        closeDrawer();
      }
      loadData(state.page);
    }).catch(function(e){
      if(e.message !== 'Unauthorized') showToast('网络错误', 'error');
    }).then(function(){
      el('saveBtn').disabled = false; el('saveMoreBtn').disabled = false;
      el('drawerHint').textContent = '';
    });
  };

  // --- Delete ---
  window.deleteItem = function(id){
    if(!confirm('确定要删除该货品吗？')) return;
    apiFetch('/api/shop/goods/' + id, { method: 'DELETE' }).then(function(res){
      if(res.code !== 0){ showToast(res.message || '删除失败', 'error'); return; }
      showToast('删除成功', 'success');
      var totalPages = Math.ceil(state.total / state.pageSize);
      if(state.page > totalPages && totalPages > 0) state.page = totalPages;
      loadData(state.page);
    }).catch(function(e){
      if(e.message !== 'Unauthorized') showToast('网络错误', 'error');
    });
  };

  // --- Export ---
  window.exportData = function(){
    showToast('导出功能开发中', 'info');
  };

  // --- Toast ---
  function showToast(msg, type){
    type = type || 'info';
    var c = document.getElementById('toastContainer');
    var t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(function(){
      t.style.animation = 'toastOut .3s ease forwards';
      setTimeout(function(){ t.remove(); }, 300);
    }, 3000);
  }
  window.showToast = showToast;

  // --- Helpers ---
  function esc(s){
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }
  function fmtPrice(v){
    if(v == null || v === '') return '0.00';
    return parseFloat(v).toFixed(2);
  }

  // --- Keyboard shortcut ---
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeDrawer();
  });

  function checkAuth() {
  if (!localStorage.getItem('pisa_token')) { location.href = '/login.html'; }
}

// --- Init ---
  checkAuth();
  loadMeta().then(function(){
    loadData(1);
    // 通过标签页回到「添加货品」时，自动打开抽屉
    if(location.hash === '#goods:add') showCreate();
  });
})();
</script>
